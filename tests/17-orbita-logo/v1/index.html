<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITA — Logo Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #05060d;
    --bg1: #0c1030;
    --ink: #f3f1ff;
    --accent: #ff7a3d;
    --accent2: #7b8cff;
    --elastic: linear(0, 0.221, 0.479, 0.73, 0.94, 1.093, 1.187, 1.227, 1.223, 1.191, 1.142, 1.089, 1.041, 1.001, 0.974, 0.959, 0.954, 0.957, 0.965, 0.975, 0.986, 0.995, 1.002, 1.006, 1.008, 1.009, 1.008, 1.006, 1.004, 1.002, 1.001, 0.999, 0.999, 0.999, 0.999, 0.999, 0.999, 1, 1, 1, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 45%, var(--bg1) 0%, var(--bg0) 70%),
      var(--bg0);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 64% 82%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 70%, #fff5 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 58%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 8% 88%, #fff5 50%, transparent 51%),
      radial-gradient(1px 1px at 48% 8%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 92%, #fff4 50%, transparent 51%);
    pointer-events: none;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .5; } to { opacity: 1; } }

  .stage {
    width: min(92vw, 1000px);
    display: flex; flex-direction: column; align-items: center; gap: 2rem;
  }
  svg.logo { width: 100%; height: auto; overflow: visible; display: block; }

  /* ---------- Orbit draw-on ---------- */
  .orbit {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 1.4s cubic-bezier(.65,0,.35,1) .1s forwards;
  }
  .orbit-glow {
    fill: none;
    stroke: var(--accent2);
    stroke-width: 10;
    opacity: 0;
    filter: url(#blur);
    animation: glowIn 1s ease 1.3s forwards, breathe 4s ease-in-out 4s infinite;
  }
  .orbit-dash {
    fill: none;
    stroke: #ffffff22;
    stroke-width: 1;
    stroke-dasharray: 2 10;
    transform-box: view-box;
    transform-origin: 500px 270px;
    opacity: 0;
    animation: fadeIn 1s ease 1.6s forwards, spin 40s linear 1.6s infinite;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glowIn { to { opacity: .35; } }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .6; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Planet along offset-path ---------- */
  .planet {
    offset-path: path("M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80");
    offset-rotate: 0deg;
    offset-distance: 0%;
    opacity: 0;
    animation:
      travel 1.4s cubic-bezier(.65,0,.35,1) .1s forwards,
      appear .2s ease .1s forwards,
      idleOrbit 12s linear 1.5s infinite;
  }
  .planet .halo { animation: pulse 2.4s ease-in-out 1.5s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes travel { to { offset-distance: 100%; } }
  @keyframes appear { to { opacity: 1; } }
  @keyframes idleOrbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.35); opacity: .2; } }

  /* ---------- Letters: staggered elastic drop ---------- */
  .letter text {
    font-family: "Unbounded", "Arial Black", "Helvetica Neue", sans-serif;
    font-weight: 700;
    font-size: 118px;
    fill: var(--ink);
    text-anchor: middle;
  }
  .letter .drop {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    opacity: 0;
    transform: translateY(-280px);
    animation:
      drop 1.1s var(--elastic) calc(1.0s + var(--i) * .11s) forwards,
      show .25s linear calc(1.0s + var(--i) * .11s) forwards;
  }
  .letter .float {
    animation: float 3.2s ease-in-out calc(4s + var(--i) * .18s) infinite;
  }
  @keyframes drop {
    from { transform: translateY(-280px) scaleY(1.15); }
    to   { transform: translateY(0) scaleY(1); }
  }
  @keyframes show { to { opacity: 1; } }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }

  /* ---------- Light sweep ---------- */
  .sweep {
    transform: translateX(-420px) skewX(-20deg);
    animation: sweep 1s cubic-bezier(.5,0,.3,1) 2.75s forwards, resweep 7s ease-in-out 6s infinite;
  }
  @keyframes sweep {
    from { transform: translateX(-420px) skewX(-20deg); }
    to   { transform: translateX(1100px) skewX(-20deg); }
  }
  @keyframes resweep {
    0%, 80% { transform: translateX(-420px) skewX(-20deg); }
    100%    { transform: translateX(1100px) skewX(-20deg); }
  }

  /* ---------- Tagline ---------- */
  .tagline {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 20px;
    letter-spacing: 14px;
    fill: #c9c6ffcc;
    text-anchor: middle;
    opacity: 0;
    animation: tagIn .8s ease 3.2s forwards;
  }
  @keyframes tagIn {
    from { opacity: 0; letter-spacing: 4px; }
    to   { opacity: 1; letter-spacing: 14px; }
  }

  /* ---------- Replay ---------- */
  .replay {
    font: 500 14px/1 "Space Grotesk", system-ui, sans-serif;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink);
    background: #ffffff0d;
    border: 1px solid #ffffff2a;
    border-radius: 999px;
    padding: .9em 1.6em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: .6em;
    transition: background .25s, border-color .25s, transform .25s;
    opacity: 0;
    animation: fadeIn .6s ease 3.6s forwards;
  }
  .replay:hover { background: #ffffff1a; border-color: var(--accent); transform: translateY(-1px); }
  .replay:active { transform: translateY(1px); }
  .replay svg { width: 1.1em; height: 1.1em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <svg class="logo" id="logo" viewBox="0 0 1000 560" role="img" aria-label="ORBITA studio logo">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7b8cff"/>
        <stop offset=".55" stop-color="#c38bff"/>
        <stop offset="1" stop-color="#ff7a3d"/>
      </linearGradient>
      <radialGradient id="planetGrad" cx="35%" cy="35%" r="70%">
        <stop offset="0" stop-color="#ffe2b8"/>
        <stop offset=".45" stop-color="#ff7a3d"/>
        <stop offset="1" stop-color="#8a1f3a"/>
      </radialGradient>
      <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <clipPath id="wordClip">
        <text x="250" y="315" style="font:700 118px Unbounded, 'Arial Black', sans-serif; text-anchor:middle">O</text>
        <text x="350" y="315" style="font:700 118px Unbounded, 'Arial Black', sans-serif; text-anchor:middle">R</text>
        <text x="450" y="315" style="font:700 118px Unbounded, 'Arial Black', sans-serif; text-anchor:middle">B</text>
        <text x="550" y="315" style="font:700 118px Unbounded, 'Arial Black', sans-serif; text-anchor:middle">I</text>
        <text x="650" y="315" style="font:700 118px Unbounded, 'Arial Black', sans-serif; text-anchor:middle">T</text>
        <text x="750" y="315" style="font:700 118px Unbounded, 'Arial Black', sans-serif; text-anchor:middle">A</text>
      </clipPath>
    </defs>

    <!-- orbit -->
    <path class="orbit-glow" pathLength="1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <circle class="orbit-dash" cx="500" cy="270" r="214"/>
    <path class="orbit" pathLength="1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>

    <!-- wordmark -->
    <g class="word">
      <g class="letter" style="--i:0"><g class="float"><text class="drop" x="250" y="315">O</text></g></g>
      <g class="letter" style="--i:1"><g class="float"><text class="drop" x="350" y="315">R</text></g></g>
      <g class="letter" style="--i:2"><g class="float"><text class="drop" x="450" y="315">B</text></g></g>
      <g class="letter" style="--i:3"><g class="float"><text class="drop" x="550" y="315">I</text></g></g>
      <g class="letter" style="--i:4"><g class="float"><text class="drop" x="650" y="315">T</text></g></g>
      <g class="letter" style="--i:5"><g class="float"><text class="drop" x="750" y="315">A</text></g></g>
    </g>

    <!-- light sweep clipped to wordmark -->
    <g clip-path="url(#wordClip)">
      <rect class="sweep" x="0" y="160" width="180" height="200" fill="url(#sweepGrad)"/>
    </g>

    <!-- planet -->
    <g class="planet">
      <circle class="halo" r="22" fill="#ff7a3d" opacity=".5" filter="url(#blur)"/>
      <circle r="13" fill="url(#planetGrad)"/>
    </g>

    <text class="tagline" x="500" y="525">CREATIVE STUDIO</text>
  </svg>

  <button class="replay" id="replay" type="button" aria-label="Replay animation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    Replay
  </button>
</main>

<script>
  // Replay: swap in a fresh clone so every CSS animation restarts from 0.
  const btn = document.getElementById('replay');
  btn.addEventListener('click', () => {
    const old = document.getElementById('logo');
    const fresh = old.cloneNode(true);
    old.replaceWith(fresh);
    btn.style.animation = 'none';
    btn.offsetWidth;
    btn.style.animation = '';
  });
</script>
</body>
</html>
