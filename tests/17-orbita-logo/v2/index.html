<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBITA — Logo Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #05060d;
    --bg1: #0d1236;
    --ink: #f3f1ff;
    --accent: #ff7a3d;
    --accent2: #7b8cff;
    --ease-io: cubic-bezier(.65,0,.35,1);
    --elastic: linear(0, 0.221, 0.479, 0.73, 0.94, 1.093, 1.187, 1.227, 1.223, 1.191, 1.142, 1.089, 1.041, 1.001, 0.974, 0.959, 0.954, 0.957, 0.965, 0.975, 0.986, 0.995, 1.002, 1.006, 1.008, 1.009, 1.008, 1.006, 1.004, 1.002, 1.001, 0.999, 0.999, 0.999, 0.999, 0.999, 0.999, 1, 1, 1, 1);
    --orbit: path("M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, var(--bg1) 0%, var(--bg0) 75%),
      var(--bg0);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body::before, body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
  }
  /* starfield, two layers twinkling out of phase */
  body::before {
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff9 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 64% 82%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 70%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 58%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 8% 88%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 48% 8%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 92%, #fff5 50%, transparent 51%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  body::after {
    background-image:
      radial-gradient(1px 1px at 22% 40%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 30%, #c9d0ff88 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 38% 92%, #ffd7c288 50%, transparent 51%),
      radial-gradient(1px 1px at 96% 24%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 4% 52%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 56% 60%, #fff4 50%, transparent 51%);
    animation: twinkle 7s ease-in-out 2s infinite alternate-reverse;
  }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  .stage {
    width: min(94vw, 1000px);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(1rem, 3vh, 2rem);
    padding: 16px env(safe-area-inset-right) max(16px, env(safe-area-inset-bottom)) env(safe-area-inset-left);
  }
  svg.logo { width: 100%; height: auto; max-height: 78vh; overflow: visible; display: block; }

  /* ---------- Orbit draw-on ---------- */
  .orbit {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 1 1;
    stroke-dashoffset: 1;
    animation: draw 1.4s var(--ease-io) .1s forwards;
  }
  /* soft glow made of stacked strokes (no blur filter → cheap repaints) */
  .orbit-glow { fill: none; stroke: var(--accent2); opacity: 0; }
  .orbit-glow.g1 { stroke-width: 9;  --o: .10; }
  .orbit-glow.g2 { stroke-width: 18; --o: .05; }
  .orbit-glow.g3 { stroke-width: 34; --o: .025; }
  .orbit-glow { animation: glowIn 1s ease 1.3s forwards, breathe 4s ease-in-out 4s infinite; }
  .orbit-dash {
    fill: none;
    stroke: #ffffff26;
    stroke-width: 1;
    stroke-dasharray: 2 10;
    transform-box: view-box;
    transform-origin: 500px 270px;
    opacity: 0;
    animation: fadeIn 1s ease 1.6s forwards, spin 40s linear 1.6s infinite;
  }
  .shock {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 2;
    transform-box: view-box;
    transform-origin: 500px 270px;
    opacity: 0;
    animation: shock 1.1s cubic-bezier(.2,.7,.3,1) 1.45s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glowIn { to { opacity: var(--o); } }
  @keyframes breathe { 0%,100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * 2); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shock {
    from { opacity: .7; transform: scale(1); }
    to   { opacity: 0;  transform: scale(1.32); }
  }

  /* ---------- Comet trail (synced with the idle orbit) ---------- */
  .trails {
    transform-box: view-box;
    transform-origin: 500px 270px;
    opacity: 0;
    /* rotating the group keeps the tail locked to the planet's linear idle orbit */
    animation: fadeIn .6s ease 1.5s forwards, spin 12s linear 1.5s infinite;
  }
  .trail { fill: none; stroke-linecap: round; }
  .trail.t1 { stroke-dasharray: .14 .86; stroke-dashoffset: .14; stroke-width: 7;   stroke: #ff7a3d30; }
  .trail.t2 { stroke-dasharray: .08 .92; stroke-dashoffset: .08; stroke-width: 3.5; stroke: #ff9a5c80; }
  .trail.t3 { stroke-dasharray: .03 .97; stroke-dashoffset: .03; stroke-width: 2;   stroke: #ffc09aa8; }

  /* ---------- Planet along offset-path ---------- */
  .planet {
    offset-path: var(--orbit);
    offset-rotate: 0deg;
    offset-distance: 0%;
    opacity: 0;
    animation:
      travel 1.4s var(--ease-io) .1s forwards,
      appear .2s ease .1s forwards,
      idleOrbit 12s linear 1.5s infinite;
  }
  .planet .halo { animation: pulse 2.4s ease-in-out 1.5s infinite; transform-box: fill-box; transform-origin: center; }
  .planet .moonlet { animation: moon 3s linear infinite; transform-box: view-box; transform-origin: 0 0; }
  @keyframes travel { to { offset-distance: 100%; } }
  @keyframes appear { to { opacity: 1; } }
  @keyframes idleOrbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.3); opacity: .45; } }
  @keyframes moon { to { transform: rotate(360deg); } }

  /* ---------- Letters: staggered elastic drop ---------- */
  .letter text, #wordClip text {
    font-family: "Unbounded", "Arial Black", "Helvetica Neue", sans-serif;
    font-weight: 700;
    font-size: 112px;
    text-anchor: middle;
  }
  .letter text { fill: url(#letterGrad); }
  .letter .drop {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    opacity: 0;
    transform: translateY(-280px);
    animation:
      drop 1.1s var(--elastic) calc(1.0s + var(--i) * .11s) forwards,
      show .25s linear calc(1.0s + var(--i) * .11s) forwards;
  }
  .letter .float {
    animation: float 3.2s ease-in-out calc(4s + var(--i) * .18s) infinite;
  }
  .letter .shadow {
    fill: #000;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: shadow 1.1s var(--elastic) calc(1.0s + var(--i) * .11s) forwards;
  }
  @keyframes drop {
    from { transform: translateY(-280px) scaleY(1.18) scaleX(.9); }
    to   { transform: translateY(0) scaleY(1) scaleX(1); }
  }
  @keyframes show { to { opacity: 1; } }
  @keyframes shadow {
    from { opacity: 0;   transform: scaleX(.2); }
    to   { opacity: .32; transform: scaleX(1); }
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-5px); }
  }

  /* ---------- Light sweep ---------- */
  .sweep {
    transform: translateX(-420px) skewX(-20deg);
    animation: sweep 1.05s cubic-bezier(.45,0,.25,1) 2.7s forwards, resweep 7s ease-in-out 6s infinite;
  }
  @keyframes sweep {
    from { transform: translateX(-420px) skewX(-20deg); }
    to   { transform: translateX(1100px) skewX(-20deg); }
  }
  @keyframes resweep {
    0%, 82% { transform: translateX(-420px) skewX(-20deg); }
    100%    { transform: translateX(1100px) skewX(-20deg); }
  }

  /* ---------- Tagline ---------- */
  .tagline {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 20px;
    letter-spacing: 14px;
    fill: #c9c6ffcc;
    text-anchor: middle;
    opacity: 0;
    animation: tagIn .9s ease 3.15s forwards;
  }
  @keyframes tagIn {
    from { opacity: 0; letter-spacing: 4px; }
    to   { opacity: 1; letter-spacing: 14px; }
  }

  /* ---------- Replay ---------- */
  .replay {
    font: 500 14px/1 "Space Grotesk", system-ui, sans-serif;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink);
    background: #ffffff0d;
    border: 1px solid #ffffff2a;
    border-radius: 999px;
    padding: .95em 1.7em;
    min-height: 44px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: .6em;
    transition: background .25s, border-color .25s, transform .25s, box-shadow .25s;
    opacity: 0;
    animation: fadeIn .6s ease 3.6s forwards;
  }
  .replay:hover { background: #ffffff1a; border-color: var(--accent); box-shadow: 0 0 24px #ff7a3d33; transform: translateY(-1px); }
  .replay:hover svg { transform: rotate(-200deg); }
  .replay:active { transform: translateY(1px); }
  .replay:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }
  .replay svg { width: 1.1em; height: 1.1em; transition: transform .6s var(--ease-io); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    .planet { offset-distance: 12%; }
  }
</style>
</head>
<body>
<main class="stage">
  <svg class="logo" id="logo" viewBox="0 0 1000 560" role="img" aria-label="ORBITA creative studio logo">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7b8cff"/>
        <stop offset=".55" stop-color="#c38bff"/>
        <stop offset="1" stop-color="#ff7a3d"/>
      </linearGradient>
      <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eeeaff"/>
        <stop offset=".6" stop-color="#c7c3f5"/>
        <stop offset="1" stop-color="#8f8ad8"/>
      </linearGradient>
      <radialGradient id="planetGrad" cx="35%" cy="32%" r="72%">
        <stop offset="0" stop-color="#fff1d6"/>
        <stop offset=".4" stop-color="#ff8a4a"/>
        <stop offset=".85" stop-color="#a3264a"/>
        <stop offset="1" stop-color="#4a0f2e"/>
      </radialGradient>
      <radialGradient id="haloGrad">
        <stop offset="0" stop-color="#ff7a3d" stop-opacity=".55"/>
        <stop offset=".45" stop-color="#ff7a3d" stop-opacity=".18"/>
        <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="coreGlow">
        <stop offset="0" stop-color="#5a62d8" stop-opacity=".28"/>
        <stop offset="1" stop-color="#5a62d8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shadowGrad">
        <stop offset="0" stop-color="#000" stop-opacity="1"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#ffb37a" stop-opacity="0"/>
        <stop offset=".35" stop-color="#ffd2ad" stop-opacity=".55"/>
        <stop offset=".5"  stop-color="#ffffff" stop-opacity="1"/>
        <stop offset=".65" stop-color="#c9d0ff" stop-opacity=".55"/>
        <stop offset="1"   stop-color="#7b8cff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="wordClip">
        <text x="250" y="315">O</text>
        <text x="350" y="315">R</text>
        <text x="450" y="315">B</text>
        <text x="550" y="315">I</text>
        <text x="650" y="315">T</text>
        <text x="750" y="315">A</text>
      </clipPath>
    </defs>

    <!-- inner nebula -->
    <circle cx="500" cy="270" r="230" fill="url(#coreGlow)"/>

    <!-- orbit -->
    <path class="orbit-glow g3" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <path class="orbit-glow g2" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <path class="orbit-glow g1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <circle class="orbit-dash" cx="500" cy="270" r="214"/>
    <path class="orbit" pathLength="1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <circle class="shock" cx="500" cy="270" r="190"/>

    <!-- comet trail -->
    <g class="trails">
    <path class="trail t1" pathLength="1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <path class="trail t2" pathLength="1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    <path class="trail t3" pathLength="1" d="M500,80 A190,190 0 1 1 500,460 A190,190 0 1 1 500,80"/>
    </g>

    <!-- wordmark -->
    <g class="word">
      <g class="letter" style="--i:0"><ellipse class="shadow" cx="250" cy="322" rx="40" ry="5" fill="url(#shadowGrad)"/><g class="float"><text class="drop" x="250" y="315">O</text></g></g>
      <g class="letter" style="--i:1"><ellipse class="shadow" cx="350" cy="322" rx="40" ry="5" fill="url(#shadowGrad)"/><g class="float"><text class="drop" x="350" y="315">R</text></g></g>
      <g class="letter" style="--i:2"><ellipse class="shadow" cx="450" cy="322" rx="40" ry="5" fill="url(#shadowGrad)"/><g class="float"><text class="drop" x="450" y="315">B</text></g></g>
      <g class="letter" style="--i:3"><ellipse class="shadow" cx="550" cy="322" rx="40" ry="5" fill="url(#shadowGrad)"/><g class="float"><text class="drop" x="550" y="315">I</text></g></g>
      <g class="letter" style="--i:4"><ellipse class="shadow" cx="650" cy="322" rx="40" ry="5" fill="url(#shadowGrad)"/><g class="float"><text class="drop" x="650" y="315">T</text></g></g>
      <g class="letter" style="--i:5"><ellipse class="shadow" cx="750" cy="322" rx="40" ry="5" fill="url(#shadowGrad)"/><g class="float"><text class="drop" x="750" y="315">A</text></g></g>
    </g>

    <!-- light sweep clipped to wordmark (appears after letters land) -->
    <g clip-path="url(#wordClip)">
      <rect class="sweep" x="0" y="160" width="220" height="200" fill="url(#sweepGrad)"/>
    </g>

    <!-- planet -->
    <g class="planet">
      <circle class="halo" r="34" fill="url(#haloGrad)"/>
      <circle r="13" fill="url(#planetGrad)"/>
      <g class="moonlet"><circle cx="24" cy="0" r="2.2" fill="#e6e3ff"/></g>
    </g>

    <text class="tagline" x="500" y="525">CREATIVE STUDIO</text>
  </svg>

  <button class="replay" id="replay" type="button" aria-label="Replay animation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    Replay
  </button>
</main>

<script>
  // All motion is CSS + SVG. JS only (1) kerns the wordmark from real glyph widths,
  // (2) tightens the viewBox on portrait screens, (3) restarts the timeline on Replay.
  const CX = 500, TRACK = 0.07;

  function layout(svg) {
    const drops = [...svg.querySelectorAll('.letter .drop')];
    const shadows = [...svg.querySelectorAll('.letter .shadow')];
    const clips = [...svg.querySelectorAll('#wordClip text')];
    const widths = drops.map(t => { try { return t.getComputedTextLength(); } catch { return 90; } });
    if (widths.some(w => !w)) return;
    const fs = parseFloat(getComputedStyle(drops[0]).fontSize) || 112;
    const gap = fs * TRACK;
    const total = widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1);
    let x = CX - total / 2;
    widths.forEach((w, i) => {
      const c = (x + w / 2).toFixed(1);
      drops[i].setAttribute('x', c);
      clips[i].setAttribute('x', c);
      shadows[i].setAttribute('cx', c);
      shadows[i].setAttribute('rx', (w * 0.42).toFixed(1));
      x += w + gap;
    });
  }

  const portrait = matchMedia('(max-aspect-ratio: 4/5)');
  function frame(svg) {
    svg.setAttribute('viewBox', portrait.matches ? '150 40 700 510' : '0 0 1000 560');
  }

  let logo = document.getElementById('logo');
  frame(logo); layout(logo);
  document.fonts && document.fonts.ready.then(() => layout(logo));
  portrait.addEventListener('change', () => frame(logo));

  const btn = document.getElementById('replay');
  btn.addEventListener('click', () => {
    const fresh = logo.cloneNode(true);   // a fresh node restarts every CSS animation at t=0
    logo.replaceWith(fresh);
    logo = fresh;
    btn.style.animation = 'none';
    void btn.offsetWidth;
    btn.style.animation = '';
  });
</script>
</body>
</html>
