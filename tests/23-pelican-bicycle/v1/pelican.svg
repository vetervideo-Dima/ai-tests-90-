<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#e8862a"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8dde3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="45" fill="#fff3a8"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="195" cy="80" rx="45" ry="25"/>
    <ellipse cx="520" cy="60" rx="50" ry="18"/>
  </g>
  <rect y="515" width="800" height="85" fill="#7bbf5a"/>
  <rect y="515" width="800" height="8" fill="#5e9e42"/>
  <ellipse cx="410" cy="525" rx="300" ry="10" fill="#000" opacity="0.15"/>

  <!-- Bicycle -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <g fill="none">
      <circle cx="250" cy="420" r="100" stroke="#222" stroke-width="10"/>
      <circle cx="250" cy="420" r="92" stroke="#888" stroke-width="2"/>
      <circle cx="570" cy="420" r="100" stroke="#222" stroke-width="10"/>
      <circle cx="570" cy="420" r="92" stroke="#888" stroke-width="2"/>
    </g>
    <!-- Spokes -->
    <g stroke="#aaa" stroke-width="1.5">
      <line x1="250" y1="328" x2="250" y2="512"/>
      <line x1="158" y1="420" x2="342" y2="420"/>
      <line x1="185" y1="355" x2="315" y2="485"/>
      <line x1="185" y1="485" x2="315" y2="355"/>
      <line x1="570" y1="328" x2="570" y2="512"/>
      <line x1="478" y1="420" x2="662" y2="420"/>
      <line x1="505" y1="355" x2="635" y2="485"/>
      <line x1="505" y1="485" x2="635" y2="355"/>
    </g>
    <circle cx="250" cy="420" r="8" fill="#555"/>
    <circle cx="570" cy="420" r="8" fill="#555"/>

    <!-- Frame -->
    <g stroke="#d6283b" stroke-width="9" fill="none">
      <!-- chain stay -->
      <line x1="250" y1="420" x2="390" y2="430"/>
      <!-- seat stay -->
      <line x1="250" y1="420" x2="348" y2="295"/>
      <!-- seat tube -->
      <line x1="390" y1="430" x2="342" y2="280"/>
      <!-- top tube -->
      <line x1="348" y1="295" x2="528" y2="290"/>
      <!-- down tube -->
      <line x1="390" y1="430" x2="535" y2="315"/>
      <!-- head tube -->
      <line x1="525" y1="275" x2="540" y2="325"/>
    </g>
    <!-- Fork -->
    <line x1="540" y1="320" x2="570" y2="420" stroke="#999" stroke-width="7" stroke-linecap="round"/>
    <!-- Stem and handlebar -->
    <path d="M525 278 L520 250 L495 245 Q485 244 487 256" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <!-- Seat post + saddle -->
    <line x1="342" y1="280" x2="338" y2="265" stroke="#999" stroke-width="7"/>
    <path d="M305 262 Q335 252 365 262 L360 270 Q335 266 310 270 Z" fill="#222"/>

    <!-- Chainring and chain -->
    <circle cx="390" cy="430" r="22" fill="none" stroke="#555" stroke-width="5"/>
    <path d="M390 408 L250 412 M390 452 L250 428" stroke="#444" stroke-width="2.5"/>
  </g>

  <!-- Back leg (behind) -->
  <g stroke="#e8862a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M345 255 L395 330 L372 398"/>
  </g>
  <!-- Back crank + pedal -->
  <line x1="390" y1="430" x2="370" y2="396" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="356" y="390" width="28" height="8" rx="2" fill="#333"/>
  <path d="M360 398 l-12 6 M372 398 l0 10 M384 398 l12 6" stroke="#e8862a" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Pelican -->
  <g id="pelican" stroke-linejoin="round" stroke-linecap="round">
    <!-- Tail -->
    <path d="M270 210 L225 195 L232 215 L218 225 L265 240 Z" fill="#c9ced4" stroke="#8a9199" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="335" cy="220" rx="88" ry="55" fill="url(#bodyGrad)" stroke="#8a9199" stroke-width="2.5" transform="rotate(-12 335 220)"/>
    <!-- Neck -->
    <path d="M385 195 C405 170 395 150 420 125 L445 135 C425 160 435 180 410 215 Z" fill="url(#bodyGrad)" stroke="#8a9199" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="440" cy="115" r="27" fill="#ffffff" stroke="#8a9199" stroke-width="2.5"/>
    <!-- Crest -->
    <path d="M425 92 Q430 75 445 82 Q440 88 438 92" fill="#f4e7a6" stroke="#c9b25a" stroke-width="1.5"/>
    <!-- Pouch (lower beak) -->
    <path d="M455 125 Q520 190 615 140 L612 133 Q530 145 458 115 Z" fill="url(#pouch)" stroke="#b5651d" stroke-width="2"/>
    <!-- Upper beak -->
    <path d="M458 105 Q540 112 622 132 Q628 136 615 140 Q540 128 460 122 Z" fill="#f7c948" stroke="#b5651d" stroke-width="2"/>
    <path d="M612 128 Q625 133 619 140" fill="#d9822b"/>
    <!-- Eye -->
    <circle cx="447" cy="108" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="449" cy="108" r="3" fill="#111"/>
    <!-- Wing reaching to handlebar -->
    <path d="M300 195 C350 175 420 200 470 235 L492 248 L478 252 L486 260 L465 258 C420 250 360 245 310 235 Z"
          fill="#e6eaee" stroke="#8a9199" stroke-width="2.5"/>
    <path d="M330 210 Q390 215 440 235 M330 225 Q380 232 430 245" fill="none" stroke="#a9b0b8" stroke-width="1.5"/>
    <!-- Wing tip feathers gripping bar -->
    <path d="M470 240 Q492 238 495 252" fill="none" stroke="#3a3f45" stroke-width="5"/>
  </g>

  <!-- Front leg -->
  <g stroke="#f08c2e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 258 L432 350 L412 462"/>
  </g>
  <!-- Front crank + pedal -->
  <line x1="390" y1="430" x2="410" y2="464" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <rect x="396" y="460" width="30" height="9" rx="2" fill="#222"/>
  <path d="M400 462 l-14 8 M412 462 l0 12 M424 462 l14 8" stroke="#f08c2e" stroke-width="6" stroke-linecap="round"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="330" x2="130" y2="330"/>
    <line x1="40" y1="380" x2="120" y2="380"/>
    <line x1="70" y1="430" x2="135" y2="430"/>
  </g>
</svg>
