<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background:#bfe6fb">
  <title>A pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-600" x2="0" y2="520">
      <stop offset="0" stop-color="#3f8fd6"/>
      <stop offset="0.55" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#fff3a8"/>
      <stop offset="1" stop-color="#fff3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" gradientUnits="userSpaceOnUse" x1="0" y1="515" x2="0" y2="1300">
      <stop offset="0" stop-color="#86c862"/>
      <stop offset="0.15" stop-color="#6aae4c"/>
      <stop offset="1" stop-color="#3f7a2e"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd39a"/>
      <stop offset="1" stop-color="#7cba78"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#e07a22"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#f2b33d"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#c3cad2"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#b9c1ca"/>
    </linearGradient>
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="0" y1="270" x2="0" y2="440">
      <stop offset="0" stop-color="#ff5a6b"/>
      <stop offset="0.5" stop-color="#d6283b"/>
      <stop offset="1" stop-color="#9c1526"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#eee"/>
      <stop offset="1" stop-color="#555"/>
    </radialGradient>
    <g id="spokes" stroke="#b8c0c8" stroke-width="1.6">
      <line x1="0" y1="-92" x2="0" y2="92"/>
      <line x1="-92" y1="0" x2="92" y2="0"/>
      <line x1="-65" y1="-65" x2="65" y2="65"/>
      <line x1="-65" y1="65" x2="65" y2="-65"/>
      <line x1="-35" y1="-85" x2="35" y2="85"/>
      <line x1="-85" y1="-35" x2="85" y2="35"/>
      <line x1="-35" y1="85" x2="35" y2="-85"/>
      <line x1="-85" y1="35" x2="85" y2="-35"/>
      <circle r="4" cy="-96" fill="#999" stroke="none"/>
    </g>
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="60" ry="22"/>
      <ellipse cx="40" cy="-10" rx="42" ry="26"/>
      <ellipse cx="-30" cy="-8" rx="30" ry="18"/>
    </g>
    <g id="tuft" fill="none" stroke="#4f8f39" stroke-width="3" stroke-linecap="round">
      <path d="M0 0 q-3 -10 -8 -14 M0 0 q0 -12 2 -18 M0 0 q4 -9 10 -12"/>
    </g>
  </defs>

  <!-- Background (extends beyond viewBox so any aspect ratio is filled) -->
  <rect x="-2000" y="-1200" width="4800" height="1720" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="120" fill="url(#sunGlow)"/>
  <circle cx="680" cy="90" r="42" fill="#fff6b8"/>

  <g opacity="0.92">
    <use href="#cloud" x="150" y="90"/>
    <use href="#cloud" x="520" y="55" transform="scale(1)"/>
    <use href="#cloud" x="900" y="120"/>
    <use href="#cloud" x="-250" y="40"/>
    <animateTransform attributeName="transform" type="translate" from="300 0" to="-500 0" dur="60s" repeatCount="indefinite"/>
  </g>

  <!-- Distant hills, drifting slowly (parallax) -->
  <g>
    <path d="M-2000 520 L-2000 470 Q-1700 400 -1400 470 Q-1100 420 -800 470 Q-500 400 -200 470 Q100 410 400 470 Q700 395 1000 470 Q1300 420 1600 470 Q1900 400 2200 470 Q2500 420 2800 470 L2800 520 Z" fill="url(#hills)"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="30s" repeatCount="indefinite"/>
  </g>

  <rect x="-2000" y="515" width="4800" height="900" fill="url(#grass)"/>
  <rect x="-2000" y="515" width="4800" height="6" fill="#5e9e42"/>
  <!-- road stripe -->
  <line x1="-2000" y1="560" x2="2800" y2="560" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.1s" repeatCount="indefinite"/>
  </line>
  <g>
    <use href="#tuft" x="-300" y="540"/><use href="#tuft" x="40" y="590"/><use href="#tuft" x="210" y="545"/>
    <use href="#tuft" x="380" y="600"/><use href="#tuft" x="520" y="548"/><use href="#tuft" x="700" y="585"/>
    <use href="#tuft" x="860" y="545"/><use href="#tuft" x="1020" y="595"/><use href="#tuft" x="1200" y="550"/>
    <use href="#tuft" x="-120" y="600"/><use href="#tuft" x="1400" y="590"/><use href="#tuft" x="1560" y="545"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="1.15s" repeatCount="indefinite"/>
  </g>

  <!-- Shadows -->
  <ellipse cx="410" cy="524" rx="290" ry="11" fill="#1d3a14" opacity="0.22"/>
  <ellipse cx="250" cy="521" rx="90" ry="6" fill="#1d3a14" opacity="0.25"/>
  <ellipse cx="570" cy="521" rx="90" ry="6" fill="#1d3a14" opacity="0.25"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="330" x2="130" y2="330"><animate attributeName="opacity" values="0;0.9;0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="40" y1="380" x2="120" y2="380"><animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="70" y1="430" x2="135" y2="430"><animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/></line>
    <line x1="120" y1="230" x2="190" y2="230"><animate attributeName="opacity" values="0;0.7;0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/></line>
  </g>

  <!-- Back leg (behind the bike) -->
  <path d="M346 252 L441.5 302.5 L371.0 397.1 l-13 7 M371.0 397.1 l3 12 M371.0 397.1 l15 5" fill="none" stroke="#c96f1f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M346 252 L441.5 302.5 L371.0 397.1 l-13 7 M371.0 397.1 l3 12 M371.0 397.1 l15 5;M346 252 L445.2 294.8 L380.2 393.3 l-13 7 M380.2 393.3 l3 12 M380.2 393.3 l15 5;M346 252 L447.5 288.9 L390.0 392.0 l-13 7 M390.0 392.0 l3 12 M390.0 392.0 l15 5;M346 252 L448.6 285.8 L399.8 393.3 l-13 7 M399.8 393.3 l3 12 M399.8 393.3 l15 5;M346 252 L448.5 285.9 L409.0 397.1 l-13 7 M409.0 397.1 l3 12 M409.0 397.1 l15 5;M346 252 L447.4 289.2 L416.9 403.1 l-13 7 M416.9 403.1 l3 12 M416.9 403.1 l15 5;M346 252 L445.0 295.1 L422.9 411.0 l-13 7 M422.9 411.0 l3 12 M422.9 411.0 l15 5;M346 252 L441.2 303.1 L426.7 420.2 l-13 7 M426.7 420.2 l3 12 M426.7 420.2 l15 5;M346 252 L435.6 312.2 L428.0 430.0 l-13 7 M428.0 430.0 l3 12 M428.0 430.0 l15 5;M346 252 L428.4 321.8 L426.7 439.8 l-13 7 M426.7 439.8 l3 12 M426.7 439.8 l15 5;M346 252 L419.6 331.0 L422.9 449.0 l-13 7 M422.9 449.0 l3 12 M422.9 449.0 l15 5;M346 252 L409.9 339.1 L416.9 456.9 l-13 7 M416.9 456.9 l3 12 M416.9 456.9 l15 5;M346 252 L400.5 345.2 L409.0 462.9 l-13 7 M409.0 462.9 l3 12 M409.0 462.9 l15 5;M346 252 L393.8 348.9 L399.8 466.7 l-13 7 M399.8 466.7 l3 12 M399.8 466.7 l15 5;M346 252 L391.4 350.0 L390.0 468.0 l-13 7 M390.0 468.0 l3 12 M390.0 468.0 l15 5;M346 252 L392.7 349.4 L380.2 466.7 l-13 7 M380.2 466.7 l3 12 M380.2 466.7 l15 5;M346 252 L396.2 347.6 L371.0 462.9 l-13 7 M371.0 462.9 l3 12 M371.0 462.9 l15 5;M346 252 L400.8 345.1 L363.1 456.9 l-13 7 M363.1 456.9 l3 12 M363.1 456.9 l15 5;M346 252 L406.2 341.7 L357.1 449.0 l-13 7 M357.1 449.0 l3 12 M357.1 449.0 l15 5;M346 252 L412.0 337.5 L353.3 439.8 l-13 7 M353.3 439.8 l3 12 M353.3 439.8 l15 5;M346 252 L418.2 332.3 L352.0 430.0 l-13 7 M352.0 430.0 l3 12 M352.0 430.0 l15 5;M346 252 L424.6 326.1 L353.3 420.2 l-13 7 M353.3 420.2 l3 12 M353.3 420.2 l15 5;M346 252 L430.8 318.9 L357.1 411.0 l-13 7 M357.1 411.0 l3 12 M357.1 411.0 l15 5;M346 252 L436.6 310.8 L363.1 403.1 l-13 7 M363.1 403.1 l3 12 M363.1 403.1 l15 5;M346 252 L441.5 302.5 L371.0 397.1 l-13 7 M371.0 397.1 l3 12 M371.0 397.1 l15 5"/>
  </path>

  <!-- Bicycle -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <g fill="none">
      <circle cx="250" cy="420" r="100" stroke="#1d1d1f" stroke-width="11"/>
      <circle cx="250" cy="420" r="102" stroke="#4a4a4f" stroke-width="2"/>
      <circle cx="250" cy="420" r="92" stroke="#9aa3ad" stroke-width="3"/>
      <circle cx="570" cy="420" r="100" stroke="#1d1d1f" stroke-width="11"/>
      <circle cx="570" cy="420" r="102" stroke="#4a4a4f" stroke-width="2"/>
      <circle cx="570" cy="420" r="92" stroke="#9aa3ad" stroke-width="3"/>
    </g>
    <g transform="translate(250 420)"><use href="#spokes">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/></use></g>
    <g transform="translate(570 420)"><use href="#spokes">
      <animateTransform attributeName="transform" type="rotate" from="40" to="400" dur="0.9s" repeatCount="indefinite"/></use></g>

    <!-- Rear cog, chain -->
    <circle cx="250" cy="420" r="12" fill="#666" stroke="#333" stroke-width="2"/>
    <path d="M390 408 L250 408 A12 12 0 0 0 250 432 L390 452" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.25s" repeatCount="indefinite"/>
    </path>

    <!-- Frame -->
    <g stroke="url(#frame)" stroke-width="9" fill="none">
      <line x1="250" y1="420" x2="390" y2="430"/>
      <line x1="250" y1="420" x2="348" y2="295"/>
      <line x1="390" y1="430" x2="342" y2="280"/>
      <line x1="348" y1="295" x2="528" y2="290"/>
      <line x1="390" y1="430" x2="535" y2="315"/>
      <line x1="525" y1="275" x2="540" y2="325" stroke-width="12"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" fill="none">
      <line x1="350" y1="292" x2="526" y2="287"/>
      <line x1="392" y1="425" x2="532" y2="313"/>
    </g>
    <!-- Fork -->
    <line x1="540" y1="320" x2="570" y2="420" stroke="#a7afb7" stroke-width="7"/>
    <!-- Hubs -->
    <circle cx="250" cy="420" r="7" fill="url(#hub)"/>
    <circle cx="570" cy="420" r="9" fill="url(#hub)"/>
    <!-- Stem and handlebar -->
    <path d="M525 278 L520 250 L495 245 Q485 244 487 256" fill="none" stroke="#2f2f33" stroke-width="7"/>
    <!-- Seat post + saddle -->
    <line x1="342" y1="280" x2="338" y2="265" stroke="#a7afb7" stroke-width="7"/>
    <path d="M305 262 Q335 252 365 262 L360 270 Q335 266 310 270 Z" fill="#222"/>
    <!-- Chainring -->
    <circle cx="390" cy="430" r="22" fill="none" stroke="#666" stroke-width="5" stroke-dasharray="5 2.5">
      <animateTransform attributeName="transform" type="rotate" from="0 390 430" to="360 390 430" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="430" r="7" fill="url(#hub)"/>
  </g>

  <!-- Back crank (between frame and pelican) -->
  <g>
    <line x1="390" y1="430" x2="428" y2="430" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <circle cx="428" cy="430" r="6" fill="#333"/>
    <animateTransform attributeName="transform" type="rotate" from="240 390 430" to="600 390 430" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Pelican -->
  <g id="pelican" stroke-linejoin="round" stroke-linecap="round">
    <!-- Tail -->
    <path d="M270 210 L222 192 L232 214 L214 226 L265 242 Z" fill="#c9ced4" stroke="#8a9199" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="335" cy="220" rx="88" ry="55" fill="url(#bodyGrad)" stroke="#8a9199" stroke-width="2.5" transform="rotate(-12 335 220)"/>
    <!-- Head + neck, bobbing with the pedalling -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 395 205;-2.5 395 205;0 395 205;2 395 205;0 395 205" dur="1.2s" repeatCount="indefinite"/>
      <path d="M385 195 C405 170 395 150 420 125 L445 135 C425 160 435 180 410 215 Z" fill="url(#bodyGrad)" stroke="#8a9199" stroke-width="2.5"/>
      <circle cx="440" cy="115" r="27" fill="#ffffff" stroke="#8a9199" stroke-width="2.5"/>
      <path d="M425 92 Q430 75 445 82 Q440 88 438 92" fill="#f4e7a6" stroke="#c9b25a" stroke-width="1.5"/>
      <!-- Pouch -->
      <path d="M455 125 Q520 190 615 140 L612 133 Q530 145 458 115 Z" fill="url(#pouch)" stroke="#b5651d" stroke-width="2">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          values="M455 125 Q520 190 615 140 L612 133 Q530 145 458 115 Z;M455 125 Q522 198 615 140 L612 133 Q530 145 458 115 Z;M455 125 Q520 190 615 140 L612 133 Q530 145 458 115 Z"/>
      </path>
      <path d="M480 140 Q530 165 590 145" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
      <!-- Upper beak -->
      <path d="M458 105 Q540 112 622 132 Q628 136 615 140 Q540 128 460 122 Z" fill="url(#beak)" stroke="#b5651d" stroke-width="2"/>
      <path d="M612 128 Q625 133 619 140" fill="#d9822b"/>
      <!-- Eye -->
      <circle cx="447" cy="108" r="6.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <circle cx="449" cy="108" r="3.2" fill="#111"/>
      <circle cx="450" cy="106.5" r="1" fill="#fff"/>
      <path d="M440 100 Q448 97 455 101" fill="none" stroke="#8a9199" stroke-width="1.5"/>
    </g>
    <!-- Wing reaching to handlebar -->
    <path d="M300 195 C350 175 420 200 470 235 L492 248 L478 252 L486 260 L465 258 C420 250 360 245 310 235 Z"
          fill="url(#wingGrad)" stroke="#8a9199" stroke-width="2.5"/>
    <path d="M330 210 Q390 215 440 235 M330 225 Q380 232 430 245 M335 238 Q370 242 405 250" fill="none" stroke="#a9b0b8" stroke-width="1.5"/>
    <path d="M470 240 Q492 238 495 252" fill="none" stroke="#3a3f45" stroke-width="5"/>
  </g>

  <!-- Front leg -->
  <path d="M364 256 L423.9 345.9 L409.0 462.9 l-13 7 M409.0 462.9 l3 12 M409.0 462.9 l15 5" fill="none" stroke="#f08c2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M364 256 L423.9 345.9 L409.0 462.9 l-13 7 M409.0 462.9 l3 12 M409.0 462.9 l15 5;M364 256 L417.2 350.0 L399.8 466.7 l-13 7 M399.8 466.7 l3 12 M399.8 466.7 l15 5;M364 256 L413.0 352.3 L390.0 468.0 l-13 7 M390.0 468.0 l3 12 M390.0 468.0 l15 5;M364 256 L411.6 353.0 L380.2 466.7 l-13 7 M380.2 466.7 l3 12 M380.2 466.7 l15 5;M364 256 L412.6 352.5 L371.0 462.9 l-13 7 M371.0 462.9 l3 12 M371.0 462.9 l15 5;M364 256 L415.3 351.0 L363.1 456.9 l-13 7 M363.1 456.9 l3 12 M363.1 456.9 l15 5;M364 256 L419.3 348.7 L357.1 449.0 l-13 7 M357.1 449.0 l3 12 M357.1 449.0 l15 5;M364 256 L424.3 345.6 L353.3 439.8 l-13 7 M353.3 439.8 l3 12 M353.3 439.8 l15 5;M364 256 L430.0 341.5 L352.0 430.0 l-13 7 M352.0 430.0 l3 12 M352.0 430.0 l15 5;M364 256 L436.3 336.3 L353.3 420.2 l-13 7 M353.3 420.2 l3 12 M353.3 420.2 l15 5;M364 256 L442.8 329.9 L357.1 411.0 l-13 7 M357.1 411.0 l3 12 M357.1 411.0 l15 5;M364 256 L449.2 322.4 L363.1 403.1 l-13 7 M363.1 403.1 l3 12 M363.1 403.1 l15 5;M364 256 L455.0 314.2 L371.0 397.1 l-13 7 M371.0 397.1 l3 12 M371.0 397.1 l15 5;M364 256 L459.7 306.1 L380.2 393.3 l-13 7 M380.2 393.3 l3 12 M380.2 393.3 l15 5;M364 256 L463.0 299.3 L390.0 392.0 l-13 7 M390.0 392.0 l3 12 M390.0 392.0 l15 5;M364 256 L464.8 294.8 L399.8 393.3 l-13 7 M399.8 393.3 l3 12 M399.8 393.3 l15 5;M364 256 L465.3 293.4 L409.0 397.1 l-13 7 M409.0 397.1 l3 12 M409.0 397.1 l15 5;M364 256 L464.6 295.2 L416.9 403.1 l-13 7 M416.9 403.1 l3 12 M416.9 403.1 l15 5;M364 256 L462.7 299.9 L422.9 411.0 l-13 7 M422.9 411.0 l3 12 M422.9 411.0 l15 5;M364 256 L459.3 306.8 L426.7 420.2 l-13 7 M426.7 420.2 l3 12 M426.7 420.2 l15 5;M364 256 L454.5 315.0 L428.0 430.0 l-13 7 M428.0 430.0 l3 12 M428.0 430.0 l15 5;M364 256 L448.1 323.8 L426.7 439.8 l-13 7 M426.7 439.8 l3 12 M426.7 439.8 l15 5;M364 256 L440.4 332.3 L422.9 449.0 l-13 7 M422.9 449.0 l3 12 M422.9 449.0 l15 5;M364 256 L432.1 339.9 L416.9 456.9 l-13 7 M416.9 456.9 l3 12 M416.9 456.9 l15 5;M364 256 L423.9 345.9 L409.0 462.9 l-13 7 M409.0 462.9 l3 12 M409.0 462.9 l15 5"/>
  </path>
  <!-- Front crank -->
  <g>
    <line x1="390" y1="430" x2="428" y2="430" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <circle cx="428" cy="430" r="6.5" fill="#222"/>
    <circle cx="390" cy="430" r="5" fill="#888"/>
    <animateTransform attributeName="transform" type="rotate" from="60 390 430" to="420 390 430" dur="1.2s" repeatCount="indefinite"/>
  </g>
</svg>
