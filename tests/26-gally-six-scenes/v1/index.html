<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six SVG Scenes</title>
<style>
  :root { --bg:#f3efe8; --card:#fff; --ink:#2a2420; --muted:#7a6f66; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { text-align:center; padding:32px 16px 8px; }
  h1 { margin:0; font-size:28px; }
  header p { margin:6px 0 0; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; max-width:1300px; margin:24px auto; padding:0 16px 40px; }
  figure { margin:0; background:var(--card); border-radius:14px; padding:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  figure img { width:100%; height:auto; aspect-ratio:1; display:block; border-radius:8px; }
  figcaption { padding:10px 4px 2px; font-weight:600; text-transform:capitalize; }
  figcaption a { float:right; font-weight:400; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Six SVG Scenes</h1>
  <p>400 × 400 each</p>
</header>
<main class="grid">
  <figure><img src="hedgehog-accordion.svg" alt="A hedgehog playing an accordion"><figcaption>A hedgehog playing an accordion <a href="hedgehog-accordion.svg">svg</a></figcaption></figure>
  <figure><img src="starfish-bulldozer.svg" alt="A starfish driving a bulldozer"><figcaption>A starfish driving a bulldozer <a href="starfish-bulldozer.svg">svg</a></figcaption></figure>
  <figure><img src="penguin-chainsaws.svg" alt="A penguin juggling chainsaws"><figcaption>A penguin juggling chainsaws <a href="penguin-chainsaws.svg">svg</a></figcaption></figure>
  <figure><img src="chameleon-piano.svg" alt="A chameleon tuning a grand piano"><figcaption>A chameleon tuning a grand piano <a href="chameleon-piano.svg">svg</a></figcaption></figure>
  <figure><img src="lobster-harp.svg" alt="A lobster polishing a harp"><figcaption>A lobster polishing a harp <a href="lobster-harp.svg">svg</a></figcaption></figure>
  <figure><img src="sloth-excavator.svg" alt="A sloth steering an excavator"><figcaption>A sloth steering an excavator <a href="sloth-excavator.svg">svg</a></figcaption></figure>
</main>
</body>
</html>
