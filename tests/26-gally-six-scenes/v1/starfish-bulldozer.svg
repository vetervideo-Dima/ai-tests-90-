<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#bfe3f5"/>
  <circle cx="340" cy="60" r="28" fill="#ffe27a"/>
  <rect y="310" width="400" height="90" fill="#c9a26b"/>
  <path d="M0 312 Q60 300 120 312 T240 312 T400 310 L400 320 L0 320 Z" fill="#b38b55"/>
  <!-- dirt pile pushed by blade -->
  <path d="M0 320 Q15 270 40 300 L40 320 Z" fill="#8f6a3a"/>
  <!-- blade arm -->
  <rect x="60" y="250" width="70" height="12" fill="#555" transform="rotate(8 60 250)"/>
  <rect x="62" y="290" width="62" height="10" fill="#555"/>
  <!-- blade -->
  <path d="M34 210 Q62 260 36 322 L62 322 Q80 262 60 210 Z" fill="#d9a400" stroke="#8a6a00" stroke-width="3"/>
  <!-- tracks -->
  <rect x="90" y="270" width="220" height="50" rx="25" fill="#2f2f2f"/>
  <g fill="#6b6b6b" stroke="#2f2f2f" stroke-width="3">
    <circle cx="115" cy="295" r="17"/><circle cx="165" cy="295" r="15"/>
    <circle cx="210" cy="295" r="15"/><circle cx="255" cy="295" r="15"/>
    <circle cx="285" cy="295" r="17"/>
  </g>
  <!-- body -->
  <rect x="110" y="205" width="185" height="68" rx="8" fill="#f4b400" stroke="#a87b00" stroke-width="3"/>
  <rect x="120" y="222" width="50" height="8" fill="#a87b00"/>
  <rect x="120" y="238" width="50" height="8" fill="#a87b00"/>
  <rect x="140" y="160" width="12" height="47" fill="#444"/>
  <rect x="137" y="155" width="18" height="8" fill="#333"/>
  <!-- smoke -->
  <g fill="#e8eef2" opacity="0.9">
    <circle cx="150" cy="135" r="10"/><circle cx="162" cy="115" r="13"/><circle cx="180" cy="92" r="16"/>
  </g>
  <!-- cab -->
  <rect x="180" y="125" width="105" height="85" rx="6" fill="#f4b400" stroke="#a87b00" stroke-width="3"/>
  <rect x="192" y="137" width="80" height="62" rx="4" fill="#dff4ff"/>
  <!-- starfish driver -->
  <polygon points="230,146 238.2,166.7 260.4,168.1 243.3,182.3 248.8,203.9 230,192 211.2,203.9 216.7,182.3 199.6,168.1 221.8,166.7" fill="#ff7f50" stroke="#ff7f50" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#ffb08c">
    <circle cx="230" cy="160" r="2.5"/><circle cx="246" cy="172" r="2.5"/><circle cx="214" cy="172" r="2.5"/>
    <circle cx="240" cy="190" r="2.5"/><circle cx="220" cy="190" r="2.5"/>
  </g>
  <circle cx="224" cy="172" r="6" fill="#fff"/><circle cx="237" cy="172" r="6" fill="#fff"/>
  <circle cx="225" cy="173" r="3" fill="#111"/><circle cx="238" cy="173" r="3" fill="#111"/>
  <path d="M223 183 Q230 189 238 183" fill="none" stroke="#7a2e10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- steering wheel -->
  <ellipse cx="208" cy="196" rx="12" ry="5" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="208" y1="196" x2="214" y2="210" stroke="#333" stroke-width="3"/>
  <!-- glass glare -->
  <path d="M196 140 L214 140 L196 168 Z" fill="#fff" opacity="0.5"/>
  <rect x="192" y="137" width="80" height="62" rx="4" fill="none" stroke="#a87b00" stroke-width="3"/>
  <!-- lights -->
  <circle cx="290" cy="220" r="6" fill="#fff6a8" stroke="#a87b00" stroke-width="2"/>
</svg>
