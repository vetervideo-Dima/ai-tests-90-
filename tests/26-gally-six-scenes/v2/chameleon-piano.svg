<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <style>.skin{animation:skin 6s ease-in-out infinite}@keyframes skin{0%,100%{fill:#6ab04c}33%{fill:#3fb39a}66%{fill:#c7b93a}}.skinS{animation:skinS 6s ease-in-out infinite}@keyframes skinS{0%,100%{stroke:#5ea83c}33%{stroke:#35a08a}66%{stroke:#b3a52f}}.pupil{animation:look 4s ease-in-out infinite}@keyframes look{0%,40%{transform:translate(0,0)}50%,90%{transform:translate(3px,2px)}}.wrench{transform-origin:100px 222px;animation:turn 1.6s ease-in-out infinite}@keyframes turn{50%{transform:rotate(-14deg)}}.vib{animation:vib .08s linear infinite}@keyframes vib{50%{transform:translateY(.8px)}}.note{animation:nt 2.4s ease-out infinite}@keyframes nt{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-10px,-30px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f2e8"/><stop offset="1" stop-color="#e8dccb"/></linearGradient><linearGradient id="lid" x1="0" y1="1" x2="0.3" y2="0"><stop offset="0" stop-color="#050505"/><stop offset=".7" stop-color="#2b2b2b"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#050505"/></linearGradient></defs>
  <rect width="400" height="400" fill="url(#wall)"/>
  <rect y="330" width="400" height="70" fill="#b98b5e"/>
  <ellipse cx="200" cy="345" rx="160" ry="12" fill="#9c7248"/>
  <!-- lid (open) -->
  <polygon points="60,180 330,180 315,92 95,66" fill="url(#lid)" stroke="#000" stroke-width="2"/>
  <polygon points="80,170 300,172 290,105 105,82" fill="#2a2a2a" opacity="0.6"/>
  <!-- legs -->
  <rect x="68" y="280" width="14" height="60" fill="#111"/>
  <rect x="318" y="245" width="14" height="88" fill="#111"/>
  <rect x="190" y="268" width="14" height="70" fill="#111"/>
  <rect x="110" y="282" width="6" height="45" fill="#c9a14a"/>
  <rect x="104" y="324" width="18" height="6" fill="#c9a14a"/>
  <!-- side panel -->
  <path d="M60 250 L150 250 Q180 240 250 238 Q320 235 345 205 L345 240 Q320 270 250 273 Q180 275 150 285 L60 285 Z" fill="url(#side)"/>
  <path d="M70 256 L150 256 Q180 246 250 244 Q310 242 336 222" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <!-- top -->
  <path d="M60 180 L330 180 Q360 185 345 205 Q320 235 250 238 Q180 240 150 250 L60 250 Z" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <!-- inner frame / strings -->
  <path d="M72 188 L326 188 Q345 192 336 204 Q314 228 250 230 Q182 232 150 242 L72 242 Z" fill="#c9a14a"/>
  <g stroke="#f3e2b5" stroke-width="1.2">
    <line x1="90" y1="192" x2="322" y2="192"/>
    <line x1="90" y1="197" x2="330" y2="197"/>
    <line x1="90" y1="202" x2="332" y2="202"/>
    <line class="vib" x1="90" y1="207" x2="326" y2="207" stroke="#fff6d0"/>
    <line x1="90" y1="212" x2="320" y2="212"/>
    <line x1="90" y1="217" x2="310" y2="217"/>
    <line x1="90" y1="222" x2="296" y2="222"/>
    <line x1="90" y1="227" x2="270" y2="227"/>
    <line x1="90" y1="232" x2="190" y2="232"/>
    <line x1="90" y1="237" x2="160" y2="237"/>
  </g>
  <g fill="#555">
    <circle cx="84" cy="192" r="2"/><circle cx="84" cy="197" r="2"/><circle cx="84" cy="202" r="2"/>
    <circle cx="84" cy="207" r="2"/><circle cx="84" cy="212" r="2"/><circle cx="84" cy="217" r="2"/>
    <circle cx="84" cy="222" r="2"/><circle cx="84" cy="227" r="2"/><circle cx="84" cy="232" r="2"/>
    <circle cx="84" cy="237" r="2"/>
  </g>
  <!-- keyboard -->
  <rect x="30" y="182" width="30" height="68" fill="#fbfbf5" stroke="#222" stroke-width="2"/>
  <g stroke="#bbb" stroke-width="1">
    <line x1="30" y1="190" x2="60" y2="190"/><line x1="30" y1="198" x2="60" y2="198"/>
    <line x1="30" y1="206" x2="60" y2="206"/><line x1="30" y1="214" x2="60" y2="214"/>
    <line x1="30" y1="222" x2="60" y2="222"/><line x1="30" y1="230" x2="60" y2="230"/>
    <line x1="30" y1="238" x2="60" y2="238"/>
  </g>
  <g fill="#111">
    <rect x="44" y="187" width="16" height="5"/><rect x="44" y="195" width="16" height="5"/>
    <rect x="44" y="211" width="16" height="5"/><rect x="44" y="219" width="16" height="5"/>
    <rect x="44" y="227" width="16" height="5"/><rect x="44" y="243" width="16" height="5"/>
  </g>
  <rect x="26" y="250" width="38" height="16" fill="#111"/>
  <!-- prop stick -->
  <line x1="230" y1="232" x2="235" y2="82" stroke="#222" stroke-width="5"/>
  <!-- chameleon -->
  <path class="skinS" d="M182 224 Q215 232 214 258 Q212 282 192 278 Q178 273 184 259 Q190 250 199 258" fill="none" stroke="#5ea83c" stroke-width="9" stroke-linecap="round"/>
  <ellipse class="skin" cx="150" cy="212" rx="36" ry="20" fill="#6ab04c"/>
  <path d="M120 198 Q135 186 160 190 Q178 192 186 204" fill="none" stroke="#4a8c30" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 6"/>
  <ellipse cx="150" cy="218" rx="26" ry="9" fill="#a8d672" opacity="0.7"/>
  <path class="skin" d="M120 200 L96 206 Q94 216 118 222 Z" fill="#6ab04c"/>
  <path d="M120 200 L128 186 L134 200 Z" fill="#4a8c30"/>
  <circle cx="114" cy="205" r="9" fill="#8fcf5f" stroke="#4a8c30" stroke-width="2"/>
  <circle class="pupil" cx="111" cy="205" r="3.5" fill="#111"/>
  <path d="M97 213 Q104 216 112 214" fill="none" stroke="#2e5e1a" stroke-width="2"/>
  <!-- legs gripping rim -->
  <path class="skinS" d="M168 228 L172 248" stroke="#5ea83c" stroke-width="7" stroke-linecap="round"/>
  <path class="skinS" d="M140 230 L138 248" stroke="#5ea83c" stroke-width="7" stroke-linecap="round"/>
  <!-- arm with tuning hammer -->
  <path class="skinS" d="M130 218 L104 222" stroke="#5ea83c" stroke-width="7" stroke-linecap="round"/>
  <g class="wrench"><line x1="102" y1="222" x2="86" y2="208" stroke="#777" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="226" x2="104" y2="214" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/></g>
  <!-- tuning bubble -->
  <g transform="translate(14 22)"><rect width="74" height="34" rx="10" fill="#fff" stroke="#c97f2a" stroke-width="2"/><path d="M22 34 L30 46 L36 34" fill="#fff" stroke="#c97f2a" stroke-width="2" stroke-linejoin="round"/><rect x="21" y="32" width="16" height="4" fill="#fff"/><text x="37" y="23" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#c97f2a">A440</text></g>
  <g class="note" fill="#c97f2a"><ellipse cx="78" cy="168" rx="5" ry="4"/><rect x="82" y="150" width="2" height="18"/></g>
</svg>
