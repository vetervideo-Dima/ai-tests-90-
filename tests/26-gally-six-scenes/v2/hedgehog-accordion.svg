<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <style>.bellows{transform-origin:200px 285px;animation:sq 1.6s ease-in-out infinite}.lbox{animation:lb 1.6s ease-in-out infinite}.rbox{animation:rb 1.6s ease-in-out infinite}@keyframes sq{50%{transform:scaleX(.82)}}@keyframes lb{50%{transform:translateX(9px)}}@keyframes rb{50%{transform:translateX(-9px)}}.body{transform-origin:200px 345px;animation:sway 3.2s ease-in-out infinite}@keyframes sway{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.n1,.n2{animation:float 3s ease-in-out infinite}.n2{animation-delay:-1.5s}@keyframes float{0%{transform:translateY(12px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
