<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <style>.chain{animation:ch .3s linear infinite}@keyframes ch{to{stroke-dashoffset:-6}}.spin{animation:spin 1.8s linear infinite}.s2{animation-delay:-.6s}.s3{animation-delay:-1.2s}@keyframes spin{to{transform:rotate(360deg)}}.bob{animation:bob 1.8s ease-in-out infinite}.b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}@keyframes bob{50%{transform:translateY(-14px)}}.fl{transform-origin:140px 248px;animation:fl .9s ease-in-out infinite}.fr{transform-origin:260px 248px;animation:fr .9s ease-in-out infinite;animation-delay:-.45s}@keyframes fl{50%{transform:rotate(-8deg)}}@keyframes fr{50%{transform:rotate(8deg)}}.snow{animation:snow 6s linear infinite}@keyframes snow{from{transform:translateY(-40px)}to{transform:translateY(400px)}}.sweat{animation:sw 1.5s ease-in infinite}@keyframes sw{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(16px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dcf7"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><radialGradient id="pb" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#3a3a52"/><stop offset="1" stop-color="#121220"/></radialGradient><radialGradient id="belly" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e4ee"/></radialGradient></defs>
  <defs>
    <g id="saw">
      <rect x="10" y="-7" width="56" height="14" rx="7" fill="#c7ced3" stroke="#555" stroke-width="2"/>
      <rect class="chain" x="13" y="-9" width="52" height="18" rx="9" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3 3"/>
      <rect x="-22" y="-13" width="36" height="26" rx="6" fill="#e67e22" stroke="#8e4a10" stroke-width="2"/>
      <path d="M-18 -13 Q-14 -30 4 -26 L6 -13" fill="none" stroke="#333" stroke-width="4"/>
      <rect x="-26" y="-6" width="8" height="12" rx="2" fill="#333"/>
    </g>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <path d="M0 330 L60 250 L110 300 L170 230 L240 310 L300 240 L400 330 Z" fill="#cfe3f3"/>
  <g fill="#fff" class="snow"><circle cx="40" cy="20" r="2.5"/><circle cx="120" cy="80" r="2"/><circle cx="340" cy="30" r="3"/><circle cx="260" cy="120" r="2"/><circle cx="370" cy="200" r="2.5"/><circle cx="20" cy="180" r="2"/></g>
  <ellipse cx="200" cy="370" rx="190" ry="40" fill="#ffffff"/>
  <!-- juggling arc -->
  <path d="M120 210 Q200 -20 280 210" fill="none" stroke="#9ab" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- chainsaws -->
  <g transform="translate(110 150)"><g class="bob"><g transform="rotate(-120)"><g class="spin"><use href="#saw" xlink:href="#saw"/></g></g></g></g>
  <g transform="translate(190 70)"><g class="bob b2"><g transform="rotate(-10)"><g class="spin s2"><use href="#saw" xlink:href="#saw"/></g></g></g></g>
  <g transform="translate(295 140)"><g class="bob b3"><g transform="rotate(60)"><g class="spin s3"><use href="#saw" xlink:href="#saw"/></g></g></g></g>
  <!-- motion lines -->
  <g stroke="#7f8fa0" stroke-width="2" stroke-linecap="round">
    <line x1="150" y1="52" x2="135" y2="60"/><line x1="152" y1="64" x2="138" y2="72"/>
    <line x1="320" y1="110" x2="332" y2="98"/><line x1="90" y1="110" x2="78" y2="98"/>
  </g>
  <!-- penguin -->
  <path class="fl" d="M138 250 Q110 220 105 175" fill="none" stroke="#1d1d2b" stroke-width="18" stroke-linecap="round"/>
  <path class="fr" d="M262 250 Q290 220 295 175" fill="none" stroke="#1d1d2b" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="200" cy="368" rx="70" ry="9" fill="#9fb6c8" opacity=".5"/>
  <ellipse cx="200" cy="270" rx="70" ry="95" fill="url(#pb)"/>
  <ellipse cx="200" cy="290" rx="48" ry="72" fill="url(#belly)"/>
  <ellipse cx="200" cy="222" rx="38" ry="28" fill="#fdfdfd"/>
  <circle cx="185" cy="214" r="8" fill="#fff" stroke="#1d1d2b" stroke-width="2"/>
  <circle cx="215" cy="214" r="8" fill="#fff" stroke="#1d1d2b" stroke-width="2"/>
  <circle cx="186" cy="211" r="4" fill="#111"/>
  <circle cx="214" cy="211" r="4" fill="#111"/>
  <polygon points="190,228 210,228 200,244" fill="#f39c12"/>
  <path class="sweat" d="M238 196 Q242 204 238 208 Q234 204 238 196 Z" fill="#7cc6f2"/>
  <ellipse cx="172" cy="232" rx="7" ry="4" fill="#f7a8b8" opacity="0.7"/>
  <ellipse cx="228" cy="232" rx="7" ry="4" fill="#f7a8b8" opacity="0.7"/>
  <!-- feet -->
  <ellipse cx="175" cy="364" rx="20" ry="8" fill="#f39c12"/>
  <ellipse cx="225" cy="364" rx="20" ry="8" fill="#f39c12"/>
</svg>
