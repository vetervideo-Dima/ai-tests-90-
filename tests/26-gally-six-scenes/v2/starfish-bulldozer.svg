<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <style>.puff{transform-box:fill-box;transform-origin:center;animation:puff 2.4s linear infinite;opacity:0}.p2{animation-delay:-.8s}.p3{animation-delay:-1.6s}@keyframes puff{0%{transform:translate(0,30px) scale(.4);opacity:0}20%{opacity:.95}100%{transform:translate(30px,-50px) scale(1.6);opacity:0}}.rumble{animation:rum .18s steps(2) infinite}@keyframes rum{50%{transform:translateY(1.5px)}}.tread{animation:tr .5s linear infinite}@keyframes tr{to{stroke-dashoffset:-16}}.bop{animation:bop .6s ease-in-out infinite}@keyframes bop{50%{transform:translateY(-3px)}}.clod{animation:clod 1.4s ease-out infinite}.c2{animation-delay:-.5s}.c3{animation-delay:-1s}@keyframes clod{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-30px,-40px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs><radialGradient id="sun"><stop offset=".55" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0f0"/><stop offset="1" stop-color="#e3f5fc"/></linearGradient><linearGradient id="yel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#e09a00"/></linearGradient><radialGradient id="star" cx="45%" cy="40%"><stop offset="0" stop-color="#ffa070"/><stop offset="1" stop-color="#f0602c"/></radialGradient></defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="340" cy="60" r="52" fill="url(#sun)"/>
  <g fill="#fff" opacity=".85"><ellipse cx="70" cy="70" rx="34" ry="12"/><ellipse cx="92" cy="62" rx="22" ry="12"/><ellipse cx="250" cy="40" rx="26" ry="9"/></g>
  <rect y="310" width="400" height="90" fill="#c9a26b"/>
  <path d="M0 312 Q60 300 120 312 T240 312 T400 310 L400 320 L0 320 Z" fill="#b38b55"/>
  <!-- dirt pile pushed by blade -->
  <path d="M0 322 Q8 262 34 290 L40 322 Z" fill="#8f6a3a"/>
  <g fill="#7a5a30"><circle class="clod" cx="30" cy="282" r="4"/><circle class="clod c2" cx="26" cy="290" r="3"/><circle class="clod c3" cx="34" cy="276" r="3.5"/></g>
  <!-- blade arm -->
  <rect x="60" y="250" width="70" height="12" fill="#555" transform="rotate(8 60 250)"/>
  <rect x="62" y="290" width="62" height="10" fill="#555"/>
  <!-- blade -->
  <path d="M34 210 Q62 260 36 322 L62 322 Q80 262 60 210 Z" fill="#d9a400" stroke="#8a6a00" stroke-width="3"/>
  <!-- tracks -->
  <ellipse cx="200" cy="322" rx="120" ry="8" fill="#000" opacity=".18"/>
  <rect x="90" y="270" width="220" height="50" rx="25" fill="#2f2f2f"/>
  <rect class="tread" x="93" y="273" width="214" height="44" rx="22" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="6 10"/>
  <g fill="#6b6b6b" stroke="#2f2f2f" stroke-width="3">
    <circle cx="115" cy="295" r="17"/><circle cx="165" cy="295" r="15"/>
    <circle cx="210" cy="295" r="15"/><circle cx="255" cy="295" r="15"/>
    <circle cx="285" cy="295" r="17"/>
  </g>
  <g class="rumble">
  <!-- body -->
  <rect x="110" y="205" width="185" height="68" rx="8" fill="url(#yel)" stroke="#a87b00" stroke-width="3"/>
  <rect x="120" y="222" width="50" height="8" fill="#a87b00"/>
  <rect x="120" y="238" width="50" height="8" fill="#a87b00"/>
  <rect x="140" y="160" width="12" height="47" fill="#444"/>
  <rect x="137" y="155" width="18" height="8" fill="#333"/>
  <!-- smoke -->
  <g fill="#e8eef2">
    <circle class="puff" cx="148" cy="130" r="11"/><circle class="puff p2" cx="148" cy="130" r="11"/><circle class="puff p3" cx="148" cy="130" r="11"/>
  </g>
  <!-- cab -->
  <rect x="180" y="125" width="105" height="85" rx="6" fill="url(#yel)" stroke="#a87b00" stroke-width="3"/>
  <rect x="192" y="137" width="80" height="62" rx="4" fill="#dff4ff"/>
  <!-- starfish driver -->
  <g class="bop">
  <polygon points="230,146 238.2,166.7 260.4,168.1 243.3,182.3 248.8,203.9 230,192 211.2,203.9 216.7,182.3 199.6,168.1 221.8,166.7" fill="url(#star)" stroke="#f47040" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#ffb08c">
    <circle cx="230" cy="160" r="2.5"/><circle cx="246" cy="172" r="2.5"/><circle cx="214" cy="172" r="2.5"/>
    <circle cx="240" cy="190" r="2.5"/><circle cx="220" cy="190" r="2.5"/>
  </g>
  <circle cx="224" cy="172" r="6" fill="#fff"/><circle cx="237" cy="172" r="6" fill="#fff"/>
  <circle cx="225" cy="173" r="3" fill="#111"/><circle cx="238" cy="173" r="3" fill="#111"/>
  <path d="M223 183 Q230 189 238 183" fill="none" stroke="#7a2e10" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- steering wheel -->
  <ellipse cx="208" cy="196" rx="12" ry="5" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="208" y1="196" x2="214" y2="210" stroke="#333" stroke-width="3"/>
  <!-- glass glare -->
  <path d="M196 140 L214 140 L196 168 Z" fill="#fff" opacity="0.5"/>
  <rect x="192" y="137" width="80" height="62" rx="4" fill="none" stroke="#a87b00" stroke-width="3"/>
  <!-- lights -->
  <circle cx="290" cy="220" r="6" fill="#fff6a8" stroke="#a87b00" stroke-width="2"/>
  </g>
</svg>
