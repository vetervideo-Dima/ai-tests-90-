<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truchet Poster — Multi-Scale A2 Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16161a;
    --panel: #1f1f25;
    --line: #2e2e36;
    --text: #ece9e2;
    --muted: #8d8a85;
    --accent: #e4b363;
    --ui: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui); }
  body { display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 28px 24px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
  h1 small { display: block; font-size: 11px; font-family: var(--mono); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px; font-weight: 400; }
  label { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-family: var(--mono); }
  label output { float: right; color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .palettes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .pal {
    aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0;
    position: relative; overflow: hidden; transition: transform .15s, border-color .15s;
  }
  .pal:hover { transform: translateY(-2px); }
  .pal.active { border-color: var(--text); }
  .pal span { position: absolute; inset: 0; }
  .palname { font-family: var(--mono); font-size: 12px; margin-top: 8px; color: var(--text); }
  .seedrow { display: flex; gap: 8px; }
  .seedrow input {
    flex: 1; background: #121216; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-family: var(--mono); font-size: 13px;
  }
  button.btn {
    font-family: var(--ui); font-weight: 500; font-size: 14px; border-radius: 10px; padding: 13px 16px; cursor: pointer;
    border: 1px solid var(--line); background: #2a2a31; color: var(--text); transition: background .15s, transform .1s;
  }
  button.btn:hover { background: #33333b; }
  button.btn:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: #1a1408; border-color: transparent; }
  button.primary:hover { background: #efc47b; }
  .actions { display: grid; gap: 10px; margin-top: auto; }
  .stats { font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.7; }
  main { position: relative; display: flex; align-items: center; justify-content: center; padding: 32px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #24242b 0%, #131316 70%); }
  #stage { height: 100%; aspect-ratio: 420 / 594; max-width: 100%; position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4); transition: opacity .25s; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #stage.fade { opacity: 0.25; }
  .hint { position: absolute; bottom: 12px; right: 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: auto; height: auto; }
    main { order: -1; height: 78vh; padding: 16px; }
    aside { border-right: none; border-top: 1px solid var(--line); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<aside>
  <h1>Truchet Poster<small>Multi-scale · Quadtree · A2</small></h1>

  <div>
    <label>Palette</label>
    <div class="palettes" id="palettes"></div>
    <div class="palname" id="palname"></div>
  </div>

  <div>
    <label for="size">Tile size <output id="sizeOut"></output></label>
    <input type="range" id="size" min="30" max="140" step="1" value="70">
  </div>

  <div>
    <label for="density">Density <output id="densOut"></output></label>
    <input type="range" id="density" min="0" max="100" step="1" value="55">
  </div>

  <div>
    <label for="seed">Seed</label>
    <div class="seedrow"><input id="seed" spellcheck="false" autocomplete="off"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="actions">
    <button class="btn" id="regen">Regenerate <span style="opacity:.5;font-family:var(--mono);font-size:11px">[R]</span></button>
    <button class="btn primary" id="download">Download SVG <span style="opacity:.6;font-family:var(--mono);font-size:11px">[S]</span></button>
  </div>
</aside>
<main>
  <div id="stage"></div>
  <div class="hint">420 × 594 mm · vector · print-ready</div>
</main>

<script>
(() => {
  'use strict';

  // ---------- A2 poster geometry (millimetres) ----------
  const W = 420, H = 594;
  const MARGIN = 24;
  const CAPTION = 34;      // reserved band under the tiling
  const MIN_TILE = 3.2;    // smallest printable tile (mm)
  const MAX_DEPTH = 5;

  // ---------- 5 curated palettes ----------
  // paper/ink are 2-stop gradients in poster space (seamless across all tiles)
  const PALETTES = [
    { name: 'Ink & Bone',  sheet: '#efe8da', paper: ['#f4eee2', '#e7ddca'], ink: ['#121212', '#2b2723'], accent: '#c8402a', text: '#1a1a1a' },
    { name: 'Klein Blue',  sheet: '#f2ede4', paper: ['#f6f1e8', '#ebe3d4'], ink: ['#1630b8', '#0b1a72'], accent: '#e9a93a', text: '#0b1a72' },
    { name: 'Terracotta',  sheet: '#f1e2cd', paper: ['#f5e7d3', '#ecd5b6'], ink: ['#b9472b', '#6e2618'], accent: '#2f4b3c', text: '#5a1f14' },
    { name: 'Nocturne',    sheet: '#0e1420', paper: ['#0f1726', '#1b2440'], ink: ['#f0d27a', '#e9b65a'], accent: '#e46d4f', text: '#f0d27a' },
    { name: 'Viridian',    sheet: '#e7ece3', paper: ['#ecf0e7', '#dde5d8'], ink: ['#0e5a4b', '#14343a'], accent: '#d7553b', text: '#14343a' },
  ];

  // ---------- seeded randomness ----------
  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // smooth value noise for organic subdivision clusters
  function makeNoise(rnd) {
    const N = 256, perm = new Uint16Array(N * 2), vals = new Float32Array(N);
    for (let i = 0; i < N; i++) { perm[i] = i; vals[i] = rnd(); }
    for (let i = N - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < N; i++) perm[i + N] = perm[i];
    const v = (x, y) => vals[perm[(perm[x & 255] + y) & 511]];
    const sm = t => t * t * (3 - 2 * t);
    const n2 = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = sm(xf), w = sm(yf);
      const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
    };
    return (x, y) => (n2(x, y) * 0.65 + n2(x * 2.1 + 17.3, y * 2.1 + 5.1) * 0.35);
  }

  // ---------- state ----------
  const $ = id => document.getElementById(id);
  const state = { palette: 0, size: 70, density: 55, seed: randomSeed() };

  function randomSeed() {
    const syll = ['ka','lo','mi','ra','ve','to','su','ne','zo','fa','ri','po','da','xu','le','mo'];
    let s = '';
    for (let i = 0; i < 3; i++) s += syll[(Math.random() * syll.length) | 0];
    return s + '-' + ((Math.random() * 9000 + 1000) | 0);
  }

  // read from URL hash
  try {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('seed')) state.seed = p.get('seed');
    if (p.get('p') !== null && !isNaN(+p.get('p'))) state.palette = Math.max(0, Math.min(4, +p.get('p')));
    if (p.get('size')) state.size = Math.max(30, Math.min(140, +p.get('size')));
    if (p.get('d')) state.density = Math.max(0, Math.min(100, +p.get('d')));
  } catch (e) {}

  // ---------- quadtree generation ----------
  function buildTiles(rnd, noise, area, baseSize, density) {
    const cols = Math.max(1, Math.round(area.w / baseSize));
    const tile = area.w / cols;
    const rows = Math.max(1, Math.floor(area.h / tile));
    const d = density / 100;
    const nScale = 1 / (tile * 2.2);
    const leaves = [];

    function rec(x, y, s, depth) {
      const cx = x + s / 2, cy = y + s / 2;
      const n = noise(cx * nScale, cy * nScale);               // 0..1
      const focus = Math.pow(Math.max(0, n - 0.18) / 0.82, 1.4); // clustered hotspots
      const p = d * (0.15 + 1.25 * focus) * Math.pow(0.78, depth);
      if (depth < MAX_DEPTH && s / 2 >= MIN_TILE && rnd() < p) {
        const h = s / 2;
        rec(x, y, h, depth + 1); rec(x + h, y, h, depth + 1);
        rec(x, y + h, h, depth + 1); rec(x + h, y + h, h, depth + 1);
      } else {
        leaves.push({ x, y, s, depth });
      }
    }
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        rec(area.x + c * tile, area.y + r * tile, tile, 0);
    return { leaves, cols, rows, tile };
  }

  // ---------- tile motifs (Carlson-style multi-scale Truchet) ----------
  // Each tile: square in colour B, corner "wings" (r = s/3) in B,
  // motif bands (width s/3, hitting every edge midpoint) in colour A.
  // Colours swap at each quadtree level so all scales connect seamlessly.
  const f = v => +v.toFixed(3);

  function arcBand(cx, cy, s, dirX, dirY) {
    // quarter annulus centred at corner (cx,cy) opening towards (dirX,dirY)
    const r1 = s / 3, r2 = 2 * s / 3;
    const ax = cx + dirX * r2, ay = cy;
    const bx = cx, by = cy + dirY * r2;
    const cx2 = cx, cy2 = cy + dirY * r1;
    const dx = cx + dirX * r1, dy = cy;
    const sweep = (dirX * dirY > 0) ? 1 : 0;
    return `M${f(ax)} ${f(ay)}A${f(r2)} ${f(r2)} 0 0 ${sweep} ${f(bx)} ${f(by)}L${f(cx2)} ${f(cy2)}A${f(r1)} ${f(r1)} 0 0 ${1 - sweep} ${f(dx)} ${f(dy)}Z`;
  }
  function rect(x, y, w, h) {
    return `M${f(x)} ${f(y)}h${f(w)}v${f(h)}h${f(-w)}Z`;
  }
  function halfDisk(mx, my, r, nx, ny) {
    // half disk at edge midpoint (mx,my) bulging inward along (nx,ny)
    const px = -ny, py = nx; // tangent
    const x1 = mx + px * r, y1 = my + py * r, x2 = mx - px * r, y2 = my - py * r;
    const sweep = (nx * py - ny * px) > 0 ? 0 : 1;
    return `M${f(x1)} ${f(y1)}A${f(r)} ${f(r)} 0 0 ${sweep} ${f(x2)} ${f(y2)}Z`;
  }
  function circle(cx, cy, r) {
    return `M${f(cx - r)} ${f(cy)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0Z`;
  }

  function motif(t, kind) {
    const { x, y, s } = t, w = s / 3, r = s / 6;
    const T = [x + s / 2, y], B = [x + s / 2, y + s], L = [x, y + s / 2], R = [x + s, y + s / 2];
    switch (kind) {
      case 'arcA': return arcBand(x, y, s, 1, 1) + arcBand(x + s, y + s, s, -1, -1);
      case 'arcB': return arcBand(x + s, y, s, -1, 1) + arcBand(x, y + s, s, 1, -1);
      case 'cross': return rect(x, y + w, s, w) + rect(x + w, y, w, s);
      case 'hline': return rect(x, y + w, s, w) + halfDisk(T[0], T[1], r, 0, 1) + halfDisk(B[0], B[1], r, 0, -1);
      case 'vline': return rect(x + w, y, w, s) + halfDisk(L[0], L[1], r, 1, 0) + halfDisk(R[0], R[1], r, -1, 0);
      case 'dots':  return halfDisk(T[0], T[1], r, 0, 1) + halfDisk(B[0], B[1], r, 0, -1) + halfDisk(L[0], L[1], r, 1, 0) + halfDisk(R[0], R[1], r, -1, 0);
      case 'tee': {
        // one arc + stubs: arc in one corner, caps on the opposite two edges
        return arcBand(x, y, s, 1, 1) + halfDisk(B[0], B[1], r, 0, -1) + halfDisk(R[0], R[1], r, -1, 0);
      }
      case 'teeB': return arcBand(x + s, y + s, s, -1, -1) + halfDisk(T[0], T[1], r, 0, 1) + halfDisk(L[0], L[1], r, 1, 0);
    }
    return '';
  }

  function pickStyle(rnd) {
    // each seed gets its own motif "grammar" — keeps every poster coherent
    const styles = [
      { name: 'Meander',  w: { arcA: 5, arcB: 5, cross: 0.4, hline: 0.3, vline: 0.3, dots: 0.15, tee: 0.2, teeB: 0.2 } },
      { name: 'Weave',    w: { arcA: 3, arcB: 3, cross: 1.2, hline: 0.8, vline: 0.8, dots: 0.2, tee: 0.3, teeB: 0.3 } },
      { name: 'Labyrinth',w: { arcA: 4, arcB: 4, cross: 0.2, hline: 1.0, vline: 1.0, dots: 0.4, tee: 0.8, teeB: 0.8 } },
      { name: 'Pure Arc', w: { arcA: 1, arcB: 1 } },
    ];
    return styles[(rnd() * styles.length) | 0];
  }
  function weighted(rnd, w) {
    let sum = 0; for (const k in w) sum += w[k];
    let r = rnd() * sum;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return Object.keys(w)[0];
  }

  // ---------- poster assembly ----------
  function generate() {
    const pal = PALETTES[state.palette];
    const seedNum = hashStr(state.seed);
    let best = null;

    const area = { x: MARGIN, y: MARGIN, w: W - 2 * MARGIN, h: H - 2 * MARGIN - CAPTION };

    // gallery guard: try a few sub-seeds, keep the one with the best scale balance
    for (let attempt = 0; attempt < 6; attempt++) {
      const rnd = mulberry32(seedNum + attempt * 0x9E3779B1);
      const noise = makeNoise(rnd);
      const res = buildTiles(rnd, noise, area, state.size, state.density);
      const hist = new Array(MAX_DEPTH + 1).fill(0);
      res.leaves.forEach(l => hist[l.depth] += l.s * l.s);
      const total = res.cols * res.rows * res.tile * res.tile;
      const big = hist[0] / total;
      const levels = hist.filter(a => a / total > 0.03).length;
      // ideal: some large calm tiles, several active scales
      let score = -Math.abs(big - (0.55 - state.density / 250)) * 2 + levels * 0.25;
      if (state.density < 5) score = 0;
      if (!best || score > best.score) best = { score, res, rnd, attempt };
      if (state.density < 5) break;
    }

    const { res, rnd } = best;
    const style = pickStyle(rnd);
    const invert = rnd() < 0.5;
    const tilesH = res.rows * res.tile;
    const offY = MARGIN + Math.max(0, (area.h - tilesH) / 2) * 0; // tiling anchored to top margin
    const clip = { x: area.x, y: offY, w: area.w, h: tilesH };

    // group geometry by depth and colour role
    const byDepth = [];
    for (const t of res.leaves) {
      (byDepth[t.depth] ||= { B: [], A: [] });
      const g = byDepth[t.depth];
      const { x, y, s } = t, r = s / 3;
      g.B.push(rect(x, y, s, s));
      g.B.push(circle(x, y, r), circle(x + s, y, r), circle(x, y + s, r), circle(x + s, y + s, r));
      g.A.push(motif(t, weighted(rnd, style.w)));
    }

    const gradAngle = rnd() * Math.PI;
    const gx = Math.cos(gradAngle), gy = Math.sin(gradAngle);
    const gcx = W / 2, gcy = H / 2, gl = Math.hypot(W, H) / 2;
    const g1 = [gcx - gx * gl, gcy - gy * gl], g2 = [gcx + gx * gl, gcy + gy * gl];

    const roleColor = (depth, role) => {
      const parity = (depth + (invert ? 1 : 0)) % 2;
      // role B = tile body, role A = motif band; swapped every level
      const isInk = (role === 'A') ? parity === 0 : parity === 1;
      return isInk ? 'url(#ink)' : 'url(#paper)';
    };

    let layers = '';
    for (let d = 0; d < byDepth.length; d++) {
      const g = byDepth[d];
      if (!g) continue;
      layers += `<path fill="${roleColor(d, 'B')}" d="${g.B.join('')}"/>`;
      layers += `<path fill="${roleColor(d, 'A')}" d="${g.A.join('')}"/>`;
    }

    const counts = byDepth.map(g => g ? g.A.length : 0);
    const nTiles = res.leaves.length;
    const capY = clip.y + clip.h + 16;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fontStack = `'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif`;
    const monoStack = `'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace`;

    const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}">
  <title>Truchet — ${esc(state.seed)}</title>
  <desc>Multi-scale Truchet tiling, quadtree subdivision. Seed ${esc(state.seed)}, palette ${esc(pal.name)}. A2 420x594mm.</desc>
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="${f(g1[0])}" y1="${f(g1[1])}" x2="${f(g2[0])}" y2="${f(g2[1])}">
      <stop offset="0" stop-color="${pal.ink[0]}"/><stop offset="1" stop-color="${pal.ink[1]}"/>
    </linearGradient>
    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="${f(g2[0])}" y1="${f(g2[1])}" x2="${f(g1[0])}" y2="${f(g1[1])}">
      <stop offset="0" stop-color="${pal.paper[0]}"/><stop offset="1" stop-color="${pal.paper[1]}"/>
    </linearGradient>
    <clipPath id="frame"><rect x="${f(clip.x)}" y="${f(clip.y)}" width="${f(clip.w)}" height="${f(clip.h)}"/></clipPath>
  </defs>
  <rect width="${W}" height="${H}" fill="${pal.sheet}"/>
  <g clip-path="url(#frame)">${layers}</g>
  <rect x="${f(clip.x)}" y="${f(clip.y)}" width="${f(clip.w)}" height="${f(clip.h)}" fill="none" stroke="${pal.text}" stroke-opacity="0.25" stroke-width="0.25"/>
  <g font-family="${fontStack}" fill="${pal.text}">
    <text x="${MARGIN}" y="${f(capY + 6)}" font-size="11" font-weight="700" letter-spacing="0.4">TRUCHET</text>
    <text x="${MARGIN}" y="${f(capY + 13)}" font-size="4" letter-spacing="1.1" font-family="${monoStack}" opacity="0.75">MULTI-SCALE STUDY · ${esc(style.name.toUpperCase())}</text>
    <circle cx="${f(W / 2)}" cy="${f(capY + 2.5)}" r="2.6" fill="${pal.accent}"/>
    <text x="${W - MARGIN}" y="${f(capY + 2)}" font-size="4" text-anchor="end" letter-spacing="1" font-family="${monoStack}">Nº ${esc(state.seed.toUpperCase())}</text>
    <text x="${W - MARGIN}" y="${f(capY + 8)}" font-size="3.2" text-anchor="end" letter-spacing="0.8" font-family="${monoStack}" opacity="0.7">${esc(pal.name.toUpperCase())} · ${nTiles} TILES · ${counts.filter(Boolean).length} SCALES</text>
    <text x="${W - MARGIN}" y="${f(capY + 13)}" font-size="3.2" text-anchor="end" letter-spacing="0.8" font-family="${monoStack}" opacity="0.7">A2 · 420 × 594 MM</text>
  </g>
</svg>`;

    return { svg, nTiles, counts, style: style.name, attempt: best.attempt };
  }

  // ---------- UI ----------
  let current = null;
  function render() {
    const stage = $('stage');
    current = generate();
    stage.innerHTML = current.svg;
    const pal = PALETTES[state.palette];
    $('palname').textContent = pal.name;
    $('sizeOut').textContent = state.size + ' mm';
    $('densOut').textContent = state.density + '%';
    $('seed').value = state.seed;
    document.querySelectorAll('.pal').forEach((b, i) => b.classList.toggle('active', i === state.palette));
    $('stats').innerHTML =
      `style&nbsp;&nbsp;${current.style}<br>tiles&nbsp;&nbsp;${current.nTiles}<br>scales&nbsp;${current.counts.map((c, i) => c ? `L${i}:${c}` : '').filter(Boolean).join(' ')}`;
    try { history.replaceState(null, '', `#seed=${encodeURIComponent(state.seed)}&p=${state.palette}&size=${state.size}&d=${state.density}`); } catch (e) {}
  }

  // palette swatches
  PALETTES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'pal'; b.title = p.name; b.setAttribute('aria-label', p.name);
    b.innerHTML = `<span style="background:linear-gradient(135deg, ${p.paper[0]} 0 50%, ${p.ink[0]} 50% 100%)"></span>
                   <span style="inset:auto 6px 6px auto;width:8px;height:8px;border-radius:50%;background:${p.accent}"></span>`;
    b.onclick = () => { state.palette = i; render(); };
    $('palettes').appendChild(b);
  });

  let raf = 0;
  const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
  $('size').value = state.size;
  $('density').value = state.density;
  $('size').addEventListener('input', e => { state.size = +e.target.value; schedule(); });
  $('density').addEventListener('input', e => { state.density = +e.target.value; schedule(); });
  $('seed').addEventListener('change', e => { state.seed = e.target.value.trim() || randomSeed(); render(); });

  function regenerate() {
    const stage = $('stage');
    stage.classList.add('fade');
    setTimeout(() => {
      state.seed = randomSeed();
      render();
      stage.classList.remove('fade');
    }, 160);
  }
  function download() {
    if (!current) return;
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + current.svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `truchet-A2-${state.seed}-${PALETTES[state.palette].name.toLowerCase().replace(/\W+/g, '-')}.svg`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  $('regen').onclick = regenerate;
  $('download').onclick = download;
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.key === 'r' || e.key === 'R' || e.key === ' ') { e.preventDefault(); regenerate(); }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); download(); }
    if (e.key >= '1' && e.key <= '5') { state.palette = +e.key - 1; render(); }
  });

  render();
})();
</script>
</body>
</html>
