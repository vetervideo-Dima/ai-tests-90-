<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mandelbulb Audio</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020205; color: #e8e6ff;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: radial-gradient(ellipse at center, rgba(10,6,30,0.35), rgba(0,0,0,0.75)); cursor: pointer;
    transition: opacity .8s ease; z-index: 10; text-align: center; padding: 20px; box-sizing: border-box; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { margin: 0; font-weight: 200; letter-spacing: .35em; font-size: clamp(22px, 4vw, 44px); text-transform: uppercase;
    background: linear-gradient(90deg, #8ef, #c9f, #fc8, #8fd); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay p { margin: 0; opacity: .7; font-size: 14px; letter-spacing: .08em; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btns button { font: inherit; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #fff; cursor: pointer;
    padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06);
    backdrop-filter: blur(6px); transition: background .2s, border-color .2s; }
  .btns button:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.5); }
  #hud { position: fixed; left: 16px; bottom: 14px; font-size: 11px; letter-spacing: .14em; opacity: .55; text-transform: uppercase;
    pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div id="overlay">
  <h1>Mandelbulb</h1>
  <p>raymarched fractal · audio-reactive particles</p>
  <div class="btns">
    <button id="btnDrone">▶ Generated drone</button>
    <button id="btnMic">● Microphone</button>
  </div>
  <p style="font-size:12px;opacity:.45">click anywhere to start the drone</p>
</div>
<div id="hud">power <span id="pw">8.00</span> · <span id="src">idle</span></div>

<script type="importmap">
{ "imports": {
  "three": "../../../vendor/three/build/three.module.js",
  "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0, 0.4, 3.0);

// ---------- spectrum texture ----------
const BINS = 64;
const specData = new Uint8Array(BINS);
const specTex = new THREE.DataTexture(specData, BINS, 1, THREE.RedFormat, THREE.UnsignedByteType);
specTex.magFilter = THREE.LinearFilter;
specTex.minFilter = THREE.LinearFilter;
specTex.needsUpdate = true;

// ---------- Mandelbulb fullscreen quad ----------
const fractalMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPower: { value: 8 },
    uProjInv: { value: new THREE.Matrix4() },
    uCamWorld: { value: new THREE.Matrix4() },
    uBass: { value: 0 },
    uMid: { value: 0 },
    uHigh: { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vNdc;
    void main() {
      vNdc = position.xy;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vNdc;
    uniform float uTime, uPower, uBass, uMid, uHigh;
    uniform mat4 uProjInv, uCamWorld;

    #define MAX_STEPS 140
    #define ITER 8

    vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d) { return a + b * cos(6.28318 * (c * t + d)); }

    float mapDE(vec3 p, out vec4 trap) {
      vec3 z = p;
      float dr = 1.0;
      float r = 0.0;
      trap = vec4(abs(z), dot(z, z));
      for (int i = 0; i < ITER; i++) {
        r = length(z);
        if (r > 2.0) break;
        float theta = acos(clamp(z.z / r, -1.0, 1.0));
        float phi = atan(z.y, z.x);
        dr = pow(r, uPower - 1.0) * uPower * dr + 1.0;
        float zr = pow(r, uPower);
        theta *= uPower;
        phi *= uPower;
        z = zr * vec3(sin(theta) * cos(phi), sin(phi) * sin(theta), cos(theta)) + p;
        trap = min(trap, vec4(abs(z), dot(z, z)));
      }
      return 0.5 * log(r) * r / dr;
    }

    float mapOnly(vec3 p) { vec4 t; return mapDE(p, t); }

    vec3 calcNormal(vec3 p, float eps) {
      const vec2 k = vec2(1.0, -1.0);
      return normalize(
        k.xyy * mapOnly(p + k.xyy * eps) +
        k.yyx * mapOnly(p + k.yyx * eps) +
        k.yxy * mapOnly(p + k.yxy * eps) +
        k.xxx * mapOnly(p + k.xxx * eps));
    }

    vec2 sphereHit(vec3 ro, vec3 rd, float r) {
      float b = dot(ro, rd);
      float c = dot(ro, ro) - r * r;
      float h = b * b - c;
      if (h < 0.0) return vec2(-1.0);
      h = sqrt(h);
      return vec2(-b - h, -b + h);
    }

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    vec3 background(vec3 rd) {
      float g = 0.5 + 0.5 * rd.y;
      vec3 col = mix(vec3(0.004, 0.003, 0.012), vec3(0.02, 0.012, 0.05), g);
      // nebula-ish swirl
      float n = sin(rd.x * 3.0 + uTime * 0.05) * sin(rd.y * 4.0 - uTime * 0.04) * sin(rd.z * 3.5);
      col += vec3(0.05, 0.02, 0.09) * smoothstep(0.2, 1.0, n) * (0.6 + uMid);
      // stars
      vec2 sp = vec2(atan(rd.z, rd.x), asin(clamp(rd.y, -1.0, 1.0))) * 120.0;
      vec2 cell = floor(sp);
      float h = hash(cell);
      float star = step(0.985, h) * smoothstep(0.5, 0.0, length(fract(sp) - 0.5));
      col += vec3(0.8, 0.85, 1.0) * star * (0.4 + 0.6 * sin(uTime * 2.0 + h * 50.0));
      return col;
    }

    void main() {
      vec4 vp = uProjInv * vec4(vNdc, 1.0, 1.0);
      vp /= vp.w;
      vec3 rd = normalize((uCamWorld * vec4(vp.xyz, 0.0)).xyz);
      vec3 ro = cameraPosition;

      vec3 col = background(rd);
      float depth = 1.0;

      vec2 bs = sphereHit(ro, rd, 1.25);
      float minD = 1e9;
      if (bs.y > 0.0) {
        float t = max(bs.x, 0.0);
        float tMax = bs.y;
        bool hit = false;
        int steps = 0;
        vec4 trap;
        for (int i = 0; i < MAX_STEPS; i++) {
          vec3 p = ro + rd * t;
          float d = mapDE(p, trap);
          minD = min(minD, d);
          float eps = 0.0006 * t;
          if (d < eps) { hit = true; steps = i; break; }
          t += d * 0.9;
          if (t > tMax) break;
          steps = i;
        }

        if (hit) {
          vec3 p = ro + rd * t;
          vec4 tr;
          mapDE(p, tr);
          vec3 n = calcNormal(p, 0.0005 * t);
          vec3 v = -rd;
          vec3 L1 = normalize(vec3(0.6, 0.8, 0.4));
          vec3 L2 = normalize(vec3(-0.7, -0.2, -0.6));
          float diff = max(dot(n, L1), 0.0);
          float diff2 = max(dot(n, L2), 0.0);
          vec3 h = normalize(L1 + v);
          float spec = pow(max(dot(n, h), 0.0), 48.0);
          float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
          float ao = clamp(1.0 - float(steps) / float(MAX_STEPS), 0.0, 1.0);
          ao = pow(ao, 1.6);

          // iridescent orbit-trap coloring
          float ot = sqrt(tr.w);
          float k = ot * 1.3 + tr.x * 0.7 - tr.y * 0.4 + uTime * 0.04;
          vec3 base = pal(k, vec3(0.5), vec3(0.5), vec3(1.0, 1.0, 1.0), vec3(0.0, 0.33, 0.67));
          vec3 base2 = pal(tr.z * 1.5 + 0.3 + uTime * 0.02, vec3(0.5), vec3(0.5), vec3(1.0, 0.7, 0.4), vec3(0.0, 0.15, 0.2));
          base = mix(base, base2, smoothstep(0.0, 1.0, tr.y));
          vec3 irid = pal(dot(n, v) * 1.5 + ot + uTime * 0.07, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.1, 0.4, 0.7));

          col = base * (0.08 + diff * 0.95 + diff2 * 0.25 * vec3(0.4, 0.5, 1.0)) * ao;
          col += spec * vec3(1.0, 0.95, 0.9) * 0.8 * ao;
          col += irid * fres * (0.9 + uHigh * 1.5);
          col += base * (uBass * 0.6) * smoothstep(0.6, 0.2, ot); // inner pulse

          vec4 clip = projectionMatrix * viewMatrix * vec4(p, 1.0);
          depth = clamp(clip.z / clip.w * 0.5 + 0.5, 0.0, 1.0);
        } else {
          // halo glow from near misses
          float glow = exp(-minD * 18.0);
          col += pal(uTime * 0.05, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67)) * glow * (0.25 + uBass * 0.9);
        }
      }

      gl_FragColor = vec4(col, 1.0);
      gl_FragDepth = depth;
    }
  `,
  depthWrite: true,
  depthTest: true,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fractalMat);
quad.frustumCulled = false;
quad.renderOrder = -1;
scene.add(quad);

// ---------- instanced particles ----------
const COUNT = 9000;
const plane = new THREE.PlaneGeometry(1, 1);
const pgeo = new THREE.InstancedBufferGeometry();
pgeo.index = plane.index;
pgeo.setAttribute('position', plane.getAttribute('position'));
pgeo.setAttribute('uv', plane.getAttribute('uv'));
const seeds = new Float32Array(COUNT * 4);
const bins = new Float32Array(COUNT);
for (let i = 0; i < COUNT; i++) {
  seeds[i * 4 + 0] = Math.random();
  seeds[i * 4 + 1] = Math.random();
  seeds[i * 4 + 2] = Math.pow(Math.random(), 1.4);
  seeds[i * 4 + 3] = Math.random();
  bins[i] = (Math.pow(Math.random(), 1.6) * (BINS - 1) + 0.5) / BINS;
}
pgeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 4));
pgeo.setAttribute('aBin', new THREE.InstancedBufferAttribute(bins, 1));
pgeo.instanceCount = COUNT;

const particleMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uSpec: { value: specTex },
    uBass: { value: 0 },
  },
  vertexShader: /* glsl */`
    attribute vec4 aSeed;
    attribute float aBin;
    uniform float uTime, uBass;
    uniform sampler2D uSpec;
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vAlpha;
    vec3 pal(float t) { return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67))); }
    void main() {
      float s = texture2D(uSpec, vec2(aBin, 0.5)).r;
      float dir = aSeed.y > 0.5 ? 1.0 : -1.0;
      float th = aSeed.x * 6.28318 + uTime * (0.04 + aSeed.w * 0.12) * dir;
      float ph = acos(aSeed.y * 2.0 - 1.0) + 0.15 * sin(uTime * 0.3 + aSeed.x * 12.0);
      float rad = 1.5 + aSeed.z * 2.4 + s * 0.7 * (0.4 + aSeed.w) + uBass * 0.2;
      vec3 c = rad * vec3(sin(ph) * cos(th), cos(ph), sin(ph) * sin(th));
      c += 0.06 * vec3(sin(uTime * 0.7 + aSeed.x * 20.0), sin(uTime * 0.6 + aSeed.y * 17.0), cos(uTime * 0.5 + aSeed.z * 13.0));
      vec4 mv = modelViewMatrix * vec4(c, 1.0);
      float size = (0.01 + 0.02 * aSeed.w) * (1.0 + s * 2.5);
      mv.xy += position.xy * size;
      gl_Position = projectionMatrix * mv;
      vUv = uv;
      vColor = pal(aBin * 1.4 + aSeed.x * 0.25 + uTime * 0.05) * (0.5 + s * 2.2);
      vAlpha = 0.35 + s * 0.9;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float a = smoothstep(1.0, 0.0, d);
      a = a * a;
      gl_FragColor = vec4(vColor * a * vAlpha, 1.0);
    }
  `,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,
});
const particles = new THREE.Mesh(pgeo, particleMat);
particles.frustumCulled = false;
scene.add(particles);

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.55, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- audio ----------
let audioCtx = null, analyser = null, freq = null, sourceLabel = 'idle';
const overlay = document.getElementById('overlay');
const srcEl = document.getElementById('src');
const pwEl = document.getElementById('pw');

function makeAnalyser() {
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.82;
  freq = new Uint8Array(analyser.frequencyBinCount);
}

function makeImpulse(ctx, seconds, decay) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

function startDrone() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  makeAnalyser();
  const ctx = audioCtx;
  const now = ctx.currentTime;

  const master = ctx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.38, now + 4);

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 700;
  filter.Q.value = 6;

  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.07;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 550;
  lfo.connect(lfoGain).connect(filter.frequency);
  lfo.start();

  const reverb = ctx.createConvolver();
  reverb.buffer = makeImpulse(ctx, 4.5, 2.5);
  const wet = ctx.createGain(); wet.gain.value = 0.6;
  const dry = ctx.createGain(); dry.gain.value = 0.7;

  filter.connect(dry).connect(master);
  filter.connect(reverb).connect(wet).connect(master);
  master.connect(analyser);
  master.connect(ctx.destination);

  const voices = [
    [55, 'sawtooth', 0.16], [55.4, 'sawtooth', 0.14], [82.4, 'sawtooth', 0.09],
    [110, 'triangle', 0.12], [164.8, 'sine', 0.07], [220.5, 'sine', 0.04], [329.6, 'sine', 0.025],
  ];
  voices.forEach(([f, type, g], i) => {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.value = f;
    const gn = ctx.createGain(); gn.gain.value = g;
    // slow tremolo per voice
    const trem = ctx.createOscillator(); trem.frequency.value = 0.05 + i * 0.037;
    const tg = ctx.createGain(); tg.gain.value = g * 0.6;
    trem.connect(tg).connect(gn.gain); trem.start();
    o.connect(gn).connect(filter);
    o.start();
  });

  // pulsing sub
  const sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 41.2;
  const subG = ctx.createGain(); subG.gain.value = 0.0;
  const pulse = ctx.createOscillator(); pulse.frequency.value = 0.5;
  const pulseG = ctx.createGain(); pulseG.gain.value = 0.25;
  pulse.connect(pulseG).connect(subG.gain);
  sub.connect(subG).connect(master);
  sub.start(); pulse.start();

  // airy noise shimmer
  const nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource(); noise.buffer = nbuf; noise.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.5;
  const ng = ctx.createGain(); ng.gain.value = 0.02;
  const nl = ctx.createOscillator(); nl.frequency.value = 0.13;
  const nlg = ctx.createGain(); nlg.gain.value = 0.018;
  nl.connect(nlg).connect(ng.gain); nl.start();
  noise.connect(bp).connect(ng).connect(reverb);
  noise.connect(bp);
  noise.start();

  sourceLabel = 'drone';
}

async function startMic() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    makeAnalyser();
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    sourceLabel = 'microphone';
  } catch (e) {
    console.warn('Microphone unavailable, falling back to drone:', e);
    startDrone();
  }
}

let started = false;
function begin(useMic) {
  if (started) return;
  started = true;
  overlay.classList.add('hidden');
  if (useMic) startMic(); else startDrone();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.getElementById('btnMic').addEventListener('click', (e) => { e.stopPropagation(); begin(true); });
document.getElementById('btnDrone').addEventListener('click', (e) => { e.stopPropagation(); begin(false); });
overlay.addEventListener('click', () => begin(false));

// ---------- analysis ----------
let bass = 0, mid = 0, high = 0;
function updateAudio(t) {
  if (analyser) {
    analyser.getByteFrequencyData(freq);
    for (let i = 0; i < BINS; i++) specData[i] = freq[i];
  } else {
    // idle: synthetic gentle spectrum so the scene breathes before audio starts
    for (let i = 0; i < BINS; i++) {
      const v = 0.35 + 0.25 * Math.sin(t * 1.3 + i * 0.35) * Math.sin(t * 0.7 + i * 0.11);
      specData[i] = Math.max(0, Math.min(255, v * 255 * (1 - i / BINS * 0.7)));
    }
  }
  specTex.needsUpdate = true;
  let b = 0, m = 0, h = 0;
  for (let i = 0; i < 6; i++) b += specData[i];
  for (let i = 6; i < 24; i++) m += specData[i];
  for (let i = 24; i < BINS; i++) h += specData[i];
  b /= 6 * 255; m /= 18 * 255; h /= (BINS - 24) * 255;
  bass += (b - bass) * 0.15; mid += (m - mid) * 0.1; high += (h - high) * 0.1;
}

// ---------- resize ----------
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// ---------- loop ----------
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  updateAudio(t);

  // slow orbital camera
  const r = 2.75 + 0.35 * Math.sin(t * 0.07);
  const a = t * 0.08;
  camera.position.set(Math.cos(a) * r, 0.6 * Math.sin(t * 0.05), Math.sin(a) * r);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();

  // power animates 6 -> 10 -> 6
  const power = 8.0 - 2.0 * Math.cos(t * 0.08);

  const u = fractalMat.uniforms;
  u.uTime.value = t;
  u.uPower.value = power;
  u.uProjInv.value.copy(camera.projectionMatrixInverse);
  u.uCamWorld.value.copy(camera.matrixWorld);
  u.uBass.value = bass; u.uMid.value = mid; u.uHigh.value = high;

  particleMat.uniforms.uTime.value = t;
  particleMat.uniforms.uBass.value = bass;

  bloom.strength = 0.75 + bass * 1.1;

  pwEl.textContent = power.toFixed(2);
  srcEl.textContent = sourceLabel;

  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
