<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpine Valley Shader</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f16; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; touch-action: none; }
  #hud { position: fixed; left: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         color: #e8eef7; background: rgba(10,14,22,.55); padding: 6px 10px; border-radius: 6px; user-select: none;
         backdrop-filter: blur(4px); }
  #hud b { font-weight: 600; }
  #hud button { font: inherit; color: inherit; background: rgba(255,255,255,.12); border: 0; border-radius: 4px; padding: 2px 8px; margin-left: 6px; cursor: pointer; }
  @media (max-width: 600px) { #hud { font-size: 11px; left: 8px; bottom: 8px; } #hud .hint { display: none; } }
  #err { position: fixed; inset: 0; display: none; white-space: pre-wrap; color: #ff9b9b; background: #1a0b0b; padding: 16px; font: 12px ui-monospace, monospace; overflow: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Alpine Valley</b> · <span id="fps">–</span> fps · <span id="res">–</span><span class="hint"> · drag to look · space = pause</span>
  <button id="pause">pause</button></div>
<pre id="err"></pre>

<script id="fs" type="x-shader/x-fragment">
// Alpine Valley — single-pass Shadertoy shader, no textures.
// Raymarched fbm heightfield (derivative-damped "eroded" fbm + ridged crags),
// a winding river carved into a wide glacial valley, meadows, conifer forest,
// snow on the peaks, soft shadows, height-based aerial perspective,
// sun glints on flowing water, slow camera dolly along the river (iTime).

#define SUN normalize(vec3(0.52, 0.26, 0.81))
#define TMAX 480.0
#define MAXH 110.0

const mat2 M2 = mat2(0.80, 0.60, -0.60, 0.80);

float hash12(vec2 p)
{
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

// value noise with analytic derivatives, returns (n, dn/dx, dn/dy), n in [0,1]
vec3 noised(vec2 x)
{
    vec2 i = floor(x);
    vec2 f = fract(x);
    vec2 u  = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
    float a = hash12(i);
    float b = hash12(i + vec2(1.0, 0.0));
    float c = hash12(i + vec2(0.0, 1.0));
    float d = hash12(i + vec2(1.0, 1.0));
    float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
    return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y,
                du * vec2(k1 + k4 * u.y, k2 + k4 * u.x));
}

// river centre line (x as a function of z)
float riverX(float z)
{
    return 7.0 * sin(z * 0.021) + 3.0 * sin(z * 0.057 + 1.7);
}

// eroded fbm: octaves are damped where the slope accumulated so far is high
float mountains(vec2 p, int oct)
{
    vec2 q = p * 0.0105;
    float a = 0.0, b = 1.0;
    vec2 d = vec2(0.0);
    for (int i = 0; i < 12; i++)
    {
        if (i >= oct) break;
        vec3 n = noised(q);
        n = vec3(n.x * 2.0 - 1.0, n.yz * 2.0);
        d += n.yz;
        a += b * n.x / (1.0 + dot(d, d));
        b *= 0.5;
        q = M2 * q * 2.03;
    }
    return a;
}

// sharp ridges / crags (ridged noise), only for close-range detail
float crags(vec2 p)
{
    float a = 0.0, b = 0.5;
    vec2 q = p * 0.05;
    for (int i = 0; i < 3; i++)
    {
        float n = 1.0 - abs(noised(q).x * 2.0 - 1.0);
        a += b * n * n;
        b *= 0.5;
        q = M2 * q * 2.1;
    }
    return a;
}

float softplus(float x, float k) { return k * log(1.0 + exp(x / k)); }

float terrain(vec2 p, int oct)
{
    float adx = abs(p.x - riverX(p.y));
    float m = mountains(p, oct);
    // valley floor: river bed below the water level (y = 0), gentle banks
    float floorH = -1.2 + 2.0 * smoothstep(1.5, 7.0, adx);
    floorH += 0.7 * m * smoothstep(4.0, 14.0, adx);
    // mountains rise away from the river: wide glacial valley with distinct peaks
    float v = smoothstep(6.0, 80.0, adx);
    float hm = softplus(16.0 + 60.0 * m, 6.0);
    float h = floorH + v * (hm + 12.0 * v);
    if (oct > 6) h += 7.0 * v * (crags(p) - 0.25) * smoothstep(4.0, 30.0, h);
    return h;
}

// level of detail: fewer octaves far away (they would only alias anyway)
int lodOct(float t, int hi)
{
    return max(hi - int(log2(1.0 + t / 20.0)), 5);
}

float raymarch(vec3 ro, vec3 rd, float tmax, int hiOct, int steps)
{
    float t = 0.5, tp = 0.5;
    for (int i = 0; i < 400; i++)
    {
        if (i >= steps) break;
        vec3 p = ro + rd * t;
        int oct = lodOct(t, hiOct);
        float h = p.y - terrain(p.xz, oct);
        if (h < 0.0015 * t)
        {
            // refine between previous and current t
            float a = tp, b = t;
            for (int j = 0; j < 5; j++)
            {
                float c = 0.5 * (a + b);
                vec3 q = ro + rd * c;
                if (q.y - terrain(q.xz, oct) < 0.0) b = c; else a = c;
            }
            return 0.5 * (a + b);
        }
        if (t > tmax || (rd.y > 0.0 && p.y > MAXH)) return -1.0;
        tp = t;
        t += max((0.4 + 0.0012 * t) * h, 0.01 + 0.001 * t);
    }
    return (t < tmax) ? t : -1.0;
}

vec3 calcNormal(vec3 p, float t)
{
    int oct = lodOct(t, 11);
    vec2 e = vec2(0.0012 * t + 0.008, 0.0);
    float h0 = terrain(p.xz, oct);
    return normalize(vec3(h0 - terrain(p.xz + e.xy, oct),
                          e.x,
                          h0 - terrain(p.xz + e.yx, oct)));
}

float softShadow(vec3 ro, vec3 rd)
{
    float res = 1.0, t = 0.3;
    for (int i = 0; i < 48; i++)
    {
        vec3 p = ro + rd * t;
        float h = p.y - terrain(p.xz, 5);
        res = min(res, 10.0 * h / t);
        if (res < 0.001 || p.y > MAXH) break;
        t += clamp(0.6 * h, 0.35, 18.0);
    }
    res = clamp(res, 0.0, 1.0);
    return res * res * (3.0 - 2.0 * res);
}

float fbm2(vec2 p)
{
    float a = 0.0, b = 0.5;
    for (int i = 0; i < 5; i++)
    {
        a += b * noised(p).x;
        b *= 0.5;
        p = M2 * p * 2.02;
    }
    return a;
}

vec3 skyColor(vec3 rd)
{
    float sd = max(dot(rd, SUN), 0.0);
    float y = max(rd.y, 0.0);
    vec3 col = mix(vec3(0.72, 0.80, 0.90), vec3(0.16, 0.36, 0.74), pow(y, 0.5));
    col += vec3(1.0, 0.68, 0.38) * 0.32 * pow(sd, 5.0);
    col += vec3(1.0, 0.85, 0.60) * 0.60 * pow(sd, 64.0);
    col += vec3(1.0, 0.95, 0.85) * 30.0 * smoothstep(0.9994, 0.9998, sd);
    if (rd.y > 0.0)
    {
        vec2 uv = rd.xz / (rd.y + 0.12) * 1.6 + vec2(iTime * 0.015, iTime * 0.04);
        float c = smoothstep(0.45, 0.80, fbm2(uv));
        vec3 cc = vec3(1.0, 0.97, 0.94) * (0.80 + 0.6 * pow(sd, 4.0));
        col = mix(col, cc, c * 0.65 * smoothstep(0.0, 0.25, rd.y));
    }
    return col;
}

vec3 shadeTerrain(vec3 p, vec3 n, vec3 rd, float t, bool shadows)
{
    float h = p.y;
    float r  = noised(p.xz * 0.15).x;
    float r2 = noised(p.xz * 1.30 + 7.0).x;
    float fd = 1.0 - smoothstep(60.0, 220.0, t);   // fade fine detail with distance

    vec3 rock  = mix(vec3(0.17, 0.15, 0.14), vec3(0.36, 0.33, 0.30), r) * (1.0 + 0.4 * fd * (r2 - 0.5));
    vec3 grass = mix(vec3(0.10, 0.17, 0.05), vec3(0.24, 0.28, 0.10), r2 * fd + 0.5 * (1.0 - fd));
    float g = smoothstep(0.70, 0.88, n.y) * (1.0 - smoothstep(12.0, 24.0, h + 6.0 * r));
    vec3 alb = mix(rock, grass, g);

    // conifer forest patches on the lower slopes
    float fo = noised(p.xz * 0.06 + 3.0).x * 0.7 + noised(p.xz * 0.5).x * 0.3;
    float forest = smoothstep(0.50, 0.60, fo) * smoothstep(1.5, 4.0, h) *
                   (1.0 - smoothstep(14.0, 20.0, h + 4.0 * r)) * smoothstep(0.55, 0.75, n.y);
    alb = mix(alb, vec3(0.035, 0.065, 0.035) * (0.8 + 0.4 * r2), forest);

    // gravel banks next to the water
    float sand = 1.0 - smoothstep(0.25, 1.1, h + 0.5 * r2);
    alb = mix(alb, vec3(0.44, 0.40, 0.34), sand * 0.85);

    // snow: above the snow line on not-too-steep slopes
    float snowLine = 22.0 + 10.0 * (r - 0.5);
    float s = smoothstep(snowLine - 3.0, snowLine + 3.0, h) *
              smoothstep(0.40, 0.65, n.y + 0.15 * (r2 - 0.5));
    alb = mix(alb, vec3(0.92, 0.95, 1.0), s);

    float dif = max(dot(n, SUN), 0.0);
    float sha = 1.0;
    if (shadows) sha = (dif > 0.0) ? softShadow(p + n * 0.1, SUN) : 0.0;
    float amb = 0.5 + 0.5 * n.y;
    float bou = clamp(dot(n, normalize(vec3(-SUN.x, 0.0, -SUN.z))), 0.0, 1.0) * clamp(1.0 - n.y, 0.0, 1.0);
    float occ = mix(0.55, 1.0, smoothstep(-1.0, 12.0, h)) * mix(0.75, 1.0, 1.0 - forest);

    vec3 lin = vec3(0.0);
    lin += dif * sha * vec3(3.6, 3.15, 2.5);
    lin += amb * occ * vec3(0.46, 0.56, 0.74) * 0.95;
    lin += bou * occ * vec3(0.42, 0.35, 0.27) * 0.75;
    vec3 col = alb * lin;

    // snow sparkle / sheen
    vec3 hv = normalize(SUN - rd);
    col += s * sha * dif * pow(max(dot(n, hv), 0.0), 24.0) * vec3(1.0, 0.92, 0.82) * 0.6;
    return col;
}

vec3 aerial(vec3 col, vec3 ro, vec3 rd, float t)
{
    float sd = max(dot(rd, SUN), 0.0);
    const float a = 0.0042, b = 0.028;
    float fogAmt;
    if (abs(rd.y) < 1e-4) fogAmt = a * exp(-ro.y * b) * t;
    else fogAmt = a * exp(-ro.y * b) * (1.0 - exp(-t * rd.y * b)) / (rd.y * b);
    // Rayleigh-ish: blue scatters first, distant ridges turn blue then pale
    vec3 ext = exp(-fogAmt * vec3(0.50, 0.80, 1.35));
    vec3 fogCol = mix(vec3(0.52, 0.64, 0.84), vec3(1.0, 0.80, 0.58), pow(sd, 6.0));
    return col * ext + fogCol * (1.0 - ext);
}

vec3 waterNormal(vec2 p, float t)
{
    vec2 g = vec2(0.0);
    vec2 q = p * vec2(1.0, 0.45) * 1.6 + vec2(0.0, -iTime * 1.3);
    float a = 0.5;
    for (int i = 0; i < 4; i++)
    {
        g += a * noised(q).yz;
        q = M2 * q * 2.1 + vec2(0.0, -iTime * 0.9);
        a *= 0.55;
    }
    float k = mix(1.0, 0.35, smoothstep(30.0, 200.0, t));  // calmer far away
    return normalize(vec3(-g.x * 0.16 * k, 1.0, -g.y * 0.08 * k));
}

vec3 shadeWater(vec3 pw, vec3 rd, float t)
{
    vec3 n = waterNormal(pw.xz, t);
    float depth = max(-terrain(pw.xz, 6), 0.0);

    // refraction: riverbed tinted by depth
    vec3 bed  = vec3(0.30, 0.27, 0.20) * 0.8;
    vec3 deep = vec3(0.012, 0.075, 0.09);
    vec3 refr = mix(bed * 0.55, deep, 1.0 - exp(-depth * 1.4));

    // reflection: mountains or sky
    vec3 rr = reflect(rd, n);
    rr.y = abs(rr.y);
    vec3 refl;
    float tr = raymarch(pw + vec3(0.0, 0.05, 0.0), rr, TMAX, 6, 80);
    if (tr > 0.0)
    {
        vec3 rp = pw + rr * tr;
        vec3 rn = calcNormal(rp, tr + 60.0);
        refl = aerial(shadeTerrain(rp, rn, rr, tr + 60.0, false), pw, rr, tr);
    }
    else refl = skyColor(rr);

    float fre = 0.02 + 0.98 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
    vec3 col = mix(refr, refl, fre);

    float sha = softShadow(pw + vec3(0.0, 0.1, 0.0), SUN);

    // sun glints: a tight lobe on rippled normals plus a broader sheen
    float rs = max(dot(reflect(rd, n), SUN), 0.0);
    col += sha * vec3(1.0, 0.88, 0.66) * (70.0 * pow(rs, 1100.0) + 1.4 * pow(rs, 60.0));

    // foam on the shallow edges, moving downstream
    float foam = (1.0 - smoothstep(0.0, 0.2, depth)) *
                 smoothstep(0.5, 0.8, noised(pw.xz * vec2(3.0, 1.0) + vec2(0.0, -iTime * 2.0)).x);
    col = mix(col, vec3(0.85, 0.9, 0.95) * (0.4 + 0.6 * sha), foam * 0.55);
    return col;
}

vec3 aces(vec3 x)
{
    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    // portrait screens keep a sensible horizontal field of view
    vec2 uv = (2.0 * fragCoord - iResolution.xy) / min(iResolution.y, iResolution.x * 1.15);

    // camera: slow dolly following the river
    float z = iTime * 3.5;
    vec3 ro = vec3(riverX(z), 0.0, z);
    ro.y = max(terrain(ro.xz, 5), 0.0) + 7.0 + 1.2 * sin(iTime * 0.13);
    float zt = z + 34.0;
    vec3 ta = vec3(riverX(zt) + 2.0 * sin(iTime * 0.07), 3.6, zt);
    if (iMouse.z > 0.0)
    {
        float yaw = (iMouse.x / iResolution.x - 0.5) * 3.0;
        float pit = (iMouse.y / iResolution.y - 0.5) * 1.2;
        vec3 d = ta - ro;
        float c = cos(yaw), s = sin(yaw);
        d.xz = mat2(c, s, -s, c) * d.xz;
        d.y += pit * 34.0;
        ta = ro + d;
    }
    vec3 ww = normalize(ta - ro);
    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
    vec3 vv = cross(uu, ww);
    vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.7 * ww);

    float tW = (rd.y < 0.0) ? -ro.y / rd.y : 1e9;
    float tmax = min(TMAX, tW);
    float t = raymarch(ro, rd, tmax, 9, 200);

    vec3 col;
    if (t > 0.0)
    {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p, t);
        col = shadeTerrain(p, n, rd, t, true);
        col = aerial(col, ro, rd, t);
    }
    else if (tW < TMAX)
    {
        vec3 pw = ro + rd * tW;
        col = shadeWater(pw, rd, tW);
        col = aerial(col, ro, rd, tW);
    }
    else
    {
        col = skyColor(rd);
        col = mix(aerial(col, ro, rd, TMAX), col, smoothstep(0.0, 0.25, rd.y));
    }

    // sun glare
    float sd = max(dot(rd, SUN), 0.0);
    col += vec3(1.0, 0.65, 0.35) * 0.10 * pow(sd, 4.0);

    col = aces(col * 0.9);
    col = pow(col, vec3(1.0 / 2.2));
    // gentle contrast curve + vignette + dither
    col = col * col * (3.0 - 2.0 * col) * 0.25 + col * 0.75;
    vec2 q = fragCoord / iResolution.xy;
    col *= 0.62 + 0.38 * pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.15);
    col += (hash12(fragCoord + fract(iTime)) - 0.5) / 255.0;
    fragColor = vec4(col, 1.0);
}

</script>

<script>
(() => {
  const canvas = document.getElementById('c');
  const errBox = document.getElementById('err');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  const fail = (m) => { errBox.style.display = 'block'; errBox.textContent = m; console.error(m); };
  if (!gl) { fail('WebGL2 is not available in this browser.'); return; }

  const vsSrc = `#version 300 es
  in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
  const fsSrc = `#version 300 es
  precision highp float;
  uniform vec3 iResolution; uniform float iTime; uniform float iTimeDelta; uniform int iFrame; uniform vec4 iMouse;
  out vec4 outColor;
  ${document.getElementById('fs').textContent}
  void main(){ vec4 c = vec4(0.0); mainImage(c, gl_FragCoord.xy); outColor = vec4(c.rgb, 1.0); }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { fail('Shader compile error:\n' + gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, vsSrc), fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, 'p');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { fail('Link error:\n' + gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['iResolution', 'iTime', 'iTimeDelta', 'iFrame', 'iMouse'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // adaptive resolution: raymarching is heavy, keep the frame rate usable
  const small = Math.min(innerWidth, innerHeight) < 600;
  let scale = small ? 0.45 : 0.5;
  const minScale = 0.35, maxScale = Math.min(window.devicePixelRatio || 1, 1);
  function resize() {
    const w = Math.max(1, Math.round(canvas.clientWidth * scale));
    const h = Math.max(1, Math.round(canvas.clientHeight * scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    document.getElementById('res').textContent = w + '×' + h;
  }
  window.addEventListener('resize', resize);
  resize();

  const mouse = [0, 0, 0, 0];
  const toPix = (e) => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * canvas.width, (1 - (e.clientY - r.top) / r.height) * canvas.height];
  };
  canvas.addEventListener('pointerdown', e => { const [x, y] = toPix(e); mouse[0] = mouse[2] = x; mouse[1] = mouse[3] = y; mouse[2] = Math.abs(mouse[2]) || 1; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (mouse[2] > 0) { const [x, y] = toPix(e); mouse[0] = x; mouse[1] = y; } });
  const up = () => { mouse[2] = -Math.abs(mouse[2]); mouse[3] = -Math.abs(mouse[3]); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);

  let paused = false, time = 0, last = performance.now(), frame = 0;
  const pauseBtn = document.getElementById('pause');
  const togglePause = () => { paused = !paused; pauseBtn.textContent = paused ? 'play' : 'pause'; };
  pauseBtn.addEventListener('click', togglePause);
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); togglePause(); } });

  let acc = 0, cnt = 0, fpsT = performance.now();
  const fpsEl = document.getElementById('fps');

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!paused) time += dt;
    resize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform3f(U.iResolution, canvas.width, canvas.height, 1);
    gl.uniform1f(U.iTime, time + 6.0);
    gl.uniform1f(U.iTimeDelta, dt);
    gl.uniform1i(U.iFrame, frame++);
    gl.uniform4f(U.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    acc += dt; cnt++;
    if (now - fpsT > 1000) {
      const fps = cnt / ((now - fpsT) / 1000);
      fpsEl.textContent = fps.toFixed(0);
      if (fps < 24 && scale > minScale) scale = Math.max(minScale, scale * (fps < 12 ? 0.75 : 0.88));
      else if (fps > 50 && scale < maxScale) scale = Math.min(maxScale, scale * 1.08);
      fpsT = now; cnt = 0; acc = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
