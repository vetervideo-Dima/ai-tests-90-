<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON//SNAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f6ff;
    --magenta: #ff2bd6;
    --yellow: #fff200;
    --bg: #05010d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    color: #e8faff;
    font-family: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas#game {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .scanlines {
    pointer-events: none;
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 4px);
    mix-blend-mode: overlay;
    z-index: 5;
  }
  .vignette {
    pointer-events: none;
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    z-index: 4;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 18px 28px;
    z-index: 6;
    pointer-events: none;
  }
  .hud-block { display: flex; flex-direction: column; gap: 2px; }
  .hud-block.right { align-items: flex-end; }
  .label {
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--magenta);
    text-shadow: 0 0 6px var(--magenta);
    opacity: 0.85;
  }
  .value {
    font-family: 'Orbitron', 'Eurostile', 'Bank Gothic', 'Segoe UI', sans-serif;
    font-weight: 900;
    font-size: 34px;
    letter-spacing: 0.08em;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan), 0 0 24px rgba(0,246,255,0.6);
  }
  #logo {
    font-family: 'Orbitron', 'Eurostile', 'Bank Gothic', 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.6em;
    color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 14px var(--magenta);
    align-self: center;
    opacity: 0.8;
  }
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 7;
    text-align: center;
    background: radial-gradient(ellipse at center, rgba(10,0,30,0.55), rgba(5,1,13,0.85));
    transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-family: 'Orbitron', 'Eurostile', 'Bank Gothic', 'Segoe UI', sans-serif;
    font-weight: 900;
    font-size: clamp(48px, 11vw, 140px);
    letter-spacing: 0.06em;
    line-height: 0.95;
    color: #fff;
    position: relative;
    text-shadow:
      0 0 4px #fff,
      0 0 12px var(--cyan),
      0 0 30px var(--cyan),
      0 0 60px rgba(0,246,255,0.6);
    animation: flicker 4s infinite;
  }
  .title span.alt {
    color: #fff;
    text-shadow:
      0 0 4px #fff,
      0 0 12px var(--magenta),
      0 0 30px var(--magenta),
      0 0 60px rgba(255,43,214,0.6);
  }
  .title::before, .title::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0; width: 100%;
    overflow: hidden;
    pointer-events: none;
  }
  .title::before {
    color: var(--magenta);
    text-shadow: none;
    opacity: 0.6;
    clip-path: inset(0 0 60% 0);
    animation: glitch1 2.6s infinite steps(1);
  }
  .title::after {
    color: var(--cyan);
    text-shadow: none;
    opacity: 0.6;
    clip-path: inset(55% 0 0 0);
    animation: glitch2 3.1s infinite steps(1);
  }
  @keyframes glitch1 {
    0%, 88%, 100% { transform: translate(0,0); opacity: 0; }
    89% { transform: translate(-6px, -2px); opacity: 0.7; }
    92% { transform: translate(5px, 1px); opacity: 0.7; }
    95% { transform: translate(-3px, 0); opacity: 0.5; }
  }
  @keyframes glitch2 {
    0%, 84%, 100% { transform: translate(0,0); opacity: 0; }
    85% { transform: translate(7px, 2px); opacity: 0.7; }
    89% { transform: translate(-4px, -1px); opacity: 0.6; }
    93% { transform: translate(2px, 0); opacity: 0.5; }
  }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 55% { opacity: 0.55; }
  }
  .subtitle {
    margin-top: 18px;
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: clamp(12px, 1.6vw, 16px);
    letter-spacing: 0.5em;
    color: var(--magenta);
    text-shadow: 0 0 8px var(--magenta);
    text-transform: uppercase;
  }
  .prompt {
    margin-top: 48px;
    font-family: 'Orbitron', 'Eurostile', 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 2vw, 20px);
    letter-spacing: 0.35em;
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow), 0 0 22px rgba(255,242,0,0.5);
    animation: pulse 1.2s ease-in-out infinite;
    padding: 14px 28px;
    border: 1px solid rgba(255,242,0,0.6);
    box-shadow: 0 0 12px rgba(255,242,0,0.35), inset 0 0 12px rgba(255,242,0,0.2);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    cursor: pointer;
    pointer-events: auto;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .controls {
    margin-top: 32px;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: rgba(200,240,255,0.55);
    line-height: 2;
  }
  .controls kbd {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    border: 1px solid rgba(0,246,255,0.5);
    color: var(--cyan);
    padding: 0 6px;
    margin: 0 2px;
    box-shadow: 0 0 6px rgba(0,246,255,0.3);
  }
  .final {
    margin-top: 22px;
    font-family: 'Orbitron', 'Eurostile', 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 3vw, 30px);
    letter-spacing: 0.2em;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
  }
  .final .new {
    display: block;
    margin-top: 8px;
    font-size: 0.55em;
    letter-spacing: 0.5em;
    color: var(--yellow);
    text-shadow: 0 0 10px var(--yellow);
  }
  #pauseOverlay .title { font-size: clamp(40px, 8vw, 96px); }
  @media (max-width: 600px) {
    #hud { padding: 12px 14px; }
    .value { font-size: 24px; }
    #logo { display: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<div id="hud">
  <div class="hud-block">
    <div class="label">SCORE</div>
    <div class="value" id="score">0000</div>
  </div>
  <div id="logo">NEON//SNAKE</div>
  <div class="hud-block right">
    <div class="label">HI-SCORE</div>
    <div class="value" id="hiscore">0000</div>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="title" data-text="NEON SNAKE">NEON <span class="alt">SNAKE</span></div>
  <div class="subtitle">// Grid Runner Protocol v2.077</div>
  <div class="prompt" id="startBtn">PRESS ENTER TO JACK IN</div>
  <div class="controls">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> MOVE &nbsp;·&nbsp; <kbd>P</kbd> PAUSE<br>
    SWIPE ON TOUCH DEVICES
  </div>
</div>

<div class="overlay hidden" id="overOverlay">
  <div class="title" data-text="FLATLINED">FLAT<span class="alt">LINED</span></div>
  <div class="final" id="finalScore">SCORE 0000</div>
  <div class="prompt" id="restartBtn">PRESS ENTER TO REBOOT</div>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="title" data-text="PAUSED">PAUSED</div>
  <div class="subtitle">// signal suspended</div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hiscore');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const finalScoreEl = document.getElementById('finalScore');

  const COLS = 28, ROWS = 20;
  const COLORS = {
    cyan: '#00f6ff',
    magenta: '#ff2bd6',
    yellow: '#fff200',
    purple: '#8a2bff',
    grid: 'rgba(0,246,255,0.08)'
  };

  let W = 0, H = 0, dpr = 1;
  let cell = 20, boardX = 0, boardY = 0, boardW = 0, boardH = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const topPad = W < 600 ? 70 : 90;
    const pad = W < 600 ? 12 : 40;
    cell = Math.floor(Math.min((W - pad * 2) / COLS, (H - topPad - pad) / ROWS));
    cell = Math.max(cell, 8);
    boardW = cell * COLS;
    boardH = cell * ROWS;
    boardX = Math.floor((W - boardW) / 2);
    boardY = Math.floor(topPad + (H - topPad - pad - boardH) / 2);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Storage ----------
  let hiscore = 0;
  try { hiscore = parseInt(localStorage.getItem('neonSnakeHi') || '0', 10) || 0; } catch (e) {}
  const pad4 = n => String(n).padStart(4, '0');
  hiEl.textContent = pad4(hiscore);

  // ---------- Audio ----------
  let actx = null;
  function initAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function blip(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  // ---------- Game state ----------
  const STATE = { MENU: 0, PLAY: 1, OVER: 2, PAUSE: 3 };
  let state = STATE.MENU;
  let snake = [], prevSnake = [];
  let dir = { x: 1, y: 0 };
  let dirQueue = [];
  let food = null;
  let bonus = null;
  let score = 0;
  let stepTime = 110;
  let acc = 0;
  let particles = [];
  let shake = 0;
  let flash = 0;
  let time = 0;
  let foodsEaten = 0;

  function resetGame() {
    const cx = Math.floor(COLS / 2) - 3, cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 5; i++) snake.push({ x: cx - i, y: cy });
    prevSnake = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    foodsEaten = 0;
    stepTime = 110;
    acc = 0;
    particles = [];
    bonus = null;
    food = spawnFree();
    updateScore();
  }

  function spawnFree() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    if (food) occupied.add(food.x + ',' + food.y);
    if (bonus) occupied.add(bonus.x + ',' + bonus.y);
    const free = [];
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
      if (!occupied.has(x + ',' + y)) free.push({ x, y });
    }
    if (!free.length) return null;
    return free[(Math.random() * free.length) | 0];
  }

  function updateScore() {
    scoreEl.textContent = pad4(score);
    if (score > hiscore) {
      hiEl.textContent = pad4(score);
    }
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAY;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    blip(220, 0.15, 'sawtooth', 0.05, 660);
  }

  function gameOver() {
    state = STATE.OVER;
    shake = 18;
    flash = 1;
    const head = snake[0];
    burst(head.x, head.y, COLORS.magenta, 60, 6);
    burst(head.x, head.y, COLORS.cyan, 40, 4);
    blip(300, 0.6, 'sawtooth', 0.08, -270);
    let isNew = false;
    if (score > hiscore) {
      hiscore = score;
      isNew = true;
      try { localStorage.setItem('neonSnakeHi', String(hiscore)); } catch (e) {}
    }
    hiEl.textContent = pad4(hiscore);
    finalScoreEl.innerHTML = 'SCORE ' + pad4(score) + (isNew ? '<span class="new">// NEW HIGH SCORE //</span>' : '');
    setTimeout(() => { if (state === STATE.OVER) overOverlay.classList.remove('hidden'); }, 650);
  }

  function togglePause() {
    if (state === STATE.PLAY) {
      state = STATE.PAUSE;
      pauseOverlay.classList.remove('hidden');
    } else if (state === STATE.PAUSE) {
      state = STATE.PLAY;
      pauseOverlay.classList.add('hidden');
      acc = 0;
    }
  }

  function queueDir(x, y) {
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (last.x === x && last.y === y) return;
    if (last.x === -x && last.y === -y) return;
    if (dirQueue.length < 3) dirQueue.push({ x, y });
  }

  function step() {
    if (dirQueue.length) dir = dirQueue.shift();
    prevSnake = snake.map(s => ({ ...s }));
    const head = snake[0];
    const nx = head.x + dir.x, ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(); return; }

    let grow = false;
    if (food && nx === food.x && ny === food.y) {
      grow = true;
      score += 10;
      foodsEaten++;
      burst(food.x, food.y, COLORS.yellow, 26, 3.5);
      blip(660 + Math.min(foodsEaten * 20, 600), 0.09, 'square', 0.05, 300);
      shake = Math.max(shake, 4);
      stepTime = Math.max(55, 110 - foodsEaten * 2);
      food = null;
      food = spawnFree();
      if (!bonus && foodsEaten % 5 === 0) {
        const p = spawnFree();
        if (p) bonus = { ...p, life: 7000 };
      }
    }
    if (bonus && nx === bonus.x && ny === bonus.y) {
      grow = true;
      score += 50;
      burst(bonus.x, bonus.y, COLORS.magenta, 50, 5);
      blip(990, 0.25, 'triangle', 0.07, 900);
      shake = Math.max(shake, 8);
      flash = 0.35;
      bonus = null;
    }

    // self-collision (tail moves away unless growing)
    const checkLen = grow ? snake.length : snake.length - 1;
    for (let i = 0; i < checkLen; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { gameOver(); return; }
    }

    snake.unshift({ x: nx, y: ny });
    if (!grow) snake.pop();
    else prevSnake.push({ ...prevSnake[prevSnake.length - 1] });
    updateScore();
  }

  // ---------- Particles ----------
  function burst(gx, gy, color, count, speed) {
    const cx = gx + 0.5, cy = gy + 0.5;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (0.3 + Math.random()) * speed;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: 0.012 + Math.random() * 0.025,
        size: 0.08 + Math.random() * 0.14,
        color
      });
    }
  }
  function updateParticles(dt) {
    const f = dt / 16.67;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 0.06 * f;
      p.y += p.vy * 0.06 * f;
      p.vx *= Math.pow(0.94, f);
      p.vy *= Math.pow(0.94, f);
      p.life -= p.decay * f;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- Rendering ----------
  function drawBackground() {
    // deep gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#07001a');
    g.addColorStop(0.6, '#0b0022');
    g.addColorStop(1, '#1a0030');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // perspective synth floor below the board
    ctx.save();
    const horizon = H * 0.62;
    ctx.strokeStyle = 'rgba(255,43,214,0.18)';
    ctx.lineWidth = 1;
    const off = (time * 0.04) % 40;
    for (let i = 0; i < 18; i++) {
      const t = (i * 40 + off) / (18 * 40);
      const y = horizon + Math.pow(t, 2.2) * (H - horizon);
      ctx.globalAlpha = Math.min(1, t * 2);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const vx = W / 2;
    for (let i = -20; i <= 20; i++) {
      ctx.beginPath();
      ctx.moveTo(vx + i * 10, horizon);
      ctx.lineTo(vx + i * W * 0.12, H);
      ctx.stroke();
    }
    ctx.restore();

    // sun glow
    const sg = ctx.createRadialGradient(W / 2, horizon, 0, W / 2, horizon, Math.max(W, H) * 0.5);
    sg.addColorStop(0, 'rgba(255,43,214,0.18)');
    sg.addColorStop(1, 'rgba(255,43,214,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBoard() {
    // board panel
    ctx.save();
    ctx.fillStyle = 'rgba(3,0,12,0.82)';
    ctx.fillRect(boardX, boardY, boardW, boardH);

    // grid
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) {
      const px = boardX + x * cell + 0.5;
      ctx.moveTo(px, boardY); ctx.lineTo(px, boardY + boardH);
    }
    for (let y = 1; y < ROWS; y++) {
      const py = boardY + y * cell + 0.5;
      ctx.moveTo(boardX, py); ctx.lineTo(boardX + boardW, py);
    }
    ctx.stroke();

    // grid intersection dots
    ctx.fillStyle = 'rgba(0,246,255,0.25)';
    for (let x = 0; x <= COLS; x += 2) for (let y = 0; y <= ROWS; y += 2) {
      ctx.fillRect(boardX + x * cell - 1, boardY + y * cell - 1, 2, 2);
    }

    // neon border
    const pulse = 0.6 + 0.4 * Math.sin(time * 0.003);
    ctx.shadowBlur = 18;
    ctx.shadowColor = COLORS.cyan;
    ctx.strokeStyle = `rgba(0,246,255,${0.55 + 0.35 * pulse})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(boardX - 1, boardY - 1, boardW + 2, boardH + 2);

    // corner brackets
    ctx.strokeStyle = COLORS.magenta;
    ctx.shadowColor = COLORS.magenta;
    ctx.lineWidth = 3;
    const L = Math.max(14, cell * 1.2), o = 7;
    const corners = [
      [boardX - o, boardY - o, 1, 1],
      [boardX + boardW + o, boardY - o, -1, 1],
      [boardX - o, boardY + boardH + o, 1, -1],
      [boardX + boardW + o, boardY + boardH + o, -1, -1]
    ];
    for (const [cx, cy, sx, sy] of corners) {
      ctx.beginPath();
      ctx.moveTo(cx, cy + sy * L);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx + sx * L, cy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawSnake(alpha) {
    if (!snake.length) return;
    const n = snake.length;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const cur = snake[i];
      const prev = prevSnake[i] || cur;
      const t = state === STATE.PLAY ? alpha : 1;
      pts.push({
        x: boardX + (lerp(prev.x, cur.x, t) + 0.5) * cell,
        y: boardY + (lerp(prev.y, cur.y, t) + 0.5) * cell
      });
    }

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // outer glow body
    ctx.shadowBlur = cell * 1.1;
    ctx.shadowColor = COLORS.cyan;
    for (let i = n - 1; i > 0; i--) {
      const k = i / n;
      const w = cell * (0.72 - k * 0.32);
      ctx.strokeStyle = mixColor(k);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i - 1].x, pts[i - 1].y);
      ctx.stroke();
    }

    // inner hot core
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = Math.max(1.5, cell * 0.14);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // head
    const h = pts[0];
    ctx.shadowBlur = cell * 1.5;
    ctx.shadowColor = COLORS.cyan;
    ctx.fillStyle = '#c9feff';
    ctx.beginPath();
    ctx.arc(h.x, h.y, cell * 0.42, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.shadowBlur = 8;
    ctx.shadowColor = COLORS.magenta;
    ctx.fillStyle = COLORS.magenta;
    const ex = dir.y !== 0 ? 1 : 0, ey = dir.x !== 0 ? 1 : 0;
    const fwd = cell * 0.15;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(h.x + ex * s * cell * 0.18 + dir.x * fwd, h.y + ey * s * cell * 0.18 + dir.y * fwd, cell * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function mixColor(k) {
    // cyan -> purple -> magenta along body
    const c1 = [0, 246, 255], c2 = [138, 43, 255], c3 = [255, 43, 214];
    let a, b, t;
    if (k < 0.5) { a = c1; b = c2; t = k / 0.5; } else { a = c2; b = c3; t = (k - 0.5) / 0.5; }
    const r = Math.round(lerp(a[0], b[0], t));
    const g = Math.round(lerp(a[1], b[1], t));
    const bl = Math.round(lerp(a[2], b[2], t));
    return `rgb(${r},${g},${bl})`;
  }

  function drawFood() {
    if (food) {
      const x = boardX + (food.x + 0.5) * cell;
      const y = boardY + (food.y + 0.5) * cell;
      const p = 1 + 0.15 * Math.sin(time * 0.008);
      const r = cell * 0.3 * p;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(time * 0.002);
      ctx.shadowBlur = cell * 1.4;
      ctx.shadowColor = COLORS.yellow;
      ctx.fillStyle = COLORS.yellow;
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,242,0,0.5)';
      ctx.lineWidth = 1.5;
      ctx.rotate(-time * 0.004);
      ctx.strokeRect(-r * 1.5, -r * 1.5, r * 3, r * 3);
      ctx.restore();
    }
    if (bonus) {
      const x = boardX + (bonus.x + 0.5) * cell;
      const y = boardY + (bonus.y + 0.5) * cell;
      const lifeK = Math.max(0, bonus.life / 7000);
      const blink = lifeK < 0.3 ? (Math.sin(time * 0.03) > 0 ? 1 : 0.25) : 1;
      ctx.save();
      ctx.globalAlpha = blink;
      ctx.translate(x, y);
      ctx.shadowBlur = cell * 1.6;
      ctx.shadowColor = COLORS.magenta;
      ctx.strokeStyle = COLORS.magenta;
      ctx.fillStyle = 'rgba(255,43,214,0.35)';
      ctx.lineWidth = 2;
      const r = cell * 0.42;
      ctx.rotate(time * 0.003);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // timer ring
      ctx.rotate(-time * 0.003);
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.45, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lifeK);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      const s = p.size * cell;
      ctx.fillRect(boardX + p.x * cell - s / 2, boardY + p.y * cell - s / 2, s, s);
    }
    ctx.restore();
  }

  function drawMenuDemo() {
    // idle animated snake orbit for the menu backdrop
    const n = 22;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = time * 0.0012 - i * 0.12;
      pts.push({
        x: boardX + boardW / 2 + Math.cos(t) * boardW * 0.32 + Math.sin(t * 2.1) * boardW * 0.05,
        y: boardY + boardH / 2 + Math.sin(t * 1.3) * boardH * 0.3
      });
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowBlur = cell;
    ctx.shadowColor = COLORS.cyan;
    for (let i = n - 1; i > 0; i--) {
      const k = i / n;
      ctx.strokeStyle = mixColor(k);
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = cell * (0.6 - k * 0.3);
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i - 1].x, pts[i - 1].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = now - last;
    last = now;
    if (dt > 100) dt = 100;
    time += dt;

    if (state === STATE.PLAY) {
      acc += dt;
      while (acc >= stepTime && state === STATE.PLAY) {
        acc -= stepTime;
        step();
      }
      if (bonus) {
        bonus.life -= dt;
        if (bonus.life <= 0) bonus = null;
      }
    }
    updateParticles(dt);

    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
    } else shake = 0;

    drawBackground();
    drawBoard();
    if (state === STATE.MENU) drawMenuDemo();
    else {
      drawFood();
      drawSnake(state === STATE.PLAY ? Math.min(1, acc / stepTime) : 1);
    }
    drawParticles();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,43,214,${flash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
      flash = Math.max(0, flash - dt * 0.002);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Input ----------
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
    if (state === STATE.MENU || state === STATE.OVER) {
      if (k === 'Enter' || k === ' ') {
        if (state === STATE.OVER && overOverlay.classList.contains('hidden')) return;
        startGame();
      }
      return;
    }
    if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
    if (state !== STATE.PLAY) return;
    switch (k) {
      case 'ArrowUp': case 'w': case 'W': queueDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': queueDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': queueDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': queueDir(1, 0); break;
    }
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  let touchStart = null;
  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!touchStart || state !== STATE.PLAY) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
    else queueDir(0, dy > 0 ? 1 : -1);
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  window.addEventListener('touchend', () => { touchStart = null; });

  window.addEventListener('blur', () => { if (state === STATE.PLAY) togglePause(); });
})();
</script>
</body>
</html>
