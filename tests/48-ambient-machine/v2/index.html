<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ambient Machine</title>
<style>
:root{
  --hue:200; --sat:70%; --accent:hsl(var(--hue) var(--sat) 66%);
  --accent-dim:hsl(var(--hue) var(--sat) 40% / .35);
  --bg:#05060a; --panel:rgba(14,16,24,.58); --line:rgba(255,255,255,.09); --text:#e8ecf4; --muted:#8a93a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
canvas#viz{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:18px;left:22px;z-index:3;pointer-events:none}
header h1{font-size:15px;letter-spacing:.32em;text-transform:uppercase;font-weight:600}
header p{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
#info{position:fixed;top:18px;right:22px;z-index:3;text-align:right;font-size:12px;color:var(--muted);line-height:1.6;
  font-variant-numeric:tabular-nums;pointer-events:none}
#info b{color:var(--text);font-weight:600}
#overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none;transition:opacity .9s ease}
#overlay.hidden{opacity:0}
#overlay.hidden #bigStart{pointer-events:none;transform:scale(.85)}
#bigStart{pointer-events:auto;-webkit-tap-highlight-color:transparent;width:190px;height:190px;border-radius:50%;border:1px solid var(--accent);
  background:radial-gradient(circle at 50% 40%,hsl(var(--hue) var(--sat) 30% / .55),rgba(8,10,16,.75) 70%);
  color:var(--text);font:inherit;font-size:26px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 60px var(--accent-dim),inset 0 0 40px hsl(var(--hue) var(--sat) 50% / .2);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .4s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bigStart:hover{transform:scale(1.05);box-shadow:0 0 90px var(--accent-dim),inset 0 0 50px hsl(var(--hue) var(--sat) 50% / .3)}
#bigStart small{display:block;font-size:10px;letter-spacing:.3em;color:var(--muted);margin-top:8px;font-weight:500}
#panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;width:min(1000px,calc(100% - 24px));
  display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:12px 22px;align-items:center;
  background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:18px;padding:14px 18px}
#toggle{width:92px;height:40px;border-radius:12px;border:1px solid var(--accent);background:hsl(var(--hue) var(--sat) 40% / .18);
  color:var(--text);font:inherit;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
#toggle:hover{background:hsl(var(--hue) var(--sat) 45% / .3)}
.ctl label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ctl label span{color:var(--text);letter-spacing:.04em;text-transform:none;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.12))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.12))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-6px;background:#fff;box-shadow:0 0 12px var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:none;background:#fff;box-shadow:0 0 12px var(--accent)}
.seq-wrap{grid-column:1 / -1}
.seq-head{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.seq-head span:last-child{text-transform:none;letter-spacing:.04em}
#seq{display:grid;grid-template-columns:repeat(16,1fr);gap:5px}
.cell{position:relative;height:34px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);overflow:hidden;transition:background .25s,border-color .25s}
.cell:nth-child(4n+1){border-color:rgba(255,255,255,.12)}
.cell i{position:absolute;left:3px;right:3px;bottom:3px;border-radius:3px;background:var(--accent);opacity:.75;transition:height .4s,opacity .3s}
.cell.off i{opacity:0}
.cell.oct i{box-shadow:0 0 8px var(--accent)}
.cell.now{background:hsl(var(--hue) var(--sat) 60% / .25);border-color:var(--accent)}
.cell.mut{animation:mut 1.2s ease-out}
@keyframes mut{0%{background:rgba(255,255,255,.55)}100%{background:rgba(255,255,255,.04)}}
@media (max-width:760px){
  #panel{grid-template-columns:auto 1fr;gap:10px 16px;padding:12px 14px;bottom:10px}
  #panel .ctl.vol{grid-column:2}
  #seq{grid-template-columns:repeat(8,1fr)}
  .cell{height:26px}
  header{top:14px;left:16px}
  #info{top:58px;left:16px;right:auto;text-align:left;line-height:1.5}
  #bigStart{width:160px;height:160px;font-size:22px}
}
</style>
</head>
<body>
<canvas id="viz"></canvas>
<header><h1>Ambient Machine</h1><p>generative modal music · Web Audio</p></header>
<div id="info"><div>Key <b id="iKey">—</b></div><div>Chord <b id="iNum">#0</b> · Bar <b id="iBar">0</b></div></div>
<div id="overlay"><button id="bigStart" aria-label="Start">Start<small>tap to begin</small></button></div>
<div id="panel">
  <button id="toggle">Start</button>
  <div class="ctl"><label>Mood <span id="moodVal">Drift</span></label><input type="range" id="mood" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="ctl"><label>Tempo <span id="bpmVal">72 BPM</span></label><input type="range" id="tempo" min="48" max="120" step="1" value="72"></div>
  <div class="ctl vol"><label>Volume <span id="volVal">70%</span></label><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></div>
  <div class="seq-wrap">
    <div class="seq-head"><span>16-step sequencer</span><span id="mutInfo">mutates every 8 bars</span></div>
    <div id="seq"></div>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function weighted(items, weights) {
  let s = 0; for (const w of weights) s += w;
  let r = Math.random() * s;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

/* ---------------- music theory ---------------- */
const NOTE = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const MODES = {
  phrygian:   [0, 1, 3, 5, 7, 8, 10],
  aeolian:    [0, 2, 3, 5, 7, 8, 10],
  dorian:     [0, 2, 3, 5, 7, 9, 10],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  ionian:     [0, 2, 4, 5, 7, 9, 11],
  lydian:     [0, 2, 4, 6, 7, 9, 11],
};
const MODE_ORDER = ['phrygian', 'aeolian', 'dorian', 'mixolydian', 'ionian', 'lydian']; // dark → bright
const MOOD_NAMES = ['Nocturne', 'Mist', 'Drift', 'Dawn', 'Radiant'];
const SUFFIX = {
  '4,7,11': 'maj7', '4,7,10': '7', '3,7,10': 'm7', '3,6,10': 'm7♭5', '3,7,11': 'm(maj7)',
  '4,8,11': 'maj7♯5', '3,6,9': '°7', '4,6,10': '7♭5', '4,6,11': 'maj7♭5'
};
const PERMS4 = (() => {
  const out = [];
  const rec = (a, rest) => { if (!rest.length) { out.push(a); return; } rest.forEach((x, i) => rec([...a, x], rest.filter((_, j) => j !== i))); };
  rec([], [0, 1, 2, 3]); return out;
})();

function buildChord(tonic, mode, degree, use9) {
  const sc = MODES[mode];
  const tone = i => { const k = degree + i; return sc[k % 7] + 12 * Math.floor(k / 7); };
  const r = tone(0);
  const iv = [0, tone(2) - r, tone(4) - r, tone(6) - r, tone(8) - r];
  const rootPc = (tonic + r) % 12;
  let suf = SUFFIX[iv[1] + ',' + iv[2] + ',' + iv[3]] || '';
  if (use9) {
    if (iv[4] === 14 && /7/.test(suf) && suf !== '°7') suf = suf.replace('7', '9');
    else if (iv[4] === 13) suf += '(♭9)';
  }
  return {
    tonic, mode, degree, use9, rootPc, iv,
    name: NOTE[rootPc] + suf,
    minor: iv[1] === 3, dim: iv[2] === 6,
    pcs: iv.slice(0, use9 ? 5 : 4).map(x => (rootPc + x) % 12),
  };
}

function voiceLead(prev, pcs) {
  let best = null, bestCost = Infinity;
  for (const perm of PERMS4) {
    const v = []; let cost = 0;
    for (let i = 0; i < 4; i++) {
      const pc = pcs[perm[i]], target = prev[i];
      let d = ((pc - target) % 12 + 12) % 12; if (d > 6) d -= 12;
      let m = target + d;
      while (m < 50) m += 12; while (m > 79) m -= 12;
      v.push(m); cost += Math.abs(m - target);
    }
    const s = [...v].sort((a, b) => a - b);
    for (let i = 0; i < 3; i++) if (s[i + 1] - s[i] < 2) cost += 5;
    const mean = s.reduce((a, b) => a + b, 0) / 4;
    cost += Math.abs(mean - 64) * 0.25;
    if (cost < bestCost) { bestCost = cost; best = v; }
  }
  return best;
}

/* ---------------- state ---------------- */
const S = {
  bpm: 72, mood: 0.5, vol: 0.7,
  playing: false, step: 0, bar: 0, nextTime: 0, chordBarsLeft: 0,
  tonic: 2, mode: 'dorian', degree: 0, history: [], chordCount: 0,
  chord: null, voicing: [57, 62, 65, 69], pattern: [], moodDirty: false,
  fmRatio: 1, padPan: 0,
};
S.chord = buildChord(S.tonic, S.mode, 0, true);

function newPattern() {
  const p = []; let idx = randInt(0, 3);
  for (let i = 0; i < 16; i++) {
    idx = clamp(idx + pick([-2, -1, -1, 0, 1, 1, 2]), 0, 5);
    p.push({
      on: Math.random() < (i % 4 === 0 ? 0.75 : i % 2 === 0 ? 0.45 : 0.3),
      idx, oct: Math.random() < 0.2 ? 1 : 0, vel: rand(0.55, 1), pan: rand(-0.6, 0.6),
    });
  }
  return p;
}
S.pattern = newPattern();

function mutatePattern() {
  const changed = new Set();
  const n = randInt(2, 5);
  for (let k = 0; k < n; k++) {
    const op = Math.random(), i = randInt(0, 15), c = S.pattern[i];
    if (op < 0.35) { c.on = !c.on; changed.add(i); }
    else if (op < 0.65) { c.idx = clamp(c.idx + pick([-2, -1, 1, 2]), 0, 5); c.on = true; changed.add(i); }
    else if (op < 0.8) { c.oct = 1 - c.oct; changed.add(i); }
    else if (op < 0.92) { const j = randInt(0, 15); const t = S.pattern[i]; S.pattern[i] = S.pattern[j]; S.pattern[j] = t; changed.add(i); changed.add(j); }
    else { const r = randInt(1, 3); S.pattern = S.pattern.slice(r).concat(S.pattern.slice(0, r)); for (let q = 0; q < 16; q++) changed.add(q); }
  }
  // keep density sane, nudged by mood
  const lo = 4 + Math.round(S.mood * 2), hi = 9 + Math.round(S.mood * 3);
  let on = S.pattern.filter(c => c.on).length;
  while (on < lo) { const i = randInt(0, 15); if (!S.pattern[i].on) { S.pattern[i].on = true; changed.add(i); on++; } }
  while (on > hi) { const i = randInt(0, 15); if (S.pattern[i].on && i % 4 !== 0) { S.pattern[i].on = false; changed.add(i); on--; } }
  return [...changed];
}

function moodModeIndex() { return clamp(Math.round(S.mood * 5 + (Math.random() + Math.random() - 1) * 1.3), 0, 5); }

function modulate() {
  const r = Math.random();
  if (r < 0.45 || S.moodDirty) {
    S.mode = MODE_ORDER[moodModeIndex()];            // modal interchange
  } else if (r < 0.8) {
    S.tonic = (S.tonic + (Math.random() < 0.5 ? 7 : 5)) % 12;   // up/down a fifth
    if (Math.random() < 0.5) S.mode = MODE_ORDER[moodModeIndex()];
  } else {
    S.tonic = (S.tonic + pick([2, 10, 3, 9, 4, 8])) % 12;     // chromatic-mediant colour shift
  }
  S.moodDirty = false;
  S.history = [];
}

function nextChord() {
  if (S.chordCount > 0 && (Math.random() < 0.16 || S.moodDirty)) modulate();
  const IW = [0.05, 1.1, 0.9, 1.6, 1.4, 1.0, 1.15]; // interval weights (in scale steps)
  const degs = [0, 1, 2, 3, 4, 5, 6], w = [];
  for (const d of degs) {
    let x = IW[(d - S.degree + 7) % 7];
    const c = buildChord(S.tonic, S.mode, d, false);
    if (c.dim) x *= 0.12;
    if (S.history.includes(d)) x *= 0.3;
    if (d === 0 && S.history.length > 4) x *= 2;
    w.push(x);
  }
  const d = weighted(degs, w);
  S.history.push(d); if (S.history.length > 3) S.history.shift();
  S.degree = d;
  S.chordCount++;
  const ch = buildChord(S.tonic, S.mode, d, Math.random() < 0.55);
  // arp set: chord tones around middle C
  let base = 60 + ch.rootPc; if (base > 66) base -= 12;
  const set = ch.iv.slice(0, ch.use9 ? 5 : 4).map(x => base + x);
  set.push(base + 12);
  ch.arpSet = set;
  const padPcs = ch.use9 ? [ch.pcs[1], ch.pcs[2], ch.pcs[3], ch.pcs[4]] : ch.pcs.slice(0, 4);
  S.voicing = voiceLead(S.voicing, padPcs);
  ch.voicing = S.voicing.slice();
  let bass = 36 + ch.rootPc; if (bass > 44) bass -= 12;
  ch.bass = bass;
  ch.modeIndex = MODE_ORDER.indexOf(S.mode);
  ch.n = S.chordCount;
  S.chord = ch;
  return ch;
}

/* ---------------- audio engine ---------------- */
let ctx = null, A = {};
const ksCache = new Map();

function makeImpulse(sec, decay) {
  const sr = ctx.sampleRate, len = Math.floor(sr * sec), pre = Math.floor(sr * 0.025);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) {
      if (i < pre) { d[i] = 0; continue; }
      const t = (i - pre) / (len - pre);
      const env = Math.pow(1 - t, decay);
      const c = 0.85 - 0.72 * t;           // darker tail as it decays
      lp += c * ((Math.random() * 2 - 1) - lp);
      d[i] = lp * env;
    }
    // a few sparse early reflections
    for (let k = 0; k < 14; k++) {
      const i = pre + Math.floor(rand(0.002, 0.09) * sr);
      d[i] += rand(-0.7, 0.7) * (1 - k / 14);
    }
  }
  return buf;
}
function satCurve(k) {
  const n = 2048, c = new Float32Array(n), norm = Math.tanh(k);
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / norm; }
  return c;
}
function lfo(freq, depth, target, type = 'sine') {
  const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = ctx.createGain(); g.gain.value = depth;
  o.connect(g).connect(target); o.start();
  return { o, g };
}

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3; comp.attack.value = 0.03; comp.release.value = 0.35;
  const analyser = ctx.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.8;
  analyser.minDecibels = -92; analyser.maxDecibels = -24;
  master.connect(comp); comp.connect(ctx.destination); comp.connect(analyser);

  // reverb (generated noise impulse)
  const revIn = ctx.createGain();
  const revHP = ctx.createBiquadFilter(); revHP.type = 'highpass'; revHP.frequency.value = 160;
  const reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(6, 2.8);
  const revOut = ctx.createGain(); revOut.gain.value = 0.85;
  revIn.connect(revHP).connect(reverb).connect(revOut).connect(master);

  // tape delay: delay → lowpass → highpass → saturation → feedback, with wow & flutter
  const dIn = ctx.createGain();
  const delay = ctx.createDelay(4); delay.delayTime.value = 0.75 * 60 / S.bpm;
  const tlp = ctx.createBiquadFilter(); tlp.type = 'lowpass'; tlp.frequency.value = 2600; tlp.Q.value = 0.5;
  const thp = ctx.createBiquadFilter(); thp.type = 'highpass'; thp.frequency.value = 240;
  const sat = ctx.createWaveShaper(); sat.curve = satCurve(1.8); sat.oversample = '2x';
  const fb = ctx.createGain(); fb.gain.value = 0.5;
  const dOut = ctx.createGain(); dOut.gain.value = 0.6;
  const dPan = ctx.createStereoPanner();
  dIn.connect(delay); delay.connect(tlp); tlp.connect(thp); thp.connect(sat); sat.connect(fb); fb.connect(delay);
  sat.connect(dOut); dOut.connect(dPan); dPan.connect(master);
  const dRev = ctx.createGain(); dRev.gain.value = 0.35; dOut.connect(dRev).connect(revIn);
  lfo(0.31, 0.0035, delay.delayTime);           // wow
  lfo(5.7, 0.00045, delay.delayTime);           // flutter
  lfo(0.09, 0.65, dPan.pan);                    // drifting stereo image

  // pad bus
  const padBus = ctx.createGain(); padBus.gain.value = 1;
  const padFilter = ctx.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.Q.value = 0.8; padFilter.frequency.value = 1400;
  lfo(0.045, 450, padFilter.frequency);
  const padOut = ctx.createGain(); padOut.gain.value = 0.55;
  padBus.connect(padFilter).connect(padOut).connect(master);
  const padRev = ctx.createGain(); padRev.gain.value = 0.85; padOut.connect(padRev).connect(revIn);
  const padDel = ctx.createGain(); padDel.gain.value = 0.15; padOut.connect(padDel).connect(dIn);

  // arp bus
  const arpBus = ctx.createGain(); arpBus.gain.value = 0.5;
  arpBus.connect(master);
  const arpRev = ctx.createGain(); arpRev.gain.value = 0.55; arpBus.connect(arpRev).connect(revIn);
  const arpDel = ctx.createGain(); arpDel.gain.value = 0.6; arpBus.connect(arpDel).connect(dIn);

  // bass bus
  const bassBus = ctx.createGain(); bassBus.gain.value = 0.32;
  const bassLP = ctx.createBiquadFilter(); bassLP.type = 'lowpass'; bassLP.frequency.value = 500;
  bassBus.connect(bassLP).connect(master);
  const bassRev = ctx.createGain(); bassRev.gain.value = 0.18; bassLP.connect(bassRev).connect(revIn);

  A = { master, comp, analyser, delay, fb, padFilter, padBus, arpBus, bassBus, tlp };
  applyMood(true);
  vizInitBins();
}

function applyMood(immediate) {
  if (!ctx) return;
  const t = ctx.currentTime, tc = immediate ? 0.01 : 1.5;
  A.padFilter.frequency.setTargetAtTime(500 + S.mood * 2300, t, tc);
  A.tlp.frequency.setTargetAtTime(1600 + S.mood * 2600, t, tc);
  A.fb.gain.setTargetAtTime(0.42 + (1 - S.mood) * 0.16, t, tc);
}
function applyTempo() {
  if (!ctx) return;
  A.delay.delayTime.setTargetAtTime(0.75 * 60 / S.bpm, ctx.currentTime, 0.4);
}

function ksBuffer(midi) {
  if (ksCache.has(midi)) return ksCache.get(midi);
  const sr = ctx.sampleRate, f = mtof(midi);
  const N = Math.max(2, Math.floor(sr / f)), len = Math.floor(sr * 2.4);
  const buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  let lp = 0;
  for (let i = 0; i < N; i++) { lp += 0.6 * ((Math.random() * 2 - 1) - lp); d[i] = lp; }
  const decay = 0.9975;
  for (let i = N; i < len; i++) d[i] = decay * 0.5 * (d[i - N] + (i - N - 1 >= 0 ? d[i - N - 1] : 0));
  let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(d[i]));
  if (peak > 0) for (let i = 0; i < len; i++) d[i] /= peak;
  const entry = { buf, rate: f / (sr / (N + 0.5)) };
  ksCache.set(midi, entry);
  return entry;
}

function pluck(midi, t, vel, pan) {
  const { buf, rate } = ksBuffer(midi);
  const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2200 + S.mood * 4200, t); lp.frequency.exponentialRampToValueAtTime(900 + S.mood * 900, t + 1.2);
  const g = ctx.createGain(); g.gain.setValueAtTime(vel, t); g.gain.setTargetAtTime(0, t + 0.5, 0.45);
  const p = ctx.createStereoPanner(); p.pan.value = pan;

  cg.addColorStop(1, `hsla(${h},${s}%,${l - 40}%,0)`);
  g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, wr * 0.95, 0, Math.PI * 2); g.fill();

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = `hsla(${h},30%,95%,0.96)`;
  g.font = `600 ${Math.round(R * 0.3)}px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  g.fillText(ctx ? display.name : 'Ambient', cx, cy - R * 0.06);
  g.fillStyle = `hsla(${h},40%,82%,0.65)`;
  g.font = `500 ${Math.max(9, Math.round(R * 0.09))}px ui-sans-serif,system-ui,sans-serif`;
  g.fillText((ctx ? display.key : 'press start').toUpperCase(), cx, cy + R * 0.22);
}
requestAnimationFrame(frame);
})();
</script>
