<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tux Desktop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
:root{--accent:#e95420;--tb-h:48px;--radius:10px;--mono:"Ubuntu Mono","DejaVu Sans Mono","JetBrains Mono",Menlo,Consolas,monospace}
body{font:13px/1.4 "Ubuntu","Cantarell","Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--fg);background:#000;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
body[data-theme=dark]{--fg:#f2f2f2;--muted:#a3a3a8;--win:#242428;--win2:#2d2d32;--title:#1d1d21;--border:rgba(255,255,255,.09);--hover:rgba(255,255,255,.08);--input:#1a1a1d;--panel:rgba(20,20,24,.78);--shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.7);--shadow2:0 8px 24px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.6);--term:#17171c}
body[data-theme=light]{--fg:#1e1e22;--muted:#68686e;--win:#fbfbfc;--win2:#efeff2;--title:#e9e9ec;--border:rgba(0,0,0,.12);--hover:rgba(0,0,0,.06);--input:#fff;--panel:rgba(246,246,250,.82);--shadow:0 24px 60px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.14);--shadow2:0 8px 24px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.12);--term:#2c0b24}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
body.dragging,body.dragging *{user-select:none!important;cursor:inherit}
svg{display:block}
.si{width:18px;height:18px;flex:none}

/* desktop */
#desktop{position:absolute;left:0;top:0;right:0;bottom:var(--tb-h);overflow:hidden;z-index:0;background-size:cover;background-position:center;transition:background .4s}
#icons{position:absolute;inset:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);grid-auto-columns:92px;gap:4px;align-content:start;justify-content:start}
.dicon{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 4px;border-radius:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);text-align:center;font-size:12px;cursor:default;border:1px solid transparent;height:92px}
.dicon svg,.dicon img{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));object-fit:cover;border-radius:4px}
.dicon:hover{background:rgba(255,255,255,.12)}
.dicon.sel{background:color-mix(in srgb,var(--accent) 40%,transparent);border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.dicon span{max-width:86px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
#windows{position:absolute;inset:0;pointer-events:none}

/* windows */
.win{position:absolute;pointer-events:auto;transition:opacity .16s ease,transform .16s ease;will-change:transform}
.win .frame{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--win);color:var(--fg);box-shadow:var(--shadow2)}
.win.active .frame{box-shadow:var(--shadow)}
.win.opening,.win.closing{opacity:0;transform:scale(.94)}
.win.closing{pointer-events:none}
.win.min{opacity:0;transform:translateY(80px) scale(.8);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.win.max .frame{border-radius:0}
.win.anim{transition:left .2s ease,top .2s ease,width .2s ease,height .2s ease,opacity .16s,transform .16s}
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;background:var(--title);border-bottom:1px solid var(--border);touch-action:none;cursor:default}
.titlebar .ticon svg{width:18px;height:18px}
.ttitle{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;opacity:.92}
.win:not(.active) .ttitle,.win:not(.active) .ticon{opacity:.5}
.tbtns{display:flex;gap:8px}
.tbtns button{width:24px;height:24px;border-radius:50%;border:0;background:var(--hover);display:grid;place-items:center;padding:0;cursor:pointer;transition:background .12s}
.tbtns button:hover{background:rgba(127,127,127,.32)}
.tbtns .b-close:hover{background:#e01b24;color:#fff}
.tbtns svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.6;fill:none}
.wbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:3;touch-action:none}
.rz.n{top:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rz.s{bottom:-4px;left:10px;right:10px;height:8px;cursor:ns-resize}
.rz.e{right:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rz.w{left:-4px;top:10px;bottom:10px;width:8px;cursor:ew-resize}
.rz.ne{right:-5px;top:-5px;width:15px;height:15px;cursor:nesw-resize}
.rz.sw{left:-5px;bottom:-5px;width:15px;height:15px;cursor:nesw-resize}
.rz.nw{left:-5px;top:-5px;width:15px;height:15px;cursor:nwse-resize}
.rz.se{right:-5px;bottom:-5px;width:15px;height:15px;cursor:nwse-resize}
.win.max .rz{display:none}

/* common controls */
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--win2);border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap}
.toolbar button,.btn{border:1px solid var(--border);background:var(--win);border-radius:6px;padding:4px 10px;cursor:pointer;min-height:28px;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.toolbar button:hover,.btn:hover{background:var(--hover)}
.toolbar button:disabled{opacity:.4;pointer-events:none}
.toolbar button.ib{padding:4px 6px;border-color:transparent;background:transparent}
.toolbar button.ib:hover{background:var(--hover)}
.toolbar button.on{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
.primary,.toolbar button.primary{background:var(--accent)!important;border-color:transparent!important;color:#fff!important}
.primary:hover{filter:brightness(1.1)}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.grow{flex:1}
.chk{display:inline-flex;align-items:center;gap:4px;padding:0 6px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.statusbar{flex:none;display:flex;justify-content:space-between;gap:12px;padding:3px 10px;font-size:11.5px;color:var(--muted);background:var(--win2);border-top:1px solid var(--border);white-space:nowrap;overflow:hidden}
.statusbar span{overflow:hidden;text-overflow:ellipsis}
.inp{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--input);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}

/* taskbar */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--panel);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--border);z-index:10;color:var(--fg)}
#startBtn{width:40px;height:38px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
#startBtn:hover,#startBtn.on{background:var(--hover)}
#startBtn svg{width:28px;height:28px}
#tasks{flex:1;display:flex;gap:4px;min-width:0;overflow:hidden;height:100%;align-items:center}
.task{display:flex;align-items:center;gap:8px;height:38px;max-width:200px;min-width:40px;flex:0 1 200px;padding:0 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;position:relative;overflow:hidden}
.task:hover{background:var(--hover)}
.task.active{background:var(--hover)}
.task::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--muted);transform:translateX(-50%);transition:width .2s,background .2s}
.task.active::after{width:22px;background:var(--accent)}
.task .ticon svg{width:22px;height:22px}
.task.minimized{opacity:.65}
.tlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
#tray{display:flex;align-items:center;gap:2px;height:100%;flex:none}
.trayi{display:flex;gap:8px;align-items:center;padding:0 10px;height:38px;border-radius:8px;opacity:.9}
#clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;height:38px;padding:0 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;line-height:1.15}
#clock:hover,#clock.on{background:var(--hover)}
#clock b{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
#clock small{font-size:11px;color:var(--muted)}
#showDesk{width:8px;height:100%;border:0;border-left:1px solid var(--border);background:transparent;cursor:pointer;margin-left:4px}
#showDesk:hover{background:var(--hover)}

/* popups */
.popup{position:absolute;bottom:calc(var(--tb-h) + 8px);background:var(--panel);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:20;color:var(--fg);transition:opacity .15s,transform .15s}
.popup.hide{opacity:0;transform:translateY(10px) scale(.98);pointer-events:none}
#menu{left:8px;width:min(440px,calc(100vw - 16px));padding:14px;transform-origin:bottom left}
.msearch{position:relative}
.msearch .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.msearch input{padding-left:34px}
#mapps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;margin:12px 0;max-height:50vh;overflow:auto}
.mapp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:12px;text-align:center}
.mapp:hover,.mapp.hl{background:var(--hover)}
.mapp svg,.mapp img{width:40px;height:40px;object-fit:cover;border-radius:4px}
.mapp span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);grid-column:1/-1;padding:4px 6px 0}
.mfoot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding-top:10px}
.muser{flex:1;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#77216f);display:grid;place-items:center;color:#fff;font-weight:700}
.muser small{display:block;color:var(--muted)}
.mfoot button{width:34px;height:34px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.mfoot button:hover{background:var(--hover)}
#cal{right:8px;width:280px;padding:14px;transform-origin:bottom right}
#cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#cal .ch b{font-size:14px}
#cal .ch button{border:0;background:transparent;width:28px;height:28px;border-radius:6px;cursor:pointer}
#cal .ch button:hover{background:var(--hover)}
#cal .big{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
#cal .sub{color:var(--muted);margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cg div{padding:6px 0;border-radius:50%}
.cg .dn{color:var(--muted);font-size:11px}
.cg .o{opacity:.35}
.cg .t{background:var(--accent);color:#fff;font-weight:700}
.ctx{position:fixed;z-index:40000;min-width:180px;padding:5px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);color:var(--fg)}
.ctx button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer}
.ctx button:hover{background:var(--accent);color:#fff}
.ctx button.danger:hover{background:#e01b24}
.ctx hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.modal-ov{position:fixed;inset:0;z-index:30000;background:rgba(0,0,0,.35);display:grid;place-items:center;animation:fade .15s}
.modal{width:min(400px,calc(100vw - 32px));background:var(--win);color:var(--fg);border-radius:14px;box-shadow:var(--shadow);padding:20px;animation:pop .18s ease}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 12px;color:var(--muted)}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#toasts{position:fixed;top:14px;right:14px;z-index:50000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--fg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow2);border-left:3px solid var(--accent);max-width:320px;animation:slidein .25s ease;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateX(20px)}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}}
#power{position:fixed;inset:0;background:#000;z-index:60000;display:grid;place-items:center;color:#888;font-family:var(--mono);opacity:0;transition:opacity .6s;pointer-events:none}
#power.on{opacity:1;pointer-events:auto;cursor:pointer}

/* terminal */
.wbody.term{display:block;overflow:auto;background:var(--term);color:#e6e6e6;font:14px/1.45 var(--mono);padding:8px 10px 14px;user-select:text;-webkit-user-select:text;cursor:text}
.tout>div{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
.tline{display:flex}
.tprompt{white-space:pre}
.tin{flex:1;min-width:20px;background:transparent;border:0;outline:0;font:inherit;color:inherit;padding:0;caret-color:#8ae234}
.pu{color:#8ae234;font-weight:700}.pd{color:#729fcf;font-weight:700}
.c-dir{color:#729fcf;font-weight:700}.c-exe{color:#8ae234;font-weight:700}.c-img{color:#ad7fa8;font-weight:700}
.terr{color:#ff6b6b}.tdim{color:#8a8a8a}.tacc{color:var(--accent);font-weight:700}
.nf{display:flex;gap:18px;flex-wrap:wrap}
.nf pre{margin:0;font:inherit;color:var(--accent)}
.nfk{color:var(--accent);font-weight:700}
.blk{display:inline-block;width:22px;height:14px;vertical-align:middle}

/* editor */
.edwrap{flex:1;display:flex;min-height:0;background:var(--input)}
.gutter{flex:none;width:48px;padding:10px 8px 10px 0;text-align:right;color:var(--muted);font:13px/20px var(--mono);overflow:hidden;white-space:pre;background:var(--win2);border-right:1px solid var(--border);opacity:.8}
.edwrap textarea{flex:1;min-width:0;border:0;outline:0;resize:none;padding:10px 12px;background:transparent;font:13px/20px var(--mono);tab-size:2;user-select:text}
.edwrap.wrapon .gutter{display:none}

/* files */
.fm{flex:1;display:flex;min-height:0}
.side{flex:none;width:172px;padding:8px;background:var(--win2);border-right:1px solid var(--border);overflow:auto;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;white-space:nowrap}
.side button:hover{background:var(--hover)}
.side button.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--fg)}
.side button.on .si{color:var(--accent)}
.grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));grid-auto-rows:min-content;gap:4px;align-content:start;outline:none}
.fitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:8px;border:1px solid transparent;text-align:center;cursor:default}
.fitem svg,.fitem img{width:52px;height:52px;object-fit:contain}
.fitem img{background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.3);width:48px;height:40px;margin:6px 0;object-fit:cover}
.fitem:hover{background:var(--hover)}
.fitem.sel{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.fname{font-size:12px;word-break:break-word;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;background:var(--input);border:1px solid var(--border);border-radius:6px;padding:2px 4px;margin:0 4px;height:30px}
.crumbs button{border:0!important;background:transparent!important;padding:2px 6px!important;min-height:22px!important;white-space:nowrap}
.crumbs button:hover{background:var(--hover)!important}
.crumbs button:last-child{font-weight:700}
.cs{opacity:.4}

/* settings */
.set{flex:1;display:flex;min-height:0}
.set .side{width:190px}
.spage{flex:1;overflow:auto;padding:20px 24px}
.spage h2{margin:0 0 16px;font-size:20px;font-weight:600}
.sect{background:var(--win2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sect h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.themes{display:flex;gap:14px;flex-wrap:wrap}
.tcard{border:2px solid transparent;background:transparent;border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.tcard.on{border-color:var(--accent)}
.tprev{width:130px;height:82px;border-radius:8px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tprev::before{content:"";position:absolute;left:14px;top:14px;right:14px;bottom:18px;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.tprev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px}
.tprev.light{background:linear-gradient(135deg,#89f7fe,#66a6ff)}.tprev.light::before{background:#fafafa}.tprev.light::after{background:#f0f0f0cc}
.tprev.dark{background:linear-gradient(135deg,#2c001e,#5e2750)}.tprev.dark::before{background:#2a2a2e}.tprev.dark::after{background:#111c}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--border)}
.sw.on{border-color:var(--fg)}
input[type=color]{width:36px;height:32px;border:1px solid var(--border);border-radius:8px;background:transparent;padding:2px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.row+.row{border-top:1px solid var(--border)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.wall{border:3px solid transparent;border-radius:10px;padding:0;cursor:pointer;overflow:hidden;background:transparent;text-align:left}
.wall div{height:76px;background-size:cover!important;background-position:center!important}
.wall span{display:block;padding:4px 8px;font-size:12px;background:var(--win)}
.wall.on{border-color:var(--accent)}
.about{display:flex;gap:20px;align-items:center}
.about svg{width:96px;height:96px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.kv b{color:var(--muted);font-weight:500}

/* paint */
.ptb{gap:6px}
.tgroup{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.pc{width:20px;height:20px;border-radius:50%;border:2px solid var(--win2)!important;padding:0!important;min-height:0!important;box-shadow:0 0 0 1px var(--border);cursor:pointer}
.pc.on{box-shadow:0 0 0 2px var(--accent)}
.psize{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.psize input{width:90px;accent-color:var(--accent)}
.psize span{min-width:18px}
.pcanvas{flex:1;min-height:0;overflow:hidden;position:relative;background:repeating-conic-gradient(#cfcfcf 0 25%,#e6e6e6 0 50%) 0 0/16px 16px}
.pcanvas canvas{position:absolute;left:0;top:0;cursor:crosshair;touch-action:none;background:#fff}

@media (max-width:700px){
  :root{--tb-h:54px}
  .task .tlabel{display:none}
  .task{flex:0 0 46px;justify-content:center;padding:0}
  .side{width:56px;padding:6px 4px}
  .side button span{display:none}
  .side button{justify-content:center;padding:10px 0}
  .set .side{width:56px}
  .spage{padding:14px}
  .trayi{display:none}
  #icons{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,84px);grid-template-rows:none;grid-auto-rows:96px}
}
</style>
</head>
<body data-theme="dark">
<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
</div>
<div id="taskbar">
  <button id="startBtn" title="Applications"></button>
  <div id="tasks"></div>
  <div id="tray">
    <div class="trayi" id="trayIcons"></div>
    <button id="clock" title="Calendar"><b id="clockT">--:--</b><small id="clockD"></small></button>
    <button id="showDesk" title="Show desktop"></button>
  </div>
</div>
<div id="menu" class="popup hide">

  const rem = (7 - (first + days) % 7) % 7; for (let i = 1; i <= rem; i++) cells += `<div class="o">${i}</div>`;
  calEl.innerHTML = `<div class="big">${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !S.clock24 })}</div><div class="sub">${t.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
    <div class="ch"><button data-m="-1">‹</button><b>${m.toLocaleDateString([], { month: 'long', year: 'numeric' })}</b><button data-m="1">›</button></div><div class="cg">${cells}</div>`;
}
function toggleCal(show = calEl.classList.contains('hide')) {
  calEl.classList.toggle('hide', !show); $('#clock').classList.toggle('on', show);
  if (show) { toggleMenu(false); calMonth = null; renderCal(); }
}
$('#clock').addEventListener('click', () => toggleCal());
calEl.addEventListener('click', e => { const t = e.target.closest('[data-m]'); if (!t) return; const n = new Date(); const m = calMonth || new Date(n.getFullYear(), n.getMonth(), 1); calMonth = new Date(m.getFullYear(), m.getMonth() + +t.dataset.m, 1); renderCal(); });

/* global keys */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); launch('terminal'); return; }
  if (e.key === 'Escape') { toggleMenu(false); toggleCal(false); closeCtx(); }
  if (activeWin && activeWin.onKey && !document.querySelector('.modal-ov')) activeWin.onKey(e);
});

/* persistence flush */
let resetting = false;
function flushAll() { if (resetting) return; clearTimeout(fsSaveT); LS.set('fs', FS); flushSession(); LS.set('settings', S); }
window.addEventListener('beforeunload', flushAll);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

/* ============================================================
   Boot
   ============================================================ */
ensureBin();
applySettings(false);
renderDesktop();
(function boot() {
  const sess = LS.get('session', null);
  if (Array.isArray(sess)) {
    restoring = true; let act = null;
    for (const s of sess) { try { const w = launch(s.app, s.args || {}, { rect: s.rect, max: s.max, min: s.min }); if (s.active) act = w; } catch (e) { console.error(e); } }
    restoring = false;
    if (act && !act.min && WINS.has(act.id)) focusWin(act);
    flushSession();
  } else {
    const L = layerSize();
    launch('files', { path: HOME + '/Documents' }, { rect: { x: Math.max(116, Math.round(L.w * 0.1)), y: Math.round(L.h * 0.07), w: Math.min(720, Math.round(L.w * 0.55)), h: Math.min(440, Math.round(L.h * 0.62)) } });
    launch('terminal', { run: 'neofetch' }, { rect: { x: Math.round(L.w * 0.4), y: Math.round(L.h * 0.27), w: Math.min(700, Math.round(L.w * 0.55)), h: Math.min(430, Math.round(L.h * 0.66)) } });
    LS.set('fs', FS);
    setTimeout(() => toast('Welcome to Tux Linux! Right-click the desktop or open the menu to get started.'), 600);
  }
})();
</script>
