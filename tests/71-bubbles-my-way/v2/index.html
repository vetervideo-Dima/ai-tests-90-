<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubbles — MY WAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: pointer; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    font: 500 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .38em; text-transform: uppercase;
    color: rgba(255,255,255,.38); pointer-events: none; user-select: none; transition: opacity .8s;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #hint.dim { opacity: .45; }
  @media (max-width: 600px) { #hint { font-size: 10px; letter-spacing: .3em; bottom: 20px; white-space: nowrap; } }
  #bar { position: fixed; left: 0; bottom: 0; height: 1px; width: 100%; background: rgba(255,255,255,.14);
    transform-origin: 0 50%; transform: scaleX(0); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../../vendor/three/build/three.module.js",
  "three/addons/": "../../../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">click to replay</div>
<div id="bar"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const LOOP = 12, CAMZ = 13, FOV = 32, WORD_W = 12;
const FONT = '"Archivo Black", "Arial Black", Impact, "Helvetica Neue", sans-serif';

// ---------- deterministic random ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, CAMZ);

const uniforms = {
  uTime: { value: 0 },
  uWordScale: { value: 1 },
  uSpread: { value: new THREE.Vector2(8, 4.5) },
  uCamZ: { value: CAMZ },
  uFocus: { value: CAMZ },
  uAperture: { value: 0.085 },
};

// ---------- shaders ----------
const COMMON = /* glsl */`
#define TAU 6.28318530718
vec3 thinFilm(float c, float th){
  float n = 1.33;
  float ct = sqrt(max(0.0, 1.0 - (1.0 - c*c)/(n*n)));
  float opd = 2.0*n*th*ct;
  vec3 a = 0.5 - 0.5*cos(TAU*opd/vec3(680.0, 550.0, 460.0));
  vec3 b = 0.5 - 0.5*cos(TAU*opd/vec3(620.0, 515.0, 425.0));
  return (a + b)*0.5;
}
vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0/3.0, 1.0/3.0))*6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}
`;

const bubbleVS = /* glsl */`
uniform float uTime; uniform float uWordScale; uniform vec2 uSpread; uniform float uCamZ;
uniform float uFocus; uniform float uAperture;
attribute vec3 aHome; attribute vec3 aTarget; attribute vec4 aRnd; attribute vec4 aTimes; attribute float aRadius;
varying vec2 vUv; varying float vBlur; varying float vEnergy; varying float vSeed; varying float vPop;
varying float vThin; varying float vChaos; varying float vWob; varying float vAlpha;
#define TAU 6.28318530718
#define WL (TAU/12.0)
vec3 drift(vec3 h, vec4 r, float t, float amp){
  float persp = (uCamZ - h.z)/uCamZ;
  vec3 b = vec3(h.xy*uSpread*persp, h.z);
  return b + amp*vec3(
    0.9*sin(WL*t + r.x*TAU) + 0.35*sin(2.0*WL*t + r.y*TAU),
    0.65*sin(WL*t + r.z*TAU) + 0.30*cos(3.0*WL*t + r.w*TAU),
    0.7*cos(WL*t + r.y*TAU) + 0.25*sin(2.0*WL*t + r.x*TAU));
}
void main(){
  float t = uTime;
  float mode = aTimes.w;
  vec3 D = drift(aHome, aRnd, t, mode < 0.5 ? 1.4 : (0.6 + 0.6*aRnd.w));
  vec3 pos = D;
  float vis = 1.0, pop = 0.0, thin = 0.0, chaos = 0.0, hold = 0.0;
  if (mode > 0.5){
    float d0 = aTimes.x, pt = aTimes.y, rt = aTimes.z;
    float gin = smoothstep(1.4 + d0, 4.6 + d0, t);
    hold = smoothstep(4.2 + d0, 5.6 + d0, t) * (1.0 - step(pt, t));
    vec3 T = aTarget*uWordScale;
    T.y += 0.07*uWordScale*sin(aTarget.x*0.9 - t*2.2)*hold;
    T += 0.035*uWordScale*vec3(sin(t*2.3 + aRnd.x*TAU), cos(t*1.9 + aRnd.y*TAU), sin(t*1.7 + aRnd.z*TAU))*hold;
    float g; vec3 kick = vec3(0.0);
    if (mode < 1.5){
      g = t < pt ? gin : 0.0;
      vis = t < pt ? 1.0 : smoothstep(rt, rt + 0.7, t);
      pop = (t >= pt && t < pt + 0.22) ? (t - pt)/0.22 : 0.0;
      thin = smoothstep(pt - 0.6, pt, t)*step(t, pt);
    } else {
      float s = smoothstep(pt, pt + 3.0, t);
      g = gin*(1.0 - s);
      vec3 dir = normalize(vec3(T.xy, 0.0)*0.35 + (aRnd.xyz - 0.5)*vec3(2.0, 2.0, 3.0));
      float k = clamp((t - pt)/3.3, 0.0, 1.0);
      kick = dir*2.2*sin(3.14159265*k);
      chaos = smoothstep(pt - 0.1, pt + 0.3, t)*(1.0 - smoothstep(pt + 1.8, pt + 3.4, t));
    }
    vec3 dl = T - D;
    vec3 sw = vec3(-dl.y, dl.x, dl.z*0.3)*0.45*sin(3.14159265*g)*(aRnd.w - 0.5)*2.0;
    pos = mix(D, T, g) + sw + kick;
  }
  if (vis < 0.002 && pop <= 0.0){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float rs = mode > 0.5 ? uWordScale : 1.0;
  float r = max(aRadius*rs*vis*(1.0 + 0.18*thin), 1e-4);
  vec4 mv = modelViewMatrix*vec4(pos, 1.0);
  float depth = -mv.z;
  float coc = min(uAperture*abs(depth - uFocus), 1.1);
  float grow = 1.0 + pop*1.8;
  float sr = (r*grow + coc)*1.12;
  mv.xy += position.xy*sr;
  gl_Position = projectionMatrix*mv;
  vUv = position.xy*sr/r;
  vBlur = coc/r;
  vEnergy = r*r/((r + coc)*(r + coc));
  vSeed = aRnd.x*0.61 + aRnd.y*0.39;
  vPop = pop; vThin = thin; vChaos = chaos;
  vWob = (0.5 + hold*1.2 + chaos*1.5 + (mode < 0.5 ? 0.6 : 0.0))*smoothstep(0.02, 0.12, r);
  vAlpha = vis*(mode < 0.5 ? 0.55 : 1.0);
}
`;

const bubbleFS = /* glsl */`
uniform float uTime;
varying vec2 vUv; varying float vBlur; varying float vEnergy; varying float vSeed; varying float vPop;
varying float vThin; varying float vChaos; varying float vWob; varying float vAlpha;
${COMMON}
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 3; i++){ s += a*noise(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; } return s/0.875; }
void main(){
  vec2 p = vUv;
  float ang = atan(p.y, p.x);
  float wob = 1.0 + vWob*(0.03*sin(3.0*ang + uTime*2.1 + vSeed*20.0)
                        + 0.022*sin(2.0*ang - uTime*1.7 + vSeed*13.0)
                        + 0.012*sin(5.0*ang + uTime*3.1 + vSeed*7.0));
  float d = length(p)/wob;
  if (vPop > 0.0){
    float rad = 1.0 + vPop*1.4;
    float ring = exp(-pow((d - rad)/(0.04 + 0.12*vPop), 2.0))*(1.0 - vPop);
    vec3 c = thinFilm(0.7, 300.0 + 900.0*fract(ang/TAU + vSeed));
    gl_FragColor = vec4((c*1.5 + 0.25)*ring*max(vEnergy, 0.3), 1.0);
    return;
  }
  float aa = fwidth(d) + vBlur;
  float edge = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, d);
  if (edge < 0.002) discard;
  float blurMix = smoothstep(0.2, 1.2, vBlur);
  float dc = min(d, 0.995);
  vec2 nxy = (p/wob)*(dc/max(d, 1e-4));
  vec3 N = vec3(nxy, sqrt(max(0.0, 1.0 - dc*dc)));
  float cosI = N.z;
  vec3 col = vec3(0.0);
  float baseT = 260.0 + 380.0*fract(vSeed*3.7 + uTime*0.03);
  if (blurMix < 0.999){
    // gentle swirling film: drains to the bottom (thicker), thins at the top
    vec2 q = nxy*1.3 + vec2(vSeed*17.0, vSeed*5.0);
    float n = fbm(q + vec2(uTime*0.05, -uTime*0.08));
    float th = 140.0 + 520.0*n + 220.0*(0.5 - 0.5*nxy.y);
    if (vChaos > 0.0) th += vChaos*320.0*(fbm(q*1.2 - vec2(uTime*0.5, uTime*0.3)) - 0.5);
    th = max(th, 0.0)*(1.0 - 0.95*vThin);
    vec3 film = thinFilm(cosI, th);
    // fringes finer than a pixel average out instead of aliasing into grain
    float alias = smoothstep(25.0, 110.0, fwidth(th));
    film = mix(film, thinFilm(0.8, baseT)*0.6 + 0.2, alias);
    float F = 0.04 + 0.96*pow(1.0 - cosI, 4.0);
    vec3 V = vec3(0.0, 0.0, -1.0);
    vec3 R = reflect(V, N);
    // soft rectangular softbox (macro studio light) + small window + floor bounce
    vec3 kd = normalize(vec3(-0.42, 0.5, 0.76));
    vec3 ku = normalize(cross(kd, vec3(0.0, 0.0, 1.0)));
    vec3 kv = cross(ku, kd);
    vec2 kp = vec2(dot(R, ku), dot(R, kv))/max(dot(R, kd), 0.01);
    vec2 kq = max(abs(kp) - vec2(0.24, 0.34), 0.0);
    float key = (1.0 - smoothstep(0.0, 0.14, length(kq)))*step(0.0, dot(R, kd));
    float fill = smoothstep(0.955, 0.99, dot(R, normalize(vec3(0.6, -0.3, 0.74))))*0.35;
    float back = smoothstep(0.93, 0.99, dot(reflect(V, vec3(-nxy, N.z)), kd))*0.28;
    float floorRefl = smoothstep(-0.2, -0.75, R.y)*0.06;
    float rim = smoothstep(0.7, 1.0, d);
    col = film*(0.08 + 1.55*F + floorRefl)*(1.0 + vChaos*1.4);
    col += (key*1.1 + fill + back)*mix(vec3(1.0), film*1.5 + 0.15, 0.6);
    col += film*rim*0.3;
  }
  vec3 bok = (thinFilm(0.8, baseT)*0.8 + 0.08)*(0.18 + 0.55*smoothstep(0.6, 1.0, d))*0.75;
  // soft out-of-focus halo outside the silhouette takes the bokeh tint instead of stretched film detail
  col = mix(col, bok, max(blurMix, smoothstep(0.985, 1.0 + aa*0.6, d)));
  gl_FragColor = vec4(col*edge*vEnergy*vAlpha, 1.0);
}
`;

const dropVS = /* glsl */`
uniform float uTime; uniform float uWordScale; uniform float uFocus; uniform float uAperture;
attribute vec3 aOrigin; attribute vec3 aDir; attribute vec4 aData;
varying vec2 vUv; varying float vBlur; varying float vEnergy; varying vec3 vCol;
${COMMON}
void main(){
  float tau = uTime - aData.x;
  float life = 1.3 + fract(aData.z*7.3)*1.0;
  if (tau < 0.0 || tau > life){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  float k = 2.2;
  vec3 pos = aOrigin*uWordScale + aDir*aData.y*(1.0 - exp(-k*tau))/k*uWordScale;
  pos.y -= 0.12*tau*tau;
  float lf = tau/life;
  float fade = (1.0 - lf); fade *= fade;
  float r = max(aData.w*uWordScale*(1.0 - 0.5*lf), 1e-4);
  vec4 mv = modelViewMatrix*vec4(pos, 1.0);
  float coc = min(uAperture*abs(-mv.z - uFocus), 1.0);
  float sr = (r + coc)*1.1;
  mv.xy += position.xy*sr;
  gl_Position = projectionMatrix*mv;
  vUv = position.xy*sr/r;
  vBlur = coc/r;
  vEnergy = r*r/((r + coc)*(r + coc));
  float tw = 0.75 + 0.25*sin(tau*30.0 + aData.z*50.0);
  vCol = hsv2rgb(vec3(aData.z + tau*0.25, 0.75, 1.0))*fade*tw*smoothstep(0.0, 0.05, tau)*2.2;
}
`;

const dropFS = /* glsl */`
varying vec2 vUv; varying float vBlur; varying float vEnergy; varying vec3 vCol;
void main(){
  float d = length(vUv);
  float aa = fwidth(d) + vBlur;
  float e = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, d);
  if (e < 0.002) discard;
  float core = mix(1.0 - 0.6*d, 0.5 + 0.6*smoothstep(0.5, 1.0, d), smoothstep(0.2, 1.0, vBlur));
  gl_FragColor = vec4(vCol*core*e*vEnergy, 1.0);
}
`;

// ---------- word sampling ----------
// twoLine: stacked "MY / WAY" for portrait screens
function buildWord(twoLine, rnd) {
  const W = twoLine ? 1100 : 1600, H = twoLine ? 900 : 420;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  let fs = twoLine ? 400 : 330;
  g.font = `${fs}px ${FONT}`;
  const widest = twoLine ? g.measureText('WAY').width : g.measureText('MY WAY').width;
  if (widest > W * 0.94) { fs *= W * 0.94 / widest; g.font = `${fs}px ${FONT}`; }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (twoLine) { g.fillText('MY', W / 2, H / 2 - fs * 0.5); g.fillText('WAY', W / 2, H / 2 + fs * 0.58); }
  else g.fillText('MY WAY', W / 2, H / 2 + fs * 0.04);
  const data = g.getImageData(0, 0, W, H).data;
  let minX = W, maxX = 0, minY = H, maxY = 0;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    if (data[(y * W + x) * 4 + 3] > 127) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H && data[((y | 0) * W + (x | 0)) * 4 + 3] > 127;
  const wordW = twoLine ? 7.4 : WORD_W;
  const k = wordW / Math.max(1, (maxX - minX));       // world units per px
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const radii = [0.21, 0.155, 0.115, 0.085, 0.062];
  const rMax = 0.21 * 1.1 / k;
  const cell = rMax * 2;
  const gw = Math.ceil(W / cell) + 1;
  const grid = new Map();
  const out = [];
  for (const R of radii) {
    const tries = 9000;
    for (let i = 0; i < tries && out.length < 1400; i++) {
      const rw = R * (0.9 + rnd() * 0.2);
      const rp = rw / k;
      const x = minX + rnd() * (maxX - minX), y = minY + rnd() * (maxY - minY);
      if (!inside(x, y)) continue;
      const q = rp * 0.62;
      if (!inside(x + q, y) || !inside(x - q, y) || !inside(x, y + q) || !inside(x, y - q)) continue;
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
      let ok = true;
      for (let oy = -1; oy <= 1 && ok; oy++) for (let ox = -1; ox <= 1 && ok; ox++) {
        const lst = grid.get((gy + oy) * gw + gx + ox);
        if (!lst) continue;
        for (const b of lst) { const dx = b.px - x, dy = b.py - y; const mind = (b.rp + rp) * 0.92; if (dx * dx + dy * dy < mind * mind) { ok = false; break; } }
      }
      if (!ok) continue;
      // pop wave runs left->right (and top->bottom on two lines)
      const xn = (x - minX) / (maxX - minX), yn = (y - minY) / (maxY - minY);
      const b = { px: x, py: y, rp, x: (x - cx) * k, y: -(y - cy) * k, z: (rnd() - 0.5) * 0.35, r: rw,
                  xn: twoLine ? xn * 0.55 + yn * 0.45 : xn };
      const key = gy * gw + gx;
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push(b);
      out.push(b);
    }
  }
  return { bubbles: out, w: (maxX - minX) * k, h: (maxY - minY) * k };
}

function makeGeo(count) {
  const base = new THREE.PlaneGeometry(2, 2);
  const g = new THREE.InstancedBufferGeometry();
  g.setIndex(base.index);
  g.setAttribute('position', base.attributes.position);
  g.instanceCount = count;
  return g;
}

// ---------- composer ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.45, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
let wordInfo = null, twoLineBuilt = null;
const sceneMeshes = [];

function applySize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(pixelRatio); composer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h); composer.setSize(w, h);
}

function layout() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  applySize();
  const twoLine = camera.aspect < 0.95;
  if (fontReady && twoLine !== twoLineBuilt) buildScene(twoLine);
  const halfH = Math.tan(FOV * Math.PI / 360) * CAMZ, halfW = halfH * camera.aspect;
  uniforms.uSpread.value.set(halfW, halfH);
  if (wordInfo) uniforms.uWordScale.value = Math.min(1.0, (halfW * 2 * 0.86) / wordInfo.w, (halfH * 2 * 0.62) / wordInfo.h);
}
let resizeRaf = 0;
addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(layout); });

let fontReady = false;

function buildScene(twoLine) {
  for (const m of sceneMeshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  sceneMeshes.length = 0;
  twoLineBuilt = twoLine;
  const rnd = mulberry32(20240520);
    wordInfo = buildWord(twoLine, rnd);
  const word = wordInfo.bubbles;
  const AMB = twoLine ? 26 : 44;
  const N = word.length + AMB;
  const aHome = new Float32Array(N * 3), aTarget = new Float32Array(N * 3), aRnd = new Float32Array(N * 4),
        aTimes = new Float32Array(N * 4), aRadius = new Float32Array(N);
  const pops = [];
  word.forEach((b, i) => {
    aHome.set([(rnd() * 2 - 1) * 1.1, (rnd() * 2 - 1) * 1.1, -5 + rnd() * 8], i * 3);
    aTarget.set([b.x, b.y, b.z], i * 3);
    aRnd.set([rnd(), rnd(), rnd(), rnd()], i * 4);
    const popMode = rnd() < 0.6;
    const pt = 7.3 + b.xn * 0.9 + rnd() * 0.25;
    const rt = 9.4 + rnd() * 1.7;
    aTimes.set([rnd() * 0.8, pt, rt, popMode ? 1 : 2], i * 4);
    aRadius[i] = b.r;
    if (popMode) pops.push({ b, pt });
  });
  for (let j = 0; j < AMB; j++) {
    const i = word.length + j;
    // mostly far background bokeh, a few soft foreground orbs
    const front = rnd() < 0.18;
    aHome.set([(rnd() * 2 - 1) * 1.15, (rnd() * 2 - 1) * 1.15, front ? 3 + rnd() * 4 : -10 + rnd() * 8], i * 3);
    aRnd.set([rnd(), rnd(), rnd(), rnd()], i * 4);
    aTimes.set([0, 99, 99, 0], i * 4);
    aRadius[i] = front ? 0.25 + rnd() * 0.35 : 0.12 + Math.pow(rnd(), 2) * 0.45;
  }
  const geo = makeGeo(N);
  geo.setAttribute('aHome', new THREE.InstancedBufferAttribute(aHome, 3));
  geo.setAttribute('aTarget', new THREE.InstancedBufferAttribute(aTarget, 3));
  geo.setAttribute('aRnd', new THREE.InstancedBufferAttribute(aRnd, 4));
  geo.setAttribute('aTimes', new THREE.InstancedBufferAttribute(aTimes, 4));
  geo.setAttribute('aRadius', new THREE.InstancedBufferAttribute(aRadius, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms, vertexShader: bubbleVS, fragmentShader: bubbleFS,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  });
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; scene.add(mesh); sceneMeshes.push(mesh);

  // droplets / rainbow spray
  const K = 6, M = pops.length * K;
  const dO = new Float32Array(M * 3), dD = new Float32Array(M * 3), dA = new Float32Array(M * 4);
  let m = 0;
  for (const { b, pt } of pops) {
    for (let k = 0; k < K; k++, m++) {
      const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      let dx = s * Math.cos(th), dy = s * Math.sin(th), dz = u;
      dx += b.x * 0.06; dy += b.y * 0.12;
      const L = Math.hypot(dx, dy, dz); dx /= L; dy /= L; dz /= L;
      dO.set([b.x + dx * b.r, b.y + dy * b.r, b.z], m * 3);
      dD.set([dx, dy, dz], m * 3);
      dA.set([pt + rnd() * 0.04, 0.8 + rnd() * 1.8, rnd(), 0.012 + rnd() * 0.024], m * 4);
    }
  }
  const dgeo = makeGeo(M);
  dgeo.setAttribute('aOrigin', new THREE.InstancedBufferAttribute(dO, 3));
  dgeo.setAttribute('aDir', new THREE.InstancedBufferAttribute(dD, 3));
  dgeo.setAttribute('aData', new THREE.InstancedBufferAttribute(dA, 4));
  const dmat = new THREE.ShaderMaterial({
    uniforms, vertexShader: dropVS, fragmentShader: dropFS,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  });
  const dmesh = new THREE.Mesh(dgeo, dmat); dmesh.frustumCulled = false; scene.add(dmesh); sceneMeshes.push(dmesh);
}

layout();

async function init() {
  try {
    await Promise.race([document.fonts.load(`300px "Archivo Black"`), new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* fallback font */ }
  fontReady = true;
  layout();

  // ---------- loop ----------
  const hint = document.getElementById('hint'), bar = document.getElementById('bar');
  const qs = new URLSearchParams(location.search);
  const fixedT = qs.has('t') ? Number(qs.get('t')) : null;   // ?t=8.2 freezes a moment (debug/stills)
  let start = performance.now();
  const WL = Math.PI * 2 / LOOP;
  const replay = () => { start = performance.now(); hint.style.opacity = '0.9'; setTimeout(() => hint.style.opacity = '', 600); };
  addEventListener('pointerdown', replay);
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') replay(); });
  setTimeout(() => hint.classList.add('dim'), 4000);

  // adaptive resolution: drop pixel ratio if the device can't hold ~45 fps
  let acc = 0, frames = 0, last = performance.now();
  renderer.setAnimationLoop((now) => {
    const dt = now - last; last = now;
    if (document.visibilityState === 'visible' && dt < 250) { acc += dt; frames++; }
    if (acc > 2500) {
      const fps = frames * 1000 / acc;
      if (fps < 45 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); applySize(); }
      acc = 0; frames = 0;
    }
    const dbg = window.__debugT ?? fixedT;
    const t = dbg != null ? dbg % LOOP : (((now - start) / 1000) % LOOP + LOOP) % LOOP;
    uniforms.uTime.value = t;
    camera.position.set(0.35 * Math.sin(WL * t), 0.2 * Math.cos(WL * t), CAMZ + 0.5 * Math.cos(WL * t));
    camera.lookAt(0, 0, 0);
    uniforms.uFocus.value = camera.position.length();
    composer.render();
    bar.style.transform = `scaleX(${t / LOOP})`;
  });
}
init();
</script>
